- name: Check the running instance of SatPulse
  hosts: all
  become: yes
  vars:
    tai_utc_diff: 37  # TAI-UTC difference in seconds
    sys_clock_offset: 100000  # Maximum allowed difference in nanoseconds
    
  tasks:
    - name: Check if SatPulse service is running
      command: "systemctl is-active satpulse@{{ instance }}"
      register: service_status
      failed_when: false
 
    - name: Fail if service is not running
      fail:
        msg: "SatPulse service (satpulse@{{ instance }}) is not active"
      when: service_status.stdout != "active"
      
    - name: Run phc_ctl to compare clock
      command: "phc_ctl -q {{ interface }} cmp"
      register: phc_result
      
    - name: Extract offset value
      set_fact:
        offset_raw: "{{ phc_result.stdout | regex_search('\\s(-?\\d+)ns', '\\1') | first }}"
        
    - name: Convert offset to number and calculate difference
      set_fact:
        offset_value: "{{ offset_raw | int }}"
        expected_offset: "{{ (tai_utc_diff * -1000000000) | int }}"
        offset_diff: "{{ ((offset_raw | int) - (tai_utc_diff * -1000000000)) | abs }}"

    - name: Display clock offset information
      debug:
        msg: 
          - "PHC and system clock difference: {{ offset_diff }}ns"
          
    - name: Fail if clock offset exceeds threshold
      fail:
        msg: "Clock offset difference ({{ offset_diff }} ns) exceeds threshold ({{ sys_clock_offset }} ns)"
      when: (offset_diff | int) > (sys_clock_offset | int)

    - name: Check chrony stratum
      block:  
        - name: Run chronyc tracking command
          command: "chronyc tracking"
          register: chronyc_output

        - name: Extract stratum value directly from chronyc tracking output
          set_fact:
            chronyc_stratum: "{{ (chronyc_output.stdout | regex_search('Stratum\\s+:\\s+(\\d+)', '\\1')) | first }}"
        - name: Fail if stratum is not 1
          fail:
            msg: "Test failed: Chrony stratum is {{ chronyc_stratum }}; expected 1"
          when: chronyc_stratum != "1"
       
    - name: Check system log warnings and errors
      block:
        - name: Get the current service invocation ID
          command: "systemctl show --value -p InvocationID satpulse@{{ instance }}"
          register: invocation_id

        - name: Check for warnings or errors in logs
          shell: "journalctl -q --priority=0..4 _SYSTEMD_INVOCATION_ID={{ invocation_id.stdout }} --no-pager"
          register: warning_logs
          failed_when: false

        - name: Fail if any warnings or errors found
          fail:
            msg: "Unexpected warnings/errors in logs: {{ warning_logs.stdout }}"
          when: warning_logs.stdout | length > 0

        - name: Get all mode change logs
          shell: "journalctl -q --priority=6 _SYSTEMD_INVOCATION_ID={{ invocation_id.stdout }} --no-pager | grep 'changing mode'"
          register: mode_change_logs
          failed_when: false

        - name: Filter for converging to tracking transitions
          set_fact:
            tracking_transitions: "{{ mode_change_logs.stdout_lines | select('search', 'from=converging to=tracking') | list }}"

        - name: Display all mode change logs on failure
          debug:
            var: mode_change_logs.stdout_lines
          when: (tracking_transitions | length) != 1

        - name: Fail if not exactly one converging to tracking transition
          fail:
            msg: "Expected exactly 1 'changing mode: from=converging to=tracking' log line, found {{ tracking_transitions | length }}"
          when: (tracking_transitions | length) != 1

    - name: Analyze clock log
      block:
        - name: Execute clocklog.py script
          command: "python3 - /var/log/satpulse/clock.{{ interface }}.log"
          args:
            stdin: "{{ lookup('file', './clocklog.py') }}"
          register: clock_log
          changed_when: false  # Avoids marking task as "changed" unless needed

        - name: Display output in Ansible log
          debug:
            var: clock_log.stdout_lines