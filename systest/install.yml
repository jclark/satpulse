- name: Install SatPulse
  hosts: all
  when: not virtual_host
  vars:
    package_dir: "/home/jjc/satpulse-pkg"
    control_machine_package_dir: "~/src/satpulse/out/"
    debian_arch_map:
      x86_64: "amd64"
      aarch64: "arm64"

  tasks:
    - name: Set package filename for Debian
      set_fact:
        package_pattern: "satpulse_[0-9].[0-9]*_{{ debian_arch_map[ansible_architecture] }}.deb"
      when: ansible_os_family == "Debian"

    - name: Set package filename for RedHat
      set_fact:
        package_pattern: "satpulse-[0-9].[0-9]*.{{ ansible_architecture }}.rpm"
      when: ansible_os_family == "RedHat"

    - name: Find latest package for each host (on control machine)
      delegate_to: localhost
      find:
        paths: "{{ control_machine_package_dir }}"
        patterns: "{{ package_pattern }}"
        file_type: any
      register: found_packages

    - name: Fail if no package found
      fail:
        msg: "No package found for architecture {{ ansible_architecture }} and OS {{ ansible_os_family }}"
      when: found_packages.matched == 0

    - name: Choose package
      set_fact:
        package: "{{ (found_packages.files | sort(attribute='mtime') | last)['path'] | basename }}"

    - name: Ensure package directory exists
      file:
        path: "{{ package_dir }}"
        state: directory
    
    - name: Copy package to remote machine
      copy:
        src: "{{ control_machine_package_dir }}/{{ package }}"
        dest: "{{ package_dir }}/"
        mode: '0644'

    - name: Stop all instances of SatPulse service
      become: yes
      shell: "systemctl stop 'satpulse@*' || true"
      
    - name: Remove any systemd service file from source install
      become: yes
      file:
        path: /etc/systemd/system/satpulse@.service
        state: absent

    - name: Install package on Debian
      become: yes
      apt:
        deb: "{{ package_dir }}/{{ package }}"
        allow_downgrade: true
      when: ansible_os_family == "Debian"

    - name: Install package on RedHat
      become: yes
      command: "rpm -Uvh --oldpackage --replacepkgs {{ package_dir }}/{{ package }}"
      when: ansible_os_family == "RedHat"

