- name: Start SatPulse service
  hosts: all
  become: yes
    
  tasks:
    - name: Stop SatPulse service
      systemd:
        name: "satpulse@{{ instance }}"
        state: stopped

    - name: Configure GPS receiver
      script: "gpscfg/{{ inventory_hostname_short }}.sh"
      environment:
        DEVICE: "/dev/{{ instance }}"
        SPEED: "{{ speed }}"
      when: lookup('fileglob', 'gpscfg/' + inventory_hostname_short + '.sh') | length > 0

    - name: Create temporary logrotate config
      copy:
        content: |
          /var/log/satpulse/clock.{{ interface }}.log {
              size 10M
              rotate 5
              compress
              missingok
              notifempty
              create 0644 root root
          }
        dest: /tmp/satpulse-logrotate-{{ instance }}.conf
        mode: '0644'
      when: interface != ""

    - name: Rotate log file if needed
      command: logrotate -f -s /tmp/logrotate-{{ instance }}.state /tmp/satpulse-logrotate-{{ instance }}.conf
      register: logrotate_result
      changed_when: logrotate_result.rc == 0
      when: interface != ""

    - name: Clean up temporary logrotate config
      file:
        path: /tmp/satpulse-logrotate-{{ instance }}.conf
        state: absent
      when: interface != ""

    - name: Initialize PHC
      command: "phc_ctl -q {{ interface }} set 0 freq 0"
      when: interface != ""

    - name: Start SatPulse service
      systemd:
        name: "satpulse@{{ instance }}"
        state: restarted

    - name: Restart chrony
      systemd:
        name: "{{ 'chronyd' if ansible_os_family == 'RedHat' else 'chrony' }}"
        state: restarted
