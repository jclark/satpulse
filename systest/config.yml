---
- name: Configure SatPulse
  hosts: all
  become: yes
  tasks:
    - name: Set device fact
      set_fact:
        device: "/dev/{{ instance }}"

    - name: Stat the device so we can check if it is character device
      ansible.builtin.stat:
        path: "{{ device }}"
        follow: true
      register: device_stat

    - name: Fail if not a character device
      fail:
        msg: "{{ device }} is not a character device"
      when: not (device_stat.stat.exists and device_stat.stat.ischr)

    - name: Edit the SatPulse config file
      ini_file:
        path: "{{ config_file }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
      loop:
        - { section: "phc", option: "interface", value: '"{{ interface }}"' }
        - { section: "phc", option: "channel", value: "{{ channel }}" }
        - { section: "serial", option: "device", value: '"{{ device }}"' }
        - { section: "serial", option: "speed", value: "{{ speed }}" }
        - { section: "gps", option: "config", value: "{{ config }}" }
        - { section: "gps", option: "vendor", value: "{{ vendor }}" }
        - { section: "log", option: "clock", value: "true" }
        - { section: "ntp", option: "sock.path", value: '"{{ sock_path }}"'}
        - { section: "[http]", option: "listen", value: '":{{ http_port }}"' }

    - name: Set the PHC pin
      ini_file:
        path: "{{ config_file }}"
        section: phc
        option: pin
        value: "{{ pin }}"
      when: pin | string | length > 0

    # A PHC without pins (BeagleY-AI CPTS) must have no pin key at all: pin: ""
    - name: Remove the PHC pin for a PHC without pins
      ini_file:
        path: "{{ config_file }}"
        section: phc
        option: pin
        state: absent
      when: pin | string | length == 0

    - name: Remove old options from SatPulse config file
      ini_file:
        path: "{{ config_file }}"
        section: "{{ item.section }}"
        option: "{{ item.option }}"
        state: "absent"
        exclusive: "true"
      loop:
        - { section: "gps", option: "nmeaNumbering" }
        - { section: "gps", option: "pulseWidth" }
