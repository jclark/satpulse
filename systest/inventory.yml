all:
  vars:
    ansible_user: jjc
    ansible_python_interpreter: auto_silent
    virtual_host: false  # Set to true for virtual hosts (multiple instances on same machine)
    instance: ttyAMA0  # Instance for systemd service
    pin: 0             # PHC pin
    channel: 0         # PHC channel
    speed: 9600        # Baud rate
    interface: eth0    # Network interface
    config: "true"     # Enable GPS configuration
    vendor: '"u-blox"' # GPS receiver vendor
    config_file: /etc/satpulse.toml  # SatPulse config file path
    http_port: 2000    # HTTP monitoring port
    sock_path: /var/run/chrony.satpulse.sock  # chrony refclock SOCK path (must match chrony.conf)
    ansible_ssh_common_args: '-o "SetEnv TERM=dumb"' # needed for Fedora 43

  children:
    testing:
      hosts:
        abondance.lan:
        abondance-ttySEP0.lan:
        brie.lan:
        chaource.lan:
        gubbeen.lan:
        maasdam.lan:
        morbier.lan:
        pecorino.lan:
        ricotta.lan:
        roquefort.lan:
        serpa.lan:
        taleggio.lan:
        vacherin.lan:
        valdeon.lan:
        valencay.lan:
        valtellina.lan:
        venaco.lan:
        wensleydale.lan:
    # Hosts that get satpulse package installs/updates (install.yml, sysupdate.yml).
    # testing plus hosts not (yet) exercised by the test cycle; excludes mascarpone
    # (production - upgraded deliberately, never by a fleet-wide run).
    install:
      children:
        testing:
      hosts:
        edam.lan:
        fontina.lan:
        montasio.lan:
        raschera.lan:
    virtual_hosts:
      hosts:
        abondance-ttySEP0.lan:
  
  hosts:
    # BG7TBL CM55 on USB (PL2303)
    vacherin.lan:
      speed: 38400
      instance: ttyUSB0

    # ZED-X20P on USB
    roquefort.lan:
      speed: 230400
      instance: ttyACM0

    # LEA-6T
    pecorino.lan:
      interface: end0
      instance: ttyAMA3

    # ZED-F9T-20B in gnss.store dongle
    maasdam.lan:
      instance: ttyACM0
      speed: 230400
      interface: eth0

    toma.lan:
      instance: ttyACM0
      speed: 38400
      interface: enp1s0

    # ZED-F9P in M.2 slot
    abondance.lan:
      instance: ttyUBX0
      interface: enp4s0
      speed: 115200
      pin: 1

    # Septentrio mosaic on USB (second GPS on same machine as abondance.lan)
    abondance-ttySEP0.lan:
      ansible_host: abondance.lan
      instance: ttySEP0
      interface: enp5s0
      speed: 115200
      config: "false"
      vendor: '"Septentrio"'
      config_file: /etc/satpulse.d/ttySEP0.toml
      http_port: 2001
      sock_path: /var/run/chrony.satpulse.ttySEP0.sock
  
    # AT632-6T-30 on UART
    ricotta.lan:
      vendor: '"casic"'
      speed: 115200
    
    # ATGM332D (URANUS5) on UART
    venaco.lan:
      vendor: '"zhongke"'

    # LEA-M8T over RS232
    caciocavallo.lan:
      instance: ttyAMA3

    # LEA-M8F in Timebeat sandwich board
    morbier.lan: # all default

    # MAX-F10S in Timebeat sandwich board
    valdeon.lan: # all default

    # Techtotop/Taidou T303-5D on a CM5
    valtellina.lan:
      speed: 115200
      config: "false"
      vendor: '"Techtotop"'

    # LEA-F9T
    mascarpone.lan:
      speed: 115200

    # Quectel LG290P on a CM4
    chaource.lan:
      speed: 460800
      config: "false"
      vendor: '"Quectel"'

    # UM960 on UART
    wensleydale.lan:
      speed: 115200
      vendor: '"Unicore"'
    
    # TimeHAT on Pi 5 with M.2 NEO-M9N
    taleggio.lan:
      speed: 38400
      interface: eth1
      pin: 2
    
    # UM980 on serial
    serpa.lan:
      speed: 230400
      vendor: '"Unicore"'

    # NEO-F10T EVK attached to E810-XXVDA4T
    brie.lan:
      speed: 38400
      instance: ttyUSB0
      interface: enp1s0f0np0
      pin: 1
      channel: 1
    
    # LEA-M8T on UART
    valencay.lan: # all default

    # M10050-KB on i210 on Raspberry Pi 5
    gubbeen.lan:
      interface: eth1
      speed: 38400

    # NEO-F10N on FT232R USB adapter, PPS on CTS, feeding ntpd-rs (no PHC)
    edam.lan:
      interface: ""
      instance: ttyUSB0
      speed: 38400
      sock_path: /run/ntpd-rs/satpulse.ttyUSB0.sock
    
    # Raspberry Pi 5
    raschera.lan: # all defaults
    
    # Raspberry Pi 3
    montasio.lan:
      interface: ""

    fontina.lan:
      interface: ""
