all:
  vars:
    ansible_user: jjc
    ansible_python_interpreter: auto_silent
    instance: ttyAMA0  # Instance for systemd service
    pin: 0             # PHC pin
    speed: 9600        # Baud rate
    interface: eth0    # Network interface
    config: "true"     # Enable GPS configuration

  children:
    testing:
      hosts:
        abondance.lan:
        burrata.lan:
        caciocavallo.lan:
        chaource.lan:
        morbier.lan:
        toma.lan:
        vacherin.lan:
        valdeon.lan:
  
  hosts:
    # UM980 on USB
    vacherin.lan:
      speed: 115200
      instance: ttyUSB0
      config: "false"

    # LEA-6T
    burrata.lan:
      interface: end0
      instance: ttyAMA3

    # EVK-F10T on USB
    toma.lan:
      instance: ttyUSB0
      speed: 38400
      interface: enp1s0

    # ZED-F9P in M.2 slot
    abondance.lan:
      instance: ttyACM0
      interface: enp4s0
      pin: 1
  
    ricotta.lan: # all default
    
    # TAU-1201
    venaco.local:
      speed: 115200
      config: "false"

    # LEA-M8T over RS232
    caciocavallo.lan:
      instance: ttyAMA3

    # LEA-M8F in Timebeat sandwich board
    morbier.lan: # all default

    # MAX-F10S in Timebeat sandwich board
    valdeon.lan: # all default

    # LEA-F9T
    mascarpone.lan:
      speed: 115200

    # UBX-G7020 in SR1723U7
    chaource.lan: # all default

    # UM960 on UART
    wensleydale.lan:
      speed: 115200
      config: "false"
     
