all:
  vars:
    ansible_user: jjc
    ansible_python_interpreter: auto_silent
    virtual_host: false  # Set to true for virtual hosts (multiple instances on same machine)
    instance: ttyAMA0  # Instance for systemd service
    pin: 0             # PHC pin
    speed: 9600        # Baud rate
    interface: eth0    # Network interface
    config: "true"     # Enable GPS configuration
    config_file: /etc/satpulse.toml  # SatPulse config file path
    http_port: 2000    # HTTP monitoring port
    ansible_ssh_common_args: '-o "SetEnv TERM=dumb"' # needed for Fedora 43

  children:
    testing:
      hosts:
        abondance.lan:
        abondance-ttyS0.lan:
        caciocavallo.lan:
        morbier.lan:
        pecorino.lan:
        roquefort.lan:
        serpa.lan:
        taleggio.lan:
        toma.lan:
        vacherin.lan:
        valtellina.lan:
    virtual_hosts:
      hosts:
        abondance-ttyS0.lan:
  
  hosts:
    # SinoGNSS K901 on USB
    vacherin.lan:
      speed: 115200
      instance: ttyUSB0
      config: "false"

    # NEO-F10T on USB
    roquefort.lan:
      speed: 38400
      instance: ttyUSB0

    # LEA-6T
    pecorino.lan:
      interface: end0
      instance: ttyAMA3

    # ZED-F9T-20B in gnss.store dongle
    maasdam.lan:
      instance: ttyACM0
      speed: 38400
      interface: eth0

    toma.lan:
      instance: ttyACM0
      speed: 38400
      interface: enp1s0

    # ZED-F9P in M.2 slot
    abondance.lan:
      instance: ttyACM0
      interface: enp4s0
      speed: 38400
      pin: 1

    # BG7TBL CM55 (second GPS on same machine as abondance.lan)
    abondance-ttyS0.lan:
      ansible_host: abondance.lan
      instance: ttyS0
      interface: enp5s0
      speed: 38400
      config: "false"
      config_file: /etc/satpulse.d/ttyS0.toml
      http_port: 2001
  
    ricotta.lan: # all default
    
    # TAU-1201
    venaco.local:
      speed: 115200
      config: "false"

    # LEA-M8T over RS232
    caciocavallo.lan:
      instance: ttyAMA3

    # LEA-M8F in Timebeat sandwich board
    morbier.lan: # all default

    # MAX-F10S in Timebeat sandwich board
    valdeon.lan: # all default

    # NEO-F10N on a CM5
    valtellina.lan:
      speed: 38400

    # LEA-F9T
    mascarpone.lan:
      speed: 115200

    # UBX-G7020 in SR1723U7
    chaource.lan: # all default

    # UM960 on UART
    wensleydale.lan:
      speed: 115200
      config: "false"
    
    # TimeHAT on Pi 5 with M.2 NEO-M9N
    taleggio.lan:
      speed: 38400
      interface: eth1
      pin: 2
    
    # UM980 on serial
    serpa.lan:
      speed: 115200
      config: "false"
