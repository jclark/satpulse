<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Current time (using SSE)</title>
  <style>
    #time {
      font-size: 64px;
      font-weight: bold;
      color: blue;
    }

    #date {
      font-size: 18px;
      color: gray;
    }

  </style>
</head>
<body>
  <h1>Time from GPS</h1>
  <div id="time"></div>
  <div id="date"></div>

  <script>
    const url = new URL(window.location.href);
    const endpoint = url.origin + url.pathname + "/sse";
    const eventSource = new EventSource(endpoint);
    const timeFormatOptions = {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false,
      timeZoneName: "short"
    }

    const dateFormatOptions = {
      year: "numeric",
      month: "long",
      day: "numeric"
    }

    function displayDate(d) {
       document.getElementById("time").textContent = Intl.DateTimeFormat(undefined, timeFormatOptions).format(d)
       document.getElementById("date").textContent = Intl.DateTimeFormat(undefined, dateFormatOptions).format(d)
    }
    // displayDate(date.Now())
    eventSource.addEventListener("time", function(event) {
      displayDate(new Date(event.data));
    });
  </script>
</body>
</html>
