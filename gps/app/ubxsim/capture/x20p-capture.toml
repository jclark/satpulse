#:schema ../../../../configs/gpsmsg/gpsmsg-schema.json
# u-blox X20P capture kit for the receiver simulator personality (#362).
#
# Two capture sessions, driven by capture-x20p.sh:
#
#   1. Personality capture: -t mon-ver,mon-gnss,valget-default
#      Polls MON-VER and MON-GNSS, then dumps the Default configuration layer with
#      CFG-VALGET polls of the all-groups wildcard key, one poll per
#      64-item page. The page count is generous, sized well past any
#      known firmware database. Polls past the end of the database
#      return empty pages on the X20; F9P-era firmware NAKs them.
#      Both are expected.
#
#   2. Replay-log recording setup, two invocations (ubxval and
#      ubxvalport tags cannot be selected together):
#      -t rate-1hz
#      -t enable-out,enable-msgs,enable-rtcm --port <port>
#      Sets 1 Hz nav epochs and configures, in the RAM layer only, the
#      port's UBX, NMEA and RTCM3X output protocols and every
#      message satpulse can ask for plus the standard NMEA sentences
#      and RTCM output, so the recording contains per-epoch content
#      for all of them regardless of the receiver's current
#      configuration. UBX-TIM-SVIN is not included: the X20 (HPG)
#      firmware has no MSGOUT key for it and would NAK the whole set.
#      RTCM is recorded as MSM7 only, with MSM4 explicitly disabled;
#      the simulator derives MSM4 from the recorded MSM7.
#      -t tmode-svin
#      Starts a survey-in (RAM only) just before the recording, so the
#      replay bank has NAV-SVIN progressing, survey completion, and the
#      receiver in base mode afterwards. The 60 s minimum duration and
#      loose 10 m accuracy limit make the survey complete on time, well
#      inside the recording.

[[ubx]]
tag = "mon-ver"
description = "Poll MON-VER for the personality identity"
class = 0x0A
id = 0x04

[[ubx]]
tag = "mon-gnss"
description = "Poll MON-GNSS (GNSS selection and signal plans, replayed verbatim)"
class = 0x0A
id = 0x28

# CFG-VALGET polls: version 0, layer 7 (Default), position N*64,
# key 0x0fffffff (all items in all groups).

[[ubx]]
tag = "valget-default"
description = "Dump the Default configuration layer, 64 items per poll"
class = 0x06
id = 0x8B
payload.types = "U1U1U2U4"
payload.values = [0, 7, 0, 0x0FFFFFFF]

