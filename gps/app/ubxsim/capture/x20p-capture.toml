# RTCM output for the replay recording (RAM only): MSM7 on, MSM4 off
# (the integration manual warns against outputting both). TYPE1005
# emits only when the receiver is in base mode.

[[ubxvalport]]
tag = "enable-rtcm"
description = "Enable RTCM output (MSM7 set, 1230, 1005), disable MSM4 (RAM only)"
# RTCM-3X-TYPE1077 (GPS MSM7)
key.usb = 0x209102CF
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1087 (GLONASS MSM7)
key.usb = 0x209102D4
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1097 (Galileo MSM7)
key.usb = 0x2091031B
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1127 (BeiDou MSM7)
key.usb = 0x209102D9
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1230 (GLONASS code-phase biases)
key.usb = 0x20910306
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1005 (stationary ARP; emits only in base mode)
key.usb = 0x209102C0
value = 1

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1074 (GPS MSM4) off
key.usb = 0x20910361
value = 0

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1084 (GLONASS MSM4) off
key.usb = 0x20910366
value = 0

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1094 (Galileo MSM4) off
key.usb = 0x2091036B
value = 0

[[ubxvalport]]
tag = "enable-rtcm"
# RTCM-3X-TYPE1124 (BeiDou MSM4) off
key.usb = 0x20910370
value = 0

# Survey-in start for the replay recording: CFG-TMODE-MODE=SURVEY_IN,
# CFG-TMODE-SVIN_MIN_DUR, CFG-TMODE-SVIN_ACC_LIMIT (0.1 mm units).

[[ubxval]]
tag = "tmode-svin"
description = "Start survey-in (RAM only): 60 s minimum duration, 10 m accuracy limit"
keys = [0x20030001, 0x40030010, 0x40030011]
types = "U1U4U4"
values = [1, 60, 100000]
