[[ubxval]]
tag = "rate-1hz"
description = "Set 1 Hz measurement and navigation rate (RAM only)"
keys = [0x30210001, 0x30210002]
types = "U2U2"
values = [1000, 1]

# Output protocols for the replay recording, so the recording does
# not depend on the receiver's current output-protocol configuration.

[[ubxvalport]]
tag = "enable-out"
description = "Enable UBX, NMEA and RTCM3X output protocols (RAM only)"
# OUTPROT UBX (not port-offset inferable; all five keys explicit)
key.i2c = 0x10720001
key.uart1 = 0x10740001
key.uart2 = 0x10760001
key.usb = 0x10780001
key.spi = 0x107A0001
value = 1

[[ubxvalport]]
tag = "enable-out"
# OUTPROT NMEA
key.i2c = 0x10720002
key.uart1 = 0x10740002
key.uart2 = 0x10760002
key.usb = 0x10780002
key.spi = 0x107A0002
value = 1

[[ubxvalport]]
tag = "enable-out"
# OUTPROT RTCM3X
key.i2c = 0x10720004
key.uart1 = 0x10740004
key.uart2 = 0x10760004
key.usb = 0x10780004
key.spi = 0x107A0004
value = 1

# Message enables for the replay recording, one CFG-VALSET each,
# rate 1 on the port given by --port (RAM only).

[[ubxvalport]]
tag = "enable-msgs"
description = "Enable all messages for the replay recording (RAM only)"
# UBX-NAV-SAT
key.usb = 0x20910018
value = 1

[[ubxvalport]]
tag = "enable-msgs"
# UBX-NAV-TIMEGPS
key.usb = 0x2091004A
value = 1

[[ubxvalport]]
tag = "enable-msgs"
# UBX-NAV-TIMEGAL
key.usb = 0x20910059
value = 1

[[ubxvalport]]
tag = "enable-msgs"
# UBX-NAV-TIMEGLO
key.usb = 0x2091004F
value = 1

[[ubxvalport]]
