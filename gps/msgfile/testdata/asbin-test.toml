# Allystar binary test messages for correlator tests.

# CFG set: expects ACK only, no data.
[[asbin]]
tag = "set-pps"
class = 0x06
id = 0x07
payload.types = "U1"
payload.values = [0]

# CFG poll: expects ACK + data response.
[[asbin]]
tag = "get-pps"
class = 0x06
id = 0x07

# Non-CFG poll: expects data only, no ACK.
[[asbin]]
tag = "poll-dop"
class = 0x01
id = 0x04

# CFG-SIMPLERST: no response expected (receiver resets).
[[asbin]]
tag = "reset"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [2]

# CFG set with different class/ID for pacing tests.
[[asbin]]
tag = "set-prt"
class = 0x06
id = 0x00
payload.types = "U1"
payload.values = [1]

# Second CFG set with same class/ID as set-pps for ambiguity tests.
[[asbin]]
tag = "set-pps-dup"
class = 0x06
id = 0x07
payload.types = "U1"
payload.values = [1]
