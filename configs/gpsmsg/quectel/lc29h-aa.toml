#:schema ../gpsmsg-schema.json
# Quectel LC29H(AA) configuration messages
# Default baud rate: 115200
# The messages common to the LC29H variants come from lc29h.toml; this file
# adds the PQTM messages that Quectel documents only for the LC29H(AA). It
# uses PQTMCFGFIXRATE for the fix rate, since PAIR050 below 1000 ms needs a
# power-off and a save on the LC29H(AA), and PQTMCFGPPS for the PPS query,
# since PAIR763 is not in the LC29H manual.
#
# Tested boards:
#   LC29H(AA) A03S: firmware LC29HAANR11A03S (2023/12/14), AG3335M V3.0.4
#   LC29H(AA) A05S: firmware LC29HAANR11A05S (2025/09/12), AG3335M V3.2.2
# A03S silently ignores many PQTM commands that A05S supports.

[[include]]
src = "lc29h.toml"

# Verified PQTMUNIQID response on LC29H(AA) A05S
# No response on LC29H(AA) A03S; rejected as unsupported on LC29H(DA)
[[nmea]]
text = "PQTMUNIQID"
tag = "get-uniqid"
description = "Get chip unique ID"

# PQTM output messages only on LC29H(AA)
# Each is rejected with "invalid parameters" on LC29H(DA)

# Verified PQTMLS appears after enable and stops after disable on LC29H(AA) A05S
# Rejected with "invalid parameters" on LC29H(AA) A03S
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMLS,1,1"
tag = "pqtm-ls"
description = "Enable PQTMLS message (leap second forecast)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMLS,0,1"
tag = "pqtm-ls-off"
description = "Disable PQTMLS message"

# Verified PQTMJAMMINGSTATUS appears after enable and stops after disable
# on LC29H(AA) A03S and LC29H(AA) A05S
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMJAMMINGSTATUS,1,1"
tag = "pqtm-jammingstatus"
description = "Enable PQTMJAMMINGSTATUS message (jamming detection)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMJAMMINGSTATUS,0,1"
tag = "pqtm-jammingstatus-off"
description = "Disable PQTMJAMMINGSTATUS message"

# Verified PQTMSTD appears after enable and stops after disable on LC29H(AA) A05S
# Rejected with "invalid parameters" on LC29H(AA) A03S
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSTD,1,1"
tag = "pqtm-std"
description = "Enable PQTMSTD message (position standard deviation)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSTD,0,1"
tag = "pqtm-std-off"
description = "Disable PQTMSTD message"

# NMEA output not supported on LC29H (BA, CA, DA, EA)
# Verified each message appears after enable and stops after disable on
# LC76G(AB) A05S
# Rejected with "invalid parameters" on LC29H(AA) A03S, which rejects
# PQTMCFGMSGRATE for every standard NMEA sentence; not tested on
# LC29H(AA) A05S
[[nmea]]
text = "PQTMCFGMSGRATE,W,GRS,1"
tag = "nmea-grs"
description = "Enable NMEA GRS message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GRS,0"
tag = "nmea-grs-off"
description = "Disable NMEA GRS message"

[[nmea]]
text = "PQTMCFGMSGRATE,W,GNS,1"
tag = "nmea-gns"
description = "Enable NMEA GNS message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GNS,0"
tag = "nmea-gns-off"
description = "Disable NMEA GNS message"

# Fix rate (PQTMCFGFIXRATE,W,<Interval ms>), which takes effect at once on
# LC29H(AA). The PAIR050 form in ../airoha/ag33xx.toml needs the GNSS system
# powered off and the configuration saved for intervals below 1000 ms.
# Verified OK, get-fix-rate returns 500 and GGA comes at 2 Hz after
# fix-rate-2 on LC29H(AA) A05S; fix-rate-1 restores 1 Hz
# No response on LC29H(AA) A03S

[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "fix-rate-1"
description = "Set fix rate to 1 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,500"
tag = "fix-rate-2"
description = "Set fix rate to 2 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,200"
tag = "fix-rate-5"
description = "Set fix rate to 5 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,100"
tag = "fix-rate-10"
description = "Set fix rate to 10 Hz"

# PPS query (PQTMCFGPPS,R,1). pps and pps-off use PAIR752 from
# ../airoha/ag33xx.toml, which works on all our boards; the PAIR763 query
# there is not in the LC29H manual.
# Verified response on LC29H(AA) A03S and LC29H(AA) A05S
[[nmea]]
text = "PQTMCFGPPS,R,1"
tag = "get-pps"
description = "Get PPS configuration"

# System reset and reboot (PQTMSRR); the module sends no reply. Not a
# reload: unsaved changes to most settings survive it.
# Verified boot output and PQTMVER after reboot on LC29H(AA) A03S
# Verified unsaved PPS and geofence settings revert to the saved ones, and
# unsaved changes to 15 PAIR settings (including constellations, elevation
# and SNR masks, NMEA rate and RTCM output) survive, on LC29H(AA) A03S
[[nmea]]
text = "PQTMSRR"
tag = "reboot"
description = "Reboot the receiver"

# Factory reset: restore all parameters to their defaults, reboot to apply
# them, then cold start
# Verified OK, the defaults restored, a reboot and RMC status V after the
# cold start on LC29H(AA) A03S
[[nmea]]
text = "PQTMRESTOREPAR"
tag = "factory-reset"
description = "Restore factory defaults, reboot and cold start"
[[nmea]]
text = "PQTMSRR"
tag = "factory-reset"
delay = 3
[[nmea]]
text = "PQTMCOLD"
tag = "factory-reset"

# NMEA talker ID (PQTMCFGNMEATID,W,<Main_TalkerID>,<GSV_TalkerID>):
# Main_TalkerID 00 = per constellation
# No response on LC29H(AA) A03S; rejected as unsupported on LC29H(DA);
# not tested on LC29H(AA) A05S
[[nmea]]
text = "PQTMCFGNMEATID,R"
tag = "get-nmea-talker"
description = "Get NMEA talker ID"
[[nmea]]
text = "PQTMCFGNMEATID,W,GP,0"
tag = "nmea-talker-gp"
description = "Use talker ID GP"
[[nmea]]
text = "PQTMCFGNMEATID,W,00,0"
tag = "nmea-talker-default"
description = "Use the factory talker IDs"
