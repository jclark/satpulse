#:schema ../gpsmsg-schema.json
# Quectel LC29H PQTM configuration messages common to the LC29H variants
# Included by lc29h-aa.toml (AA) and lc29h-da.toml (DA). The LC29H is built on
# the Airoha AG3335, so this includes the AG3335 PAIR messages.
#
# Tested boards:
#   LC29H(AA) A03S: firmware LC29HAANR11A03S (2023/12/14)
#   LC29H(AA) A05S: firmware LC29HAANR11A05S (2025/09/12)
#   LC29H(DA):      firmware LC29HDANR11A03S_RSA (2024/03/19)

[[include]]
src = "../airoha/ag3335.toml"

# Module firmware version (overrides the chip firmware version from PAIR020)
# Verified PQTMVERNO response on LC29H(AA) A03S, LC29H(AA) A05S and LC29H(DA)
[[nmea]]
text = "PQTMVERNO"
tag = "get-version"
description = "Get module firmware version"

# PQTM output messages (PQTMCFGMSGRATE,W,<MsgName>,<Rate>,<MsgVer>)
# Verified OK and the message appears after enable and stops after disable
# on LC29H(AA) A03S, LC29H(AA) A05S and LC29H(DA), except as noted

# Verified get-pqtm-geofence on LC29H(AA) only
[[nmea]]
text = "PQTMCFGMSGRATE,R,PQTMGEOFENCESTATUS,1"
tag = "get-pqtm-geofence"
description = "Get PQTMGEOFENCESTATUS message rate"

[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,1,1"
tag = "pqtm-pvt"
description = "Enable PQTMPVT message (position, velocity, time)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,0,1"
tag = "pqtm-pvt-off"
description = "Disable PQTMPVT message"

[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,1,2"
tag = "pqtm-epe"
description = "Enable PQTMEPE message (estimated position error)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,0,2"
tag = "pqtm-epe-off"
description = "Disable PQTMEPE message"

# Verified get-pqtm-dop on LC29H(AA) only
[[nmea]]
text = "PQTMCFGMSGRATE,R,PQTMDOP,1"
tag = "get-pqtm-dop"
description = "Get PQTMDOP message rate"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,1,1"
tag = "pqtm-dop"
description = "Enable PQTMDOP message (dilution of precision)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,0,1"
tag = "pqtm-dop-off"
description = "Disable PQTMDOP message"

[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,1,1"
tag = "pqtm-pl"
description = "Enable PQTMPL message (protection level)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,0,1"
tag = "pqtm-pl-off"
description = "Disable PQTMPL message"

[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,1,1"
tag = "pqtm-vel"
description = "Enable PQTMVEL message (velocity)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,0,1"
tag = "pqtm-vel-off"
description = "Disable PQTMVEL message"

# Rejected with "invalid parameters" on LC29H(AA) A03S
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMODO,1,1"
tag = "pqtm-odo"
description = "Enable PQTMODO message (odometer)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMODO,0,1"
tag = "pqtm-odo-off"
description = "Disable PQTMODO message"

# Rejected with "invalid parameters" on LC29H(AA) A03S
# Verified PQTMSVINSTATUS appears during a survey on LC29H(AA) A05S
# Verified OK on LC29H(DA), but no PQTMSVINSTATUS seen after survey
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-svinstatus"
description = "Enable PQTMSVINSTATUS message (survey-in status)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-svinstatus-off"
description = "Disable PQTMSVINSTATUS message"

# Survey-in and fixed position (PQTMCFGSVIN,W,<Mode>,<MinDur>,<3D_AccLimit>,
# <ECEF_X>,<ECEF_Y>,<ECEF_Z>): Mode 0=disable, 1=survey-in, 2=fixed
# Verified OK and get-survey returns the new setting on LC29H(AA) A05S and LC29H(DA)
# Verified PQTMSVINSTATUS reports a new survey after survey on LC29H(AA) A05S
# No response on LC29H(AA) A03S

[[nmea]]
text = "PQTMCFGSVIN,R"
tag = "get-survey"
description = "Get survey-in configuration"

[[nmea]]
text = "PQTMCFGSVIN,W,1,2000,20.0,0,0,0"
tag = "survey"
description = "Start survey-in (2000 fixes, 20m accuracy limit)"

[[nmea]]
text = "PQTMCFGSVIN,W,0,0,0,0,0,0"
tag = "mobile"
description = "Return to mobile mode (disable survey-in or fixed position)"

[[nmea]]
text = "PQTMCFGSVIN,W,2,0,0,-1144698.0455,6090335.4099,1504171.3914"
tag = "fixed-pos-example"
description = "Set fixed ECEF position (example coordinates - replace with yours)"

# Configuration management
# Not tested

[[nmea]]
text = "PQTMSAVEPAR"
tag = "save"
description = "Save configuration to NVM"

# Reboot, which reloads the configuration from NVM
[[nmea]]
text = "PQTMSRR"
tag = "reload"
description = "Reload configuration from NVM (reboot)"

# Factory reset: restore defaults then reboot.
# On LC29H (AA) PQTMRESTOREPAR restores all parameters; on LC29H (BA, CA,
# DA, EA) only those set by PQTM commands, PAIR050 and PAIR062.
[[nmea]]
text = "PQTMRESTOREPAR"
tag = "factory-reset"
description = "Restore factory defaults and reboot"
[[nmea]]
text = "PQTMSRR"
tag = "factory-reset"
