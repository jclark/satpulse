#:schema ../gpsmsg-schema.json
# Quectel LC29H configuration messages common to the LC29H variants
# Included by lc29h-aa.toml (AA) and lc29h-da.toml (DA), which add the
# messages of one variant. The LC29H is built on the Airoha AG3335. The
# messages common with the LC76G come from lc29h_lc76g.toml and the PAIR
# messages only the AG3335 supports from ../airoha/ag3335-add.toml; this
# file adds the PQTM messages Quectel documents for all LC29H variants but
# not for the LC76G.
# Default baud rate: 115200
#
# Tested boards:
#   LC29H(AA) A03S: firmware LC29HAANR11A03S (2023/12/14)
#   LC29H(AA) A05S: firmware LC29HAANR11A05S (2025/09/12)
#   LC29H(DA):      firmware LC29HDANR11A03S_RSA (2024/03/19)
# The restart tags use PAIR004, PAIR005 and PAIR006 from
# ../airoha/ag33xx.toml, which work on all our LC29H boards. PQTMHOT,
# PQTMWARM and PQTMCOLD are documented for all variants and work on
# LC29H(AA) A03S, but LC29H(DA) rejects them as unsupported. The gnss-*
# tags use PAIR066, which only the LC29H(AA) supports; lc29h-da.toml
# overrides them with PQTMCFGCNST.

[[include]]
src = "lc29h_lc76g.toml"

[[include]]
src = "../airoha/ag3335-add.toml"

# Rejected with "invalid parameters" on LC29H(AA) A03S
# Verified PQTMSVINSTATUS appears during a survey on LC29H(AA) A05S
# Verified OK on LC29H(DA), but no PQTMSVINSTATUS seen after survey
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-svinstatus"
description = "Enable PQTMSVINSTATUS message (survey-in status)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-svinstatus-off"
description = "Disable PQTMSVINSTATUS message"

# Survey-in and fixed position (PQTMCFGSVIN,W,<Mode>,<MinDur>,<3D_AccLimit>,
# <ECEF_X>,<ECEF_Y>,<ECEF_Z>): Mode 0=disable, 1=survey-in, 2=fixed
# Verified OK and get-survey returns the new setting on LC29H(AA) A05S and LC29H(DA)
# Verified PQTMSVINSTATUS reports a new survey after survey on LC29H(AA) A05S
# No response on LC29H(AA) A03S

[[nmea]]
text = "PQTMCFGSVIN,R"
tag = "get-survey"
description = "Get survey-in configuration"

[[nmea]]
text = "PQTMCFGSVIN,W,1,2000,20.0,0,0,0"
tag = "survey"
description = "Start survey-in (2000 fixes, 20m accuracy limit)"

[[nmea]]
text = "PQTMCFGSVIN,W,0,0,0,0,0,0"
tag = "mobile"
description = "Return to mobile mode (disable survey-in or fixed position)"

[[nmea]]
text = "PQTMCFGSVIN,W,2,0,0,-1144698.0455,6090335.4099,1504171.3914"
tag = "fixed-pos-example"
description = "Set fixed ECEF position (example coordinates - replace with yours)"

# Factory reset: restore the default configuration, then cold start.
# lc29h-aa.toml overrides this to reboot before the cold start.
# On LC29H (BA, CA, DA, EA) PQTMRESTOREPAR restores only the parameters set
# by PQTM commands, PAIR050 and PAIR062.
# Verified PQTMRESTOREPAR restores an unsaved odometer setting at once, and
# PAIR006 is accepted after it, each sent on its own, on LC29H(DA); the
# sequence is not tested
[[nmea]]
text = "PQTMRESTOREPAR"
tag = "factory-reset"
description = "Restore factory defaults and cold start"
delay = 1
[[nmea]]
text = "PAIR006"
tag = "factory-reset"

# GNSS engine
# Verified output stops after subsys-off and resumes after subsys-on on
# LC29H(AA) A03S and LC29H(DA)
[[nmea]]
text = "PQTMGNSSSTOP"
tag = "subsys-off"
description = "Stop the GNSS engine"
[[nmea]]
text = "PQTMGNSSSTART"
tag = "subsys-on"
description = "Start the GNSS engine"

# Debug logging; the debug-on state can be saved with PQTMSAVEPAR
# Verified OK on LC29H(AA) A03S and LC29H(DA); the debug output itself
# was not checked
[[nmea]]
text = "PQTMDEBUGON"
tag = "debug-log"
description = "Enable debug logging"
[[nmea]]
text = "PQTMDEBUGOFF"
tag = "debug-log-off"
description = "Disable debug logging"
