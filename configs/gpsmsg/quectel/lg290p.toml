#:schema ../gpsmsg-schema.json
# LG290P configuration messages
# Quectel LG290P GNSS receiver
# Default baud rate: 460800

# Get firmware version
[[nmea]]
text = "PQTMVERNO"
tag = "get-version"
description = "Get firmware and hardware version"

# Get PPS configuration
[[nmea]]
text = "PQTMCFGPPS,R,1"
tag = "get-pps"
description = "Get PPS configuration"

# Get constellation configuration
[[nmea]]
text = "PQTMCFGCNST,R"
tag = "get-gnss"
description = "Get constellation configuration"

# Get fix rate
[[nmea]]
text = "PQTMCFGFIXRATE,R"
tag = "get-fix-rate"
description = "Get fix interval"

# Set fix rate
[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "fix-rate-1"
description = "Set fix rate to 1 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,500"
tag = "fix-rate-2"
description = "Set fix rate to 2 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,200"
tag = "fix-rate-5"
description = "Set fix rate to 5 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,100"
tag = "fix-rate-10"
description = "Set fix rate to 10 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,50"
tag = "fix-rate-20"
description = "Set fix rate to 20 Hz"

# Fix-rate precondition for the message-rate check: fast raises the fix rate
# so a fix-coupled message-output bug becomes visible, default restores 1 Hz.
[[nmea]]
text = "PQTMCFGFIXRATE,W,200"
tag = "fixrate-fast"
description = "Set fix rate to 5 Hz (message-rate probe precondition)"
[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "fixrate-default"
description = "Set fix rate to 1 Hz (message-rate probe restore)"

# Get receiver mode (rover/base)
[[nmea]]
text = "PQTMCFGRCVRMODE,R"
tag = "get-mode"
description = "Get receiver mode (rover/base)"

# Get current UART config (response includes port index)
[[nmea]]
text = "PQTMCFGUART,R"
tag = "get-uart"
description = "Get UART configuration"

# Get protocol configuration for UART1/2/3
[[nmea]]
text = "PQTMCFGPROT,R,1,1"
tag = "get-prot"
description = "Get input/output protocol for UART1/2/3"
[[nmea]]
text = "PQTMCFGPROT,R,1,2"
tag = "get-prot"
[[nmea]]
text = "PQTMCFGPROT,R,1,3"
tag = "get-prot"

# Get elevation threshold
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGELETHD,R"
tag = "get-min-elev"
description = "Get elevation threshold"

# Elevation threshold (min-elev) configuration
# Range: -90.0 to 90.0 degrees, default 5.0
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGELETHD,W,0.0"
tag = "min-elev-0"
description = "Set elevation threshold to 0 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,5.0"
tag = "min-elev-5"
description = "Set elevation threshold to 5 degrees (default)"

[[nmea]]
text = "PQTMCFGELETHD,W,10.0"
tag = "min-elev-10"
description = "Set elevation threshold to 10 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,15.0"
tag = "min-elev-15"
description = "Set elevation threshold to 15 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,20.0"
tag = "min-elev-20"
description = "Set elevation threshold to 20 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,25.0"
tag = "min-elev-25"
description = "Set elevation threshold to 25 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,30.0"
tag = "min-elev-30"
description = "Set elevation threshold to 30 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,35.0"
tag = "min-elev-35"
description = "Set elevation threshold to 35 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,40.0"
tag = "min-elev-40"
description = "Set elevation threshold to 40 degrees"

[[nmea]]
text = "PQTMCFGELETHD,W,45.0"
tag = "min-elev-45"
description = "Set elevation threshold to 45 degrees"

# Enable PPS: 100ms pulse, only when locked, rising edge
# Index=1, Enable=1, Duration=100, Mode=2 (fix only), Polarity=1 (high), Reserved=0
[[nmea]]
text = "PQTMCFGPPS,W,1,1,100,2,1,0"
tag = "pps"
description = "Enable PPS output (0.1s pulse, only when locked)"

# Disable PPS output
# Index=1, Enable=0
# Verified OK response and get-pps returns Enable=0 on LG290P
[[nmea]]
text = "PQTMCFGPPS,W,1,0"
tag = "pps-off"
description = "Disable PPS output"

# Get survey-in config
[[nmea]]
text = "PQTMCFGSVIN,R"
tag = "get-survey"
description = "Get survey-in configuration"

# Survey-in: 2000 seconds, 20m accuracy
# Mode=1 (survey-in), CFG_CNT=2000, 3D_AccLimit=20.0, ECEF_X/Y/Z=0
[[nmea]]
text = "PQTMCFGSVIN,W,1,2000,20.0,0,0,0"
tag = "survey"
description = "Start survey-in (2000s, 20m accuracy limit)"

# Mobile mode (disable survey-in or fixed position)
# Mode=0 (disable)
# Verified OK response and get-survey returns Mode=0 on LG290P
[[nmea]]
text = "PQTMCFGSVIN,W,0,0,0,0,0,0"
tag = "mobile"
description = "Return to mobile mode (disable survey-in or fixed position)"

# Fixed position mode (Mode=2)
# ECEF coordinates in meters - example from protocol doc
# X=-1144698.0455, Y=6090335.4099, Z=1504171.3914
# Verified OK response and get-survey returns Mode=2 with coordinates on LG290P
[[nmea]]
text = "PQTMCFGSVIN,W,2,0,0,-1144698.0455,6090335.4099,1504171.3914"
tag = "fixed-pos-example"
description = "Set fixed ECEF position (example coordinates - replace with yours)"

# Save configuration to NVM
[[nmea]]
text = "PQTMSAVEPAR"
tag = "save"
description = "Save configuration to NVM"

# Reload configuration from NVM (reboot receiver)
[[nmea]]
text = "PQTMSRR"
tag = "reload"
description = "Reload configuration from NVM (reboot)"

# Factory reset: restore defaults then reboot
[[nmea]]
text = "PQTMRESTOREPAR"
tag = "factory-reset"
description = "Restore factory defaults and reboot"
[[nmea]]
text = "PQTMSRR"
tag = "factory-reset"

# Reset (reboot receiver)
[[nmea]]
text = "PQTMSRR"
tag = "reset"
description = "Reboot receiver"

# Hot start (keep ephemeris, almanac, position, time)
[[nmea]]
text = "PQTMHOT"
tag = "hot-start"
description = "Perform hot start"

# Warm start (keep almanac, clear ephemeris)
[[nmea]]
text = "PQTMWARM"
tag = "warm-start"
description = "Perform warm start"

# Cold start (clear all data)
[[nmea]]
text = "PQTMCOLD"
tag = "cold-start"
description = "Perform cold start"

# Use only GPS
# GPS=1, GLONASS=0, Galileo=0, BDS=0, QZSS=0, NavIC=0
[[nmea]]
text = "PQTMCFGCNST,W,1,0,0,0,0,0"
tag = "gnss-gps"
description = "Enable GPS all bands"

# Use only Galileo
# GPS=0, GLONASS=0, Galileo=1, BDS=0, QZSS=0, NavIC=0
[[nmea]]
text = "PQTMCFGCNST,W,0,0,1,0,0,0"
tag = "gnss-gal"
description = "Enable Galileo all bands"

# Use GPS and Galileo
# GPS=1, GLONASS=0, Galileo=1, BDS=0, QZSS=0, NavIC=0
[[nmea]]
text = "PQTMCFGCNST,W,1,0,1,0,0,0"
tag = "gnss-gps-gal"
description = "Enable GPS and Galileo all bands"

# Use all constellations
# GPS=1, GLONASS=1, Galileo=1, BDS=1, QZSS=1, NavIC=1
[[nmea]]
text = "PQTMCFGCNST,W,1,1,1,1,1,1"
tag = "gnss-all"
description = "Enable all constellations"

# Baud rate configuration
# Supported: 9600, 115200, 230400, 460800, 921600
[[nmea]]
text = "PQTMCFGUART,W,9600"
tag = "speed-9600"
description = "Set baud rate to 9600"

[[nmea]]
text = "PQTMCFGUART,W,115200"
tag = "speed-115200"
description = "Set baud rate to 115200"

[[nmea]]
text = "PQTMCFGUART,W,230400"
tag = "speed-230400"
description = "Set baud rate to 230400"

[[nmea]]
text = "PQTMCFGUART,W,460800"
tag = "speed-460800"
description = "Set baud rate to 460800"

[[nmea]]
text = "PQTMCFGUART,W,921600"
tag = "speed-921600"
description = "Set baud rate to 921600"

# NMEA Message Control

# Enable NMEA RMC message at rate 1
# Verified GNRMC messages appear in capture after enable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,1"
tag = "nmea-rmc"
description = "Enable NMEA RMC message"

# Disable NMEA RMC message
# Verified GNRMC messages no longer appear after disable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,0"
tag = "nmea-rmc-off"
description = "Disable NMEA RMC message"

# Enable NMEA GGA message at rate 1
# Verified GNGGA messages appear in capture after enable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,1"
tag = "nmea-gga"
description = "Enable NMEA GGA message"

# Disable NMEA GGA message
# Verified GNGGA messages no longer appear after disable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,0"
tag = "nmea-gga-off"
description = "Disable NMEA GGA message"

# Enable NMEA VTG message at rate 1
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,1"
tag = "nmea-vtg"
description = "Enable NMEA VTG message"

# Disable NMEA VTG message
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,0"
tag = "nmea-vtg-off"
description = "Disable NMEA VTG message"

# Enable NMEA GSV message at rate 1
# Verified GSV messages appear in capture after enable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,1"
tag = "nmea-gsv"
description = "Enable NMEA GSV message"

# Disable NMEA GSV message
# Verified GSV messages no longer appear after disable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,0"
tag = "nmea-gsv-off"
description = "Disable NMEA GSV message"

# Enable NMEA GSA message at rate 1
# Verified GNGSA messages appear in capture after enable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,1"
tag = "nmea-gsa"
description = "Enable NMEA GSA message"

# Disable NMEA GSA message
# Verified GNGSA messages no longer appear after disable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,0"
tag = "nmea-gsa-off"
description = "Disable NMEA GSA message"

# Enable NMEA ZDA message at rate 1
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,ZDA,1"
tag = "nmea-zda"
description = "Enable NMEA ZDA message"

# Disable NMEA ZDA message
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,ZDA,0"
tag = "nmea-zda-off"
description = "Disable NMEA ZDA message"

# Enable NMEA GLL message at rate 1
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,1"
tag = "nmea-gll"
description = "Enable NMEA GLL message"

# Disable NMEA GLL message
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,0"
tag = "nmea-gll-off"
description = "Disable NMEA GLL message"

# Disable all NMEA messages
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,0"
tag = "nmea-off"
description = "Disable all NMEA messages"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,0"
tag = "nmea-off"

# Enable NMEA messages for satpulse daemon (RMC, GGA, GSV, GSA)
# Verified RMC, GGA, GSV, GSA messages all appear in capture after enable on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,1"
tag = "nmea-daemon"
description = "Enable NMEA messages for satpulse daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,1"
tag = "nmea-daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,1"
tag = "nmea-daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,1"
tag = "nmea-daemon"

# PQTM Proprietary Message Control
# Rate parameter is per fix (not per second): 1 = every fix, 2 = every 2nd fix.
# PQTM messages require message version parameter.

# Enable PQTMEPE message (estimated position error)
# Verified OK and PQTMEPE messages appear on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,1,2"
tag = "pqtm-epe"
description = "Enable PQTMEPE message (rate of one per fix)"

# Disable PQTMEPE message
# Verified OK on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,0,2"
tag = "pqtm-epe-off"
description = "Disable PQTMEPE message"

# Enable PQTMVEL message (velocity info)
# Verified OK and PQTMVEL messages appear on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,1,1"
tag = "pqtm-vel"
description = "Enable PQTMVEL message (rate of one per fix)"

# Disable PQTMVEL message
# Verified OK on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,0,1"
tag = "pqtm-vel-off"
description = "Disable PQTMVEL message"

# Enable PQTMPVT message (position/velocity/time)
# Verified OK and PQTMPVT messages appear on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,1,1"
tag = "pqtm-pvt"
description = "Enable PQTMPVT message (rate of one per fix)"

# Disable PQTMPVT message
# Verified OK on LG290P
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,0,1"
tag = "pqtm-pvt-off"
description = "Disable PQTMPVT message"

# Enable PQTMNAV message (comprehensive navigation info)
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMNAV,1,1"
tag = "pqtm-nav"
description = "Enable PQTMNAV message (rate of one per fix)"

# Disable PQTMNAV message
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMNAV,0,1"
tag = "pqtm-nav-off"
description = "Disable PQTMNAV message"

# Enable PQTMEOE message (end of epoch)
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEOE,1,1"
tag = "pqtm-eoe"
description = "Enable PQTMEOE message (rate of one per fix)"

# Disable PQTMEOE message
# Added in protocol spec v1.1 (2025-07-25) - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEOE,0,1"
tag = "pqtm-eoe-off"
description = "Disable PQTMEOE message"

# Enable PQTMDOP message (dilution of precision)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,1,1"
tag = "pqtm-dop"
description = "Enable PQTMDOP message (rate of one per fix)"

# Disable PQTMDOP message
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,0,1"
tag = "pqtm-dop-off"
description = "Disable PQTMDOP message"

# Enable PQTMPL message (protection level)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,1,1"
tag = "pqtm-pl"
description = "Enable PQTMPL message (rate of one per fix)"

# Disable PQTMPL message
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,0,1"
tag = "pqtm-pl-off"
description = "Disable PQTMPL message"

# Enable PQTMPPPNAV message (PPP position result)
# Added in R02A01S firmware - requires newer firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPPPNAV,1,1"
tag = "pqtm-pppnav"
description = "Enable PQTMPPPNAV message (rate of one per fix)"

# Disable PQTMPPPNAV message
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPPPNAV,0,1"
tag = "pqtm-pppnav-off"
description = "Disable PQTMPPPNAV message"

# Enable PQTMSVINSTATUS message (survey-in status)
# Does not work on R02 firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-svinstatus"
description = "Enable PQTMSVINSTATUS message (rate of one per fix)"

# Disable PQTMSVINSTATUS message
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-svinstatus-off"
description = "Disable PQTMSVINSTATUS message"

# Enable PQTM messages for R01A04S+ firmware (PVT + VEL + EPE + SVINSTATUS + DOP)
# Sets fix rate to 1 Hz; message rate is one per fix.
[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "pqtm-r01a04"
description = "Enable PQTM messages for R01A04S+ firmware"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,1,1"
tag = "pqtm-r01a04"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,1,1"
tag = "pqtm-r01a04"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,1,2"
tag = "pqtm-r01a04"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-r01a04"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,1,1"
tag = "pqtm-r01a04"

# Disable PQTM messages for R01A04S+ firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,0,1"
tag = "pqtm-r01a04-off"
description = "Disable PQTM messages for R01A04S+ firmware"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,0,1"
tag = "pqtm-r01a04-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,0,2"
tag = "pqtm-r01a04-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-r01a04-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,0,1"
tag = "pqtm-r01a04-off"

# Enable PQTM messages for R01A05S+ firmware (NAV + VEL + EPE + EOE + SVINSTATUS + DOP)
# Sets fix rate to 1 Hz; message rate is one per fix.
[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "pqtm-r01a05"
description = "Enable PQTM messages for R01A05S+ firmware"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMNAV,1,1"
tag = "pqtm-r01a05"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,1,1"
tag = "pqtm-r01a05"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,1,2"
tag = "pqtm-r01a05"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEOE,1,1"
tag = "pqtm-r01a05"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-r01a05"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,1,1"
tag = "pqtm-r01a05"

# Disable PQTM messages for R01A05S+ firmware
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMNAV,0,1"
tag = "pqtm-r01a05-off"
description = "Disable PQTM messages for R01A05S+ firmware"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,0,1"
tag = "pqtm-r01a05-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,0,2"
tag = "pqtm-r01a05-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEOE,0,1"
tag = "pqtm-r01a05-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-r01a05-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,0,1"
tag = "pqtm-r01a05-off"

# SBAS configuration
# Bitmask: bit 0=WAAS, 1=SDCM, 2=EGNOS, 3=BDSBAS, 4=MSAS, 5=GAGAN,
# 6=KASS, 7=ASECNA, 8=SouthPAN. Default 003F enables the first six.
[[nmea]]
text = "PQTMCFGSBAS,R"
tag = "get-sbas"
description = "Get SBAS configuration"

[[nmea]]
text = "PQTMCFGSBAS,W,0"
tag = "sbas-off"
description = "Disable all SBAS"

[[nmea]]
text = "PQTMCFGSBAS,W,003F"
tag = "sbas-on"
description = "Enable default SBAS set (WAAS, SDCM, EGNOS, BDSBAS, MSAS, GAGAN)"

# PPP (Precise Point Positioning)
# Mode=2 (E6 HAS), Datum=1 (WGS84), Timeout=120s,
# Horizontal=0.10m, Vertical=0.15m convergence accuracy thresholds
[[nmea]]
text = "PQTMCFGPPP,W,2,1,120,0.10,0.15"
tag = "ppp-has"
description = "Enable PPP with Galileo E6 HAS source"

# Mode=1 (B2b PPP), Datum=1 (WGS84), other params as defaults
[[nmea]]
text = "PQTMCFGPPP,W,1,1,120,0.10,0.15"
tag = "ppp-b2b"
description = "Enable PPP with BeiDou B2b source"

# Mode=0 (Disable)
[[nmea]]
text = "PQTMCFGPPP,W,0"
tag = "ppp-off"
description = "Disable PPP"

# Base station mode (disables NMEA, enables RTCM MSM4/1005)
[[nmea]]
text = "PQTMCFGRCVRMODE,W,2"
tag = "mode-base"
description = "Set base station mode"

# Rover mode (default NMEA output)
[[nmea]]
text = "PQTMCFGRCVRMODE,W,1"
tag = "mode-rover"
description = "Set rover mode"

# Get RTCM message rates
[[nmea]]
text = "PQTMCFGMSGRATE,R,RTCM3-1005"
tag = "get-rtcm"
description = "Get RTCM message rates"
[[nmea]]
text = "PQTMCFGMSGRATE,R,RTCM3-107X"
tag = "get-rtcm"
[[nmea]]
text = "PQTMCFGMSGRATE,R,RTCM3-108X"
tag = "get-rtcm"
[[nmea]]
text = "PQTMCFGMSGRATE,R,RTCM3-109X"
tag = "get-rtcm"
[[nmea]]
text = "PQTMCFGMSGRATE,R,RTCM3-112X"
tag = "get-rtcm"

# Disable all RTCM messages
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-1005,0"
tag = "rtcm-off"
description = "Disable all RTCM messages"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-107X,0,0"
tag = "rtcm-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-108X,0,0"
tag = "rtcm-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-109X,0,0"
tag = "rtcm-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-112X,0,0"
tag = "rtcm-off"

# Enable RTCM ARP message (1005)
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-1005,1"
tag = "rtcm-arp"
description = "Enable RTCM ARP message (1005)"

# Enable RTCM MSM4 messages for all constellations
# First set MSM type to 4, then enable all constellation outputs
# 107X = GPS, 108X = GLO, 109X = GAL, 112X = BDS
[[nmea]]
text = "PQTMCFGRTCM,W,4,0,-90.0,07,06,0,0"
tag = "rtcm-msm4"
description = "Enable RTCM MSM4 messages for all constellations"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-107X,1,0"
tag = "rtcm-msm4"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-108X,1,0"
tag = "rtcm-msm4"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-109X,1,0"
tag = "rtcm-msm4"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-112X,1,0"
tag = "rtcm-msm4"

# Enable RTCM MSM7 messages for all constellations
# First set MSM type to 7, then enable all constellation outputs
[[nmea]]
text = "PQTMCFGRTCM,W,7,0,-90.0,07,06,0,0"
tag = "rtcm-msm7"
description = "Enable RTCM MSM7 messages for all constellations"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-107X,1,0"
tag = "rtcm-msm7"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-108X,1,0"
tag = "rtcm-msm7"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-109X,1,0"
tag = "rtcm-msm7"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RTCM3-112X,1,0"
tag = "rtcm-msm7"
