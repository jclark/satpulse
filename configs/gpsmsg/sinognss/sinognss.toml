#:schema ../gpsmsg-schema.json
# SinoGNSS K902 configuration messages
# QeeTek K8/K9 series GNSS receiver (NovAtel-style commands)
# Default baud rate: 115200

[default.line]
eol = "\r\n"

# Version / Probe

# Query firmware and hardware version
# Verified VERSION response received on K902 (fw 8.2.4, hw CRDK-902AA-TTT-1)
[[line]]
tag = "get-version"
text = "log versiona once"
description = "Query firmware and hardware version"

# BESTPOS (NovAtel format geodetic position)
# Verified BESTPOSB binary (msg 42) appears at 1Hz in capture on K902
[[line]]
tag = "nov-bestposb"
description = "Enable BESTPOS binary at 1Hz"
text = "log bestposb ontime 1"
# Verified OK response and BESTPOSB messages stop on K902
[[line]]
tag = "nov-bestposb-off"
description = "Disable BESTPOS binary"
text = "unlog bestposb"
# Verified BESTPOSA messages appear at 1Hz in capture on K902
[[line]]
tag = "nov-bestposa"
description = "Enable BESTPOS ASCII at 1Hz"
text = "log bestposa ontime 1"
# Verified OK response and BESTPOSA messages stop on K902
[[line]]
tag = "nov-bestposa-off"
description = "Disable BESTPOS ASCII"
text = "unlog bestposa"

# PSRPOS (pseudorange position, msg 47)
[[line]]
tag = "nov-psrposb"
description = "Enable PSRPOS binary at 1Hz"
text = "log psrposb ontime 1"
[[line]]
tag = "nov-psrposb-off"
description = "Disable PSRPOS binary"
text = "unlog psrposb"
[[line]]
tag = "nov-psrposa"
description = "Enable PSRPOS ASCII at 1Hz"
text = "log psrposa ontime 1"
[[line]]
tag = "nov-psrposa-off"
description = "Disable PSRPOS ASCII"
text = "unlog psrposa"

# NMEA Output Control

# Verified GPGGA messages appear at 1Hz after enable on K902
[[line]]
tag = "nmea-gga"
description = "Enable NMEA GGA at 1Hz"
text = "log gpgga ontime 1"
# Verified GPGGA messages stop after disable on K902
[[line]]
tag = "nmea-gga-off"
description = "Disable NMEA GGA"
text = "unlog gpgga"

# Verified GPRMC messages appear at 1Hz after enable on K902
[[line]]
tag = "nmea-rmc"
description = "Enable NMEA RMC at 1Hz"
text = "log gprmc ontime 1"
# Verified GPRMC messages stop after disable on K902
[[line]]
tag = "nmea-rmc-off"
description = "Disable NMEA RMC"
text = "unlog gprmc"

# Verified GNGSA messages appear at 1Hz after enable on K902
[[line]]
tag = "nmea-gsa"
description = "Enable NMEA GSA at 1Hz"
text = "log gpgsa ontime 1"
# Verified GNGSA messages stop after disable on K902
[[line]]
tag = "nmea-gsa-off"
description = "Disable NMEA GSA"
text = "unlog gpgsa"

# Verified GPGSV/BDGSV/GAGSV/GLGSV messages appear at 1Hz after enable on K902
[[line]]
tag = "nmea-gsv"
description = "Enable NMEA GSV at 1Hz"
text = "log gpgsv ontime 1"
# Verified GPGSV/BDGSV/GAGSV/GLGSV/GIGSV messages stop after disable on K902
[[line]]
tag = "nmea-gsv-off"
description = "Disable NMEA GSV"
text = "unlog gpgsv"

# Verified GPZDA messages appear at 1Hz after enable on K902
[[line]]
tag = "nmea-zda"
description = "Enable NMEA ZDA at 1Hz"
text = "log gpzda ontime 1"
# Verified GPZDA messages stop after disable on K902
[[line]]
tag = "nmea-zda-off"
description = "Disable NMEA ZDA"
text = "unlog gpzda"

# Convenience: enable RMC, GGA, GSV, GSA (messages used by satpulse daemon)
# Verified all 4 NMEA messages (GPRMC, GPGGA, GNGSA, GPGSV) appear at 1Hz on K902
[[line]]
tag = "nmea-daemon"
description = "Enable NMEA messages used by satpulse daemon"
text = "log gprmc ontime 1"
[[line]]
tag = "nmea-daemon"
text = "log gpgga ontime 1"
[[line]]
tag = "nmea-daemon"
text = "log gpgsv ontime 1"
[[line]]
tag = "nmea-daemon"
text = "log gpgsa ontime 1"

# Reload

# RESET reloads config from NVM without clearing satellite data
# Verified device restarts and responds to commands after RESET on K902
[[line]]
tag = "reload"
description = "Reload configuration from NVM"
text = "RESET"
delay = 3

# BESTVEL (NovAtel format velocity)
# Verified BESTVELB binary (msg 99) appears at 1Hz in capture on K902
[[line]]
tag = "nov-bestvelb"
description = "Enable BESTVEL binary at 1Hz"
text = "log bestvelb ontime 1"
# Verified OK response and BESTVELB messages stop on K902
[[line]]
tag = "nov-bestvelb-off"
description = "Disable BESTVEL binary"
text = "unlog bestvelb"
# Verified BESTVELA messages appear at 1Hz in capture on K902
[[line]]
tag = "nov-bestvela"
description = "Enable BESTVEL ASCII at 1Hz"
text = "log bestvela ontime 1"
# Verified OK response and BESTVELA messages stop on K902
[[line]]
tag = "nov-bestvela-off"
description = "Disable BESTVEL ASCII"
text = "unlog bestvela"

# PSRVEL (pseudorange velocity, msg 100)
[[line]]
tag = "nov-psrvelb"
description = "Enable PSRVEL binary at 1Hz"
text = "log psrvelb ontime 1"
[[line]]
tag = "nov-psrvelb-off"
description = "Disable PSRVEL binary"
text = "unlog psrvelb"
[[line]]
tag = "nov-psrvela"
description = "Enable PSRVEL ASCII at 1Hz"
text = "log psrvela ontime 1"
[[line]]
tag = "nov-psrvela-off"
description = "Disable PSRVEL ASCII"
text = "unlog psrvela"

# PSRDOP (pseudorange DOP, msg 174)
[[line]]
tag = "nov-psrdopb"
description = "Enable PSRDOP binary at 1Hz"
text = "log psrdopb ontime 1"
[[line]]
tag = "nov-psrdopb-off"
description = "Disable PSRDOP binary"
text = "unlog psrdopb"
[[line]]
tag = "nov-psrdopa"
description = "Enable PSRDOP ASCII at 1Hz"
text = "log psrdopa ontime 1"
[[line]]
tag = "nov-psrdopa-off"
description = "Disable PSRDOP ASCII"
text = "unlog psrdopa"

# BESTXYZ (NovAtel format ECEF position + velocity)
# Verified BESTXYZB binary (msg 241) appears at 1Hz in capture on K902
[[line]]
tag = "nov-bestxyzb"
description = "Enable BESTXYZ binary at 1Hz"
text = "log bestxyzb ontime 1"
# Verified OK response and BESTXYZB messages stop on K902
[[line]]
tag = "nov-bestxyzb-off"
description = "Disable BESTXYZ binary"
text = "unlog bestxyzb"
# Verified BESTXYZA messages appear at 1Hz in capture on K902
[[line]]
tag = "nov-bestxyza"
description = "Enable BESTXYZ ASCII at 1Hz"
text = "log bestxyza ontime 1"
# Verified OK response and BESTXYZA messages stop on K902
[[line]]
tag = "nov-bestxyza-off"
description = "Disable BESTXYZ ASCII"
text = "unlog bestxyza"

# TIME (NovAtel format receiver clock and UTC time)
# Verified TIMEB binary (msg 101) appears at 1Hz in capture on K902
[[line]]
tag = "nov-timeb"
description = "Enable TIME binary at 1Hz"
text = "log timeb ontime 1"
# Verified OK response and TIMEB messages stop on K902
[[line]]
tag = "nov-timeb-off"
description = "Disable TIME binary"
text = "unlog timeb"
# Verified TIMEA messages appear at 1Hz in capture on K902
[[line]]
tag = "nov-timea"
description = "Enable TIME ASCII at 1Hz"
text = "log timea ontime 1"
# Verified OK response and TIMEA messages stop on K902
[[line]]
tag = "nov-timea-off"
description = "Disable TIME ASCII"
text = "unlog timea"

# IONUTC (NovAtel format ionospheric and UTC parameters)
# Verified IONUTCB binary (msg 8) appears in capture on K902
[[line]]
tag = "nov-ionutcb"
description = "Enable IONUTC binary on change"
text = "log ionutcb onchanged"
# Verified OK response and IONUTCB messages stop on K902
[[line]]
tag = "nov-ionutcb-off"
description = "Disable IONUTC binary"
text = "unlog ionutcb"
# Verified IONUTCA messages appear in capture on K902
[[line]]
tag = "nov-ionutca"
description = "Enable IONUTC ASCII on change"
text = "log ionutca onchanged"
# Verified OK response and IONUTCA messages stop on K902
[[line]]
tag = "nov-ionutca-off"
description = "Disable IONUTC ASCII"
text = "unlog ionutca"

# Fix Rate (PVT solution frequency)

# Verified OK response on K902
[[line]]
tag = "fix-rate-1"
description = "Set fix rate to 1 Hz"
text = "SET PVTFREQ 1"
# Verified OK response on K902
[[line]]
tag = "fix-rate-2"
description = "Set fix rate to 2 Hz"
text = "SET PVTFREQ 2"
# Verified OK response on K902
[[line]]
tag = "fix-rate-5"
description = "Set fix rate to 5 Hz (default)"
text = "SET PVTFREQ 5"
# Verified OK response and BESTPOSA at 10Hz confirms rate on K902
[[line]]
tag = "fix-rate-10"
description = "Set fix rate to 10 Hz"
text = "SET PVTFREQ 10"
# Verified OK response on K902
[[line]]
tag = "fix-rate-20"
description = "Set fix rate to 20 Hz"
text = "SET PVTFREQ 20"

# Elevation Mask

# Verified OK response on K902
[[line]]
tag = "min-elev-0"
description = "Set satellite cutoff elevation to 0 degrees"
text = "ECUTOFF 0"
# Verified OK response on K902
[[line]]
tag = "min-elev-5"
description = "Set satellite cutoff elevation to 5 degrees"
text = "ECUTOFF 5"
# Verified OK response on K902
[[line]]
tag = "min-elev-10"
description = "Set satellite cutoff elevation to 10 degrees"
text = "ECUTOFF 10"
# Verified OK response on K902
[[line]]
tag = "min-elev-15"
description = "Set satellite cutoff elevation to 15 degrees"
text = "ECUTOFF 15"
# Verified OK response on K902
[[line]]
tag = "min-elev-20"
description = "Set satellite cutoff elevation to 20 degrees"
text = "ECUTOFF 20"
# Verified OK response on K902
[[line]]
tag = "min-elev-25"
description = "Set satellite cutoff elevation to 25 degrees"
text = "ECUTOFF 25"
# Verified OK response on K902
[[line]]
tag = "min-elev-30"
description = "Set satellite cutoff elevation to 30 degrees"
text = "ECUTOFF 30"
# Verified OK response on K902
[[line]]
tag = "min-elev-35"
description = "Set satellite cutoff elevation to 35 degrees"
text = "ECUTOFF 35"
# Verified OK response on K902
[[line]]
tag = "min-elev-40"
description = "Set satellite cutoff elevation to 40 degrees"
text = "ECUTOFF 40"
# Verified OK response on K902
[[line]]
tag = "min-elev-45"
description = "Set satellite cutoff elevation to 45 degrees"
text = "ECUTOFF 45"

# GNSS Constellation Selection (SET SIGNAL)
# Systems: GPS, GLO, GAL, BD2, BD3, IRNSS
# IRNSS is not documented as a SET SIGNAL value but works (used elsewhere in the docs as a system name)

# GPS only
# Verified OK response on K902
# Verified GSV shows only GPS satellites after gnss-gps on K902
[[line]]
tag = "gnss-gps"
description = "Enable GPS only"
text = "SET SIGNAL GPS ON"
[[line]]
tag = "gnss-gps"
text = "SET SIGNAL GLO OFF"
[[line]]
tag = "gnss-gps"
text = "SET SIGNAL GAL OFF"
[[line]]
tag = "gnss-gps"
text = "SET SIGNAL BD2 OFF"
[[line]]
tag = "gnss-gps"
text = "SET SIGNAL BD3 OFF"
[[line]]
tag = "gnss-gps"
text = "SET SIGNAL IRNSS OFF"

# Galileo only
# Verified OK response on K902
# Verified GSV shows only Galileo satellites after gnss-gal on K902
[[line]]
tag = "gnss-gal"
description = "Enable Galileo only"
text = "SET SIGNAL GPS OFF"
[[line]]
tag = "gnss-gal"
text = "SET SIGNAL GLO OFF"
[[line]]
tag = "gnss-gal"
text = "SET SIGNAL GAL ON"
[[line]]
tag = "gnss-gal"
text = "SET SIGNAL BD2 OFF"
[[line]]
tag = "gnss-gal"
text = "SET SIGNAL BD3 OFF"
[[line]]
tag = "gnss-gal"
text = "SET SIGNAL IRNSS OFF"

# GLONASS only
[[line]]
tag = "gnss-glo"
description = "Enable GLONASS only"
text = "SET SIGNAL GPS OFF"
[[line]]
tag = "gnss-glo"
text = "SET SIGNAL GLO ON"
[[line]]
tag = "gnss-glo"
text = "SET SIGNAL GAL OFF"
[[line]]
tag = "gnss-glo"
text = "SET SIGNAL BD2 OFF"
[[line]]
tag = "gnss-glo"
text = "SET SIGNAL BD3 OFF"
[[line]]
tag = "gnss-glo"
text = "SET SIGNAL IRNSS OFF"

# BeiDou only (BD2 + BD3)
[[line]]
tag = "gnss-bds"
description = "Enable BeiDou only (BD2 + BD3)"
text = "SET SIGNAL GPS OFF"
[[line]]
tag = "gnss-bds"
text = "SET SIGNAL GLO OFF"
[[line]]
tag = "gnss-bds"
text = "SET SIGNAL GAL OFF"
[[line]]
tag = "gnss-bds"
text = "SET SIGNAL BD2 ON"
[[line]]
tag = "gnss-bds"
text = "SET SIGNAL BD3 ON"
[[line]]
tag = "gnss-bds"
text = "SET SIGNAL IRNSS OFF"

# GPS + Galileo
[[line]]
tag = "gnss-gps-gal"
description = "Enable GPS and Galileo"
text = "SET SIGNAL GPS ON"
[[line]]
tag = "gnss-gps-gal"
text = "SET SIGNAL GLO OFF"
[[line]]
tag = "gnss-gps-gal"
text = "SET SIGNAL GAL ON"
[[line]]
tag = "gnss-gps-gal"
text = "SET SIGNAL BD2 OFF"
[[line]]
tag = "gnss-gps-gal"
text = "SET SIGNAL BD3 OFF"
[[line]]
tag = "gnss-gps-gal"
text = "SET SIGNAL IRNSS OFF"

# All constellations
# Verified OK response on K902
# Verified GSV shows GPS, GLONASS, Galileo, BeiDou, NavIC satellites after gnss-all on K902
[[line]]
tag = "gnss-all"
description = "Enable all constellations"
text = "SET SIGNAL GPS ON"
[[line]]
tag = "gnss-all"
text = "SET SIGNAL GLO ON"
[[line]]
tag = "gnss-all"
text = "SET SIGNAL GAL ON"
[[line]]
tag = "gnss-all"
text = "SET SIGNAL BD2 ON"
[[line]]
tag = "gnss-all"
text = "SET SIGNAL BD3 ON"
[[line]]
tag = "gnss-all"
text = "SET SIGNAL IRNSS ON"


# NMEA Version

# Verified OK response on K902
# Verified GB/GQ talker IDs appear after nmea-ver-411 on K902
# Verified GSV sentences include signal ID after nmea-ver-411 on K902
[[line]]
tag = "nmea-ver-411"
description = "Set NMEA version to 4.11 (GB for BeiDou, GQ for QZSS)"
text = "SET NMEAV41 ON"
# Verified OK response on K902
# Verified BD talker ID appears after nmea-ver-400 on K902
[[line]]
tag = "nmea-ver-400"
description = "Set NMEA version to 4.00"
text = "SET NMEAV41 OFF"

# PPP (Precise Point Positioning)
# Works on K902 fw 8.2.4 but requires gnss-all (not just gnss-bds).
# Convergence takes about an hour. Achieved ~20cm horizontal, ~1cm vertical.

[[line]]
tag = "ppp-has"
description = "Enable PPP with Galileo HAS source at 1Hz"
text = "SET PPP ON"
[[line]]
tag = "ppp-has"
text = "SET PPPSOURCE HAS"
[[line]]
tag = "ppp-has"
text = "SET PPPFREQ 1"

[[line]]
tag = "ppp-b2b"
description = "Enable PPP with BeiDou B2b source at 1Hz"
text = "SET PPP ON"
[[line]]
tag = "ppp-b2b"
text = "SET PPPSOURCE B2B"
[[line]]
tag = "ppp-b2b"
text = "SET PPPFREQ 1"

[[line]]
tag = "ppp-has-b2b"
description = "Enable PPP with fused HAS+B2b source at 1Hz"
text = "SET PPP ON"
[[line]]
tag = "ppp-has-b2b"
text = "SET PPPSOURCE BHS"
[[line]]
tag = "ppp-has-b2b"
text = "SET PPPFREQ 1"

[[line]]
tag = "ppp-off"
description = "Disable PPP"
text = "SET PPP OFF"

# Raw Observations

[[line]]
tag = "nov-rangecmpb"
description = "Enable RANGECMP binary every 30s"
text = "log rangecmpb ontime 30"
[[line]]
tag = "nov-rangecmpb-off"
description = "Disable RANGECMP binary"
text = "unlog rangecmpb"

# PPS Configuration

# Verified OK response on K902
[[line]]
tag = "pps"
description = "Enable PPS with 1ms pulse, rising edge, only with fix"
text = "PPSCONTROL ENABLE NEGATIVE 1 1000 0"
# Verified OK response on K902
[[line]]
tag = "pps-off"
description = "Disable PPS output"
text = "PPSCONTROL DISABLE NEGATIVE 1 1000 -1"

# Reset Commands

# RESET preserves ephemeris/almanac (equivalent to hot start)
[[line]]
tag = "hot-start"
description = "Hot start - preserves ephemeris and almanac"
text = "RESET"
delay = 3

# FRESET clears everything (equivalent to cold start + factory reset)
[[line]]
tag = "cold-start"
description = "Cold start - clears all satellite data and settings"
text = "FRESET"
delay = 5

# Survey-in

# Verified OK response on K902
[[line]]
tag = "survey"
description = "Start survey-in (0.56h, horiz <1.5m, vert <3m)"
text = "POSAVE on 0.56 1.5 3.0"
# Verified OK response on K902
[[line]]
tag = "survey-off"
description = "Stop survey-in"
text = "POSAVE off"

# Fixed Position

# Example using accurate ECEF converted to geodetic
# Verified OK response on K902
[[line]]
tag = "fixed-pos-example"
description = "Set fixed position (example coordinates - replace with yours)"
text = "FIX position 13.7305 100.6405 50.0"
# Verified OK response on K902
[[line]]
tag = "fixed-pos-off"
description = "Clear fixed position, return to auto mode"
text = "FIX auto"

# RTCM Output

# ARP (antenna reference point, message 1005)
# Verified OK response on K902
[[line]]
tag = "rtcm-arp"
description = "Enable RTCM ARP message (1005) at 5s"
text = "log rtcm1005b ontime 5"

# MSM4 messages for all constellations
# Verified OK response for all 4 commands on K902
[[line]]
tag = "rtcm-msm4"
description = "Enable RTCM MSM4 for all constellations at 1Hz"
text = "log rtcm1074b ontime 1"
[[line]]
tag = "rtcm-msm4"
text = "log rtcm1084b ontime 1"
[[line]]
tag = "rtcm-msm4"
text = "log rtcm1094b ontime 1"
[[line]]
tag = "rtcm-msm4"
text = "log rtcm1124b ontime 1"

# Disable all RTCM output
# Verified OK response for all 5 unlog commands on K902
[[line]]
tag = "rtcm-off"
description = "Disable all RTCM output"
text = "unlog rtcm1005b"
[[line]]
tag = "rtcm-off"
text = "unlog rtcm1074b"
[[line]]
tag = "rtcm-off"
text = "unlog rtcm1084b"
[[line]]
tag = "rtcm-off"
text = "unlog rtcm1094b"
[[line]]
tag = "rtcm-off"
text = "unlog rtcm1124b"

# Port Configuration

# Verified COMCONFIGA response received on K902
[[line]]
tag = "get-port"
description = "Query serial port configuration"
text = "log comconfiga once"

[[line]]
tag = "speed-9600"
description = "Set COM1 baud rate to 9600"
text = "COM COM1 9600"
[[line]]
tag = "speed-19200"
description = "Set COM1 baud rate to 19200"
text = "COM COM1 19200"
[[line]]
tag = "speed-38400"
description = "Set COM1 baud rate to 38400"
text = "COM COM1 38400"
[[line]]
tag = "speed-57600"
description = "Set COM1 baud rate to 57600"
text = "COM COM1 57600"
[[line]]
tag = "speed-115200"
description = "Set COM1 baud rate to 115200"
text = "COM COM1 115200"
[[line]]
tag = "speed-230400"
description = "Set COM1 baud rate to 230400"
text = "COM COM1 230400"
[[line]]
tag = "speed-460800"
description = "Set COM1 baud rate to 460800"
text = "COM COM1 460800"
[[line]]
tag = "speed-921600"
description = "Set COM1 baud rate to 921600"
text = "COM COM1 921600"

# Save Configuration

[[line]]
tag = "save"
description = "Save current configuration to NVM"
text = "SAVECONFIG"

# Factory Reset

[[line]]
tag = "factory-reset"
description = "Factory reset - clears all settings and satellite data"
text = "FRESET"
delay = 5
