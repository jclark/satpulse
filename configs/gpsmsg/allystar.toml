# Allystar TAU1201 GPS message file
# Protocol: Allystar binary (similar to UBX)
# Tested on: TAU1201 with firmware 3.018.aab95e7

# Version / Probe

# Poll MON-VER to get firmware/hardware version
# Verified MON-VER response received on TAU1201
# Verified MON-VER response received on TAU951M-P200
[[asbin]]
tag = "get-version"
description = "Query firmware and hardware version"
class = 0x0A
id = 0x04

# PPS Configuration (CFG-PPS 0x06 0x07)

# Configure 1PPS: 100us pulse, rising edge, always output
# period=1000000us, offset=0ns, dutycycle=100000 (10%), polarity=1, gpio=13, sync=1
# Verified ACK received on TAU1201
# Verified PPS output resumes after pps on TAU1201
[[asbin]]
tag = "pps"
description = "Configure 1PPS with 100us pulse width, rising edge"
class = 0x06
id = 0x07
payload.types = "U4I4U4U1U1U1"
payload.values = [1000000, 0, 100000, 1, 13, 1]

# PPS off - set duty cycle to 0
# Verified ACK received on TAU1201
# Verified PPS output stops after pps-off on TAU1201
[[asbin]]
tag = "pps-off"
description = "Disable PPS output"
class = 0x06
id = 0x07
payload.types = "U4I4U4U1U1U1"
payload.values = [1000000, 0, 0, 1, 13, 0]

# Poll current PPS configuration
# Verified CFG-PPS response received on TAU1201
[[asbin]]
tag = "get-pps"
description = "Query current PPS configuration"
class = 0x06
id = 0x07

# GNSS Constellation Selection (CFG-NAVSAT 0x06 0x0C)

# GPS all bands (L1 + L1C + L5 + L2C)
# Verified ACK received on TAU1201
# Verified GSV shows only GPS satellites after gnss-gps on TAU1201
[[asbin]]
tag = "gnss-gps"
description = "Enable GPS all bands (L1/L1C/L5/L2C)"
class = 0x06
id = 0x0C
payload.types = "U4"
payload.values = [0x00000701]

# Galileo all bands (E1 + E5A + E5B + E6)
# Verified ACK received on TAU1201
# Verified GSV shows only Galileo satellites after gnss-gal on TAU1201
[[asbin]]
tag = "gnss-gal"
description = "Enable Galileo all bands (E1/E5A/E5B/E6)"
class = 0x06
id = 0x0C
payload.types = "U4"
payload.values = [0x00700010]

# GLONASS all bands (G1 + G2)
# Verified ACK received on TAU1201
# Verified GSV shows only GLONASS satellites after gnss-glo on TAU1201
[[asbin]]
tag = "gnss-glo"
description = "Enable GLONASS all bands (G1/G2)"
class = 0x06
id = 0x0C
payload.types = "U4"
payload.values = [0x00002002]

# BeiDou all bands (B1 + B1C + B2A + B3I + B5 + B2)
# Verified ACK received on TAU1201
# Verified GSV shows only BeiDou satellites after gnss-bds on TAU1201
[[asbin]]
tag = "gnss-bds"
description = "Enable BeiDou all bands (B1/B1C/B2A/B3I/B5/B2)"
class = 0x06
id = 0x0C
payload.types = "U4"
payload.values = [0x0007C004]

# Poll current GNSS configuration
# Verified CFG-NAVSAT response received on TAU1201
[[asbin]]
tag = "get-gnss"
description = "Query current GNSS constellation settings"
class = 0x06
id = 0x0C

# Survey-in Mode (CFG-SURVEY 0x06 0x12)

# Poll current survey configuration
# Verified CFG-SURVEY response received on TAU1201
[[asbin]]
tag = "get-survey"
description = "Query current survey configuration"
class = 0x06
id = 0x12

# Start survey-in: 2000s, 20m accuracy
# Verified ACK received on TAU1201
# Verified survey starts and NAV-SVIN shows Status=1 (in progress) on TAU1201
[[asbin]]
tag = "survey"
description = "Start survey-in (2000s, 20m accuracy)"
class = 0x06
id = 0x12
payload.types = "U4U4"
payload.values = [2000, 20000]

# Stop survey / return to mobile mode
# Verified ACK received on TAU951M-P200
# Verified get-survey returns zeros after survey-off on TAU951M-P200
# Note: Does not stop a survey in progress on TAU1201
[[asbin]]
tag = "survey-off"
description = "Stop survey (mobile mode)"
class = 0x06
id = 0x12
payload.types = "U4U4"
payload.values = [0, 0]

# Fixed Position Mode (CFG-FIXEDECEF 0x06 0x14)

# Poll current fixed ECEF position
# Verified CFG-FIXEDECEF response received on TAU1201
[[asbin]]
tag = "get-fixed"
description = "Query current fixed ECEF position"
class = 0x06
id = 0x14

# Set fixed ECEF position (coordinates in cm as S4)
# X=-1144698.0455m, Y=6090335.4099m, Z=1504171.3914m
# Verified ACK received on TAU1201
# Verified get-fixed returns expected values on TAU1201
[[asbin]]
tag = "fixed"
description = "Set fixed ECEF position"
class = 0x06
id = 0x14
payload.types = "I4I4I4"
payload.values = [-114469805, 609033541, 150417139]

# Clear fixed position (return to mobile mode)
# Verified ACK received on TAU951M-P200
# Verified get-fixed returns zeros after fixed-off on TAU951M-P200
[[asbin]]
tag = "fixed-off"
description = "Clear fixed position (mobile mode)"
class = 0x06
id = 0x14
payload.types = "I4I4I4"
payload.values = [0, 0, 0]

# Configuration Management (CFG-CFG 0x06 0x09)

# Save all current settings to NVM
[[asbin]]
tag = "save"
description = "Save all settings to non-volatile memory"
class = 0x06
id = 0x09
payload.types = "U4U4"
payload.values = [0, 0x07]

# Load settings from NVM
# Verified ACK received on TAU1201
# Verified reload restores saved configuration on TAU1201
[[asbin]]
tag = "reload"
description = "Reload settings from non-volatile memory"
class = 0x06
id = 0x09
payload.types = "U4U4"
payload.values = [1, 0x07]
delay = 3

# Factory reset
# Verified receiver restarts after factory-reset on TAU1201
# Verified GSV shows satellites without elevation/azimuth after factory-reset on TAU1201
# Verified RMC shows 'V' (void) status after factory-reset on TAU1201
[[asbin]]
tag = "factory-reset"
description = "Factory reset - clears all settings"
class = 0x06
id = 0x09
payload.types = "U4U4"
payload.values = [2, 0xFFFFFFFF]

# Then reset to apply
[[asbin]]
tag = "factory-reset"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [0]

# Restart Commands (CFG-SIMPLERST 0x06 0x40)

# Hot start (fastest, keeps ephemeris)
[[asbin]]
tag = "hot-start"
description = "Hot start - keeps ephemeris data"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [3]

# Warm start (clears ephemeris, keeps almanac)
[[asbin]]
tag = "warm-start"
description = "Warm start - clears ephemeris"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [2]

# Cold start (clears all satellite data)
[[asbin]]
tag = "cold-start"
description = "Cold start - clears all satellite data"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [1]

# Reset: reload config from NVM + cold start (clears satellite data)
# Verified config restored from NVM and GSV shows no el/az after reset on TAU1201
# First load config from NVM
[[asbin]]
tag = "reset"
description = "Reset - reload config and clear satellite data"
class = 0x06
id = 0x09
payload.types = "U4U4"
payload.values = [1, 0x07]

# Then cold start (mode 1 clears satellite data; mode 0 does not)
[[asbin]]
tag = "reset"
class = 0x06
id = 0x40
payload.types = "U1"
payload.values = [1]

# Message Rate Control (CFG-MSG 0x06 0x01)

# Enable NAV-TIME at 1Hz (for satpulsed)
# Verified ACK received on TAU1201
# Verified NAV-TIME messages appear at 1Hz after enable on TAU1201
[[asbin]]
tag = "asbin-navtime"
description = "Enable NAV-TIME binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x05, 1]

# Disable NAV-TIME
# Verified ACK received on TAU1201
# Verified NAV-TIME messages stop after disable on TAU1201
[[asbin]]
tag = "asbin-navtime-off"
description = "Disable NAV-TIME binary message"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x05, 0]

# Enable NAV-TIMEUTC at 1Hz (UTC time with validity flags)
# Verified ACK received on TAU1201
# Verified NAV-TIMEUTC messages appear at 1Hz after enable on TAU1201
[[asbin]]
tag = "asbin-timeutc"
description = "Enable NAV-TIMEUTC binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x21, 1]

# Disable NAV-TIMEUTC
# Verified ACK received on TAU1201
# Verified NAV-TIMEUTC messages stop after disable on TAU1201
[[asbin]]
tag = "asbin-timeutc-off"
description = "Disable NAV-TIMEUTC binary message"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x21, 0]

# Enable NAV-SVINFO at 1Hz (satellite visibility info)
# Verified ACK received on TAU1201
# Verified NAV-SVINFO messages appear at 1Hz after enable on TAU1201
[[asbin]]
tag = "asbin-svinfo"
description = "Enable NAV-SVINFO binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x30, 1]

# Disable NAV-SVINFO
# Verified ACK received on TAU1201
# Verified NAV-SVINFO messages stop after disable on TAU1201
[[asbin]]
tag = "asbin-svinfo-off"
description = "Disable NAV-SVINFO binary message"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x30, 0]

# Enable NAV-SVIN at 1Hz (survey-in status)
# Verified ACK received on TAU1201
# Verified NAV-SVIN messages appear at 1Hz after enable on TAU1201
[[asbin]]
tag = "asbin-svin"
description = "Enable NAV-SVIN binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x31, 1]

# Disable NAV-SVIN
# Verified ACK received on TAU1201
# Verified NAV-SVIN messages stop after disable on TAU1201
[[asbin]]
tag = "asbin-svin-off"
description = "Disable NAV-SVIN binary message"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x31, 0]

