# RTCM Message Control (CFG-MSG 0x06 0x01 with group 0xF8)

# Enable RTCM base station output: 1005 (ARP) + MSM7 for all constellations
# Rate 1 = output every position fix
# Verified ACK received for all 5 commands on TAU951M-P200
# Verified RTCM 1005, 1077, 1087, 1097, 1127 messages appear in capture after enable on TAU951M-P200
# 1005 ARP
[[asbin]]
tag = "rtcm-msm7"
description = "Enable RTCM base station messages (1005 + MSM7)"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0xF8, 0x05, 1]

# 1077 GPS MSM7
[[asbin]]
tag = "rtcm-msm7"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0xF8, 0x4D, 1]

# 1087 GLONASS MSM7
[[asbin]]
tag = "rtcm-msm7"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0xF8, 0x57, 1]

# 1097 Galileo MSM7
