# Verified GSV sentences include signal ID after nmea-ver-410 on TAU1201
[[asbin]]
tag = "nmea-ver-410"
description = "Set NMEA version to V4.10"
class = 0x06
id = 0x43
payload.types = "U1"
payload.values = [3]

# Set NMEA version to V4.11 (value 4 from Satrack app)
