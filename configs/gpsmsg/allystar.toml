# NMEA Version Configuration (CFG-NMEAVER 0x06 0x43)

# Poll current NMEA version
# Verified CFG-NMEAVER response received on TAU1201
[[asbin]]
tag = "get-nmea-ver"
description = "Query current NMEA version setting"
class = 0x06
id = 0x43

# Set NMEA version to V3.01
# Verified ACK received on TAU1201
# Verified get-nmea-ver returns expected value (01) on TAU1201
# Verified BD talker ID appears for BeiDou after nmea-ver-3 on TAU1201
[[asbin]]
tag = "nmea-ver-3"
description = "Set NMEA version to V3.01"
class = 0x06
id = 0x43
payload.types = "U1"
payload.values = [1]

# Set NMEA version to V4.00
# Verified ACK received on TAU1201
# Verified get-nmea-ver returns expected value (02) on TAU1201
[[asbin]]
tag = "nmea-ver-400"
description = "Set NMEA version to V4.00"
class = 0x06
id = 0x43
payload.types = "U1"
payload.values = [2]

# Set NMEA version to V4.10 (adds System ID and Signal ID to GSA/GRS/GSV)
# Verified ACK received on TAU1201
