# Configuration query polls.
# A CFG message is polled by sending it with an empty payload; the receiver
# answers with a data response (same class/id) followed by ACK.

# Query port configuration; receivers return one response per port.
# Verified on ATGM332D-5N71, ATGM332D-F8N, and AT632-6T-30.
# ATGM332D-5N71 returned port 1 then 0; V6 receivers returned port 0 and 1.
[[casbin]]
tag = "get-port"
description = "Query port configuration (one response per port)"
class = 0x06
id = 0x00

# Query time pulse configuration.
# Verified on ATGM332D-5N71 and ATGM332D-F8N.
[[casbin]]
tag = "get-pps"
description = "Query time pulse configuration"
class = 0x06
id = 0x03

# Query navigation rate.
# Verified on ATGM332D-5N71 and ATGM332D-F8N.
[[casbin]]
tag = "get-rate"
description = "Query navigation rate"
class = 0x06
id = 0x04
