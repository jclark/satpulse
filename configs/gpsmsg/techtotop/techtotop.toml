description = "Enable DAT-GALT binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x19, 1, 1, 0]

[[sdbp]]
tag = "sdbp-dat-galt-off"
description = "Disable DAT-GALT binary message"
class = 0x03
