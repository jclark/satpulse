payload.values = [5, 1, 1, 0]

[[sdbp]]
tag = "nmea-gsa-off"
description = "Disable NMEA GSA message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [5, 1, 0, 0]

[[sdbp]]
tag = "nmea-gsv"
description = "Enable NMEA GSV message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [6, 1, 1, 0]

[[sdbp]]
tag = "nmea-gsv-off"
description = "Disable NMEA GSV message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [6, 1, 0, 0]

[[sdbp]]
tag = "nmea-zda"
