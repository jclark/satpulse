# PPS configuration (CFG-PPS)
# Query: index (U1). Response/Set: 25 bytes.
# Set fields: index, switch, polarity, timeRef, period1, width1, period2, width2, offset, reserved

[[sdbp]]
tag = "get-pps"
description = "Query PPS0 configuration"
class = 0x03
id = 0x41
payload.types = "U1"
payload.values = [0]

# PPS0 on, positive, GPS time ref, 1s period, no pulse before fix, 0.1s pulse after fix
[[sdbp]]
tag = "pps"
description = "Enable PPS with 0.1s pulse width, only when locked"
class = 0x03
id = 0x41
payload.types = "U1U1U1U1U4U4U4U4I4U1"
payload.values = [0, 1, 1, 2, 1000000, 0, 1000000, 100000, 0, 0]

# PPS0 on, positive, GAL time ref, 1s period, no pulse before fix, 0.1s pulse after fix
[[sdbp]]
tag = "pps-gal"
description = "Enable PPS with Galileo time reference"
class = 0x03
id = 0x41
payload.types = "U1U1U1U1U4U4U4U4I4U1"
payload.values = [0, 1, 1, 4, 1000000, 0, 1000000, 100000, 0, 0]

# PPS0 on, positive, GLO time ref, 1s period, no pulse before fix, 0.1s pulse after fix
[[sdbp]]
tag = "pps-glo"
description = "Enable PPS with GLONASS time reference"
class = 0x03
id = 0x41
payload.types = "U1U1U1U1U4U4U4U4I4U1"
payload.values = [0, 1, 1, 3, 1000000, 0, 1000000, 100000, 0, 0]

# PPS0 on, positive, BDS time ref, 1s period, no pulse before fix, 0.1s pulse after fix
[[sdbp]]
tag = "pps-bds"
description = "Enable PPS with BDS time reference"
class = 0x03
id = 0x41
payload.types = "U1U1U1U1U4U4U4U4I4U1"
payload.values = [0, 1, 1, 1, 1000000, 0, 1000000, 100000, 0, 0]

# PPS0 off
[[sdbp]]
tag = "pps-off"
description = "Disable PPS output"
class = 0x03
id = 0x41
payload.types = "U1U1U1U1U4U4U4U4I4U1"
payload.values = [0, 0, 1, 0, 1000000, 0, 1000000, 0, 0, 0]

