class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [9, 1, 1, 0]

[[sdbp]]
tag = "nmea-gll-off"
description = "Disable NMEA GLL message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [9, 1, 0, 0]

# Disable all NMEA: ZDA, DTM, RMC, GGA, GSA, GSV, VTG, GNS, GLL, GRS, GST, GBS
[[sdbp]]
tag = "nmea-off"
description = "Disable all NMEA messages"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [1, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [2, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [3, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [4, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
