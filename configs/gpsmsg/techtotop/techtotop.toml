# DAT-TSURV survey status message

[[sdbp]]
tag = "sdbp-dat-tsurv"
description = "Enable DAT-TSURV binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x40, 1, 1, 0]

