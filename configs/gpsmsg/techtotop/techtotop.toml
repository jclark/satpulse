[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [9, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [10, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [11, 1, 0, 0]

[[sdbp]]
tag = "nmea-off"
class = 0x03
id = 0x51
