#:schema ../gpsmsg-schema.json
# u-blox configuration messages (all generations)
# For commands not yet supported through high-level configuration

# Poll MON-VER (software and hardware version)
[[ubx]]
tag = "get-version"
description = "Poll MON-VER for software and hardware version"
class = 0x0A
id = 0x04

# Poll PUBX,04 (time, clock bias/drift, time pulse granularity)
# The last field (tpGran) is not available via UBX binary.
[[nmea]]
text = "PUBX,04"
tag = "get-pubx-04"
description = "Poll time and clock status (includes tpGran)"

# Poll MON-GNSS (supported GNSS and signal plans)
[[ubx]]
tag = "get-gnss"
description = "Poll MON-GNSS for supported GNSS and signal plans"
class = 0x0A
id = 0x28
