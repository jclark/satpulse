#:schema ../gpsmsg-schema.json
# u-blox gen 8 and earlier configuration messages (protocol < 27)
# Uses CFG-MSG for message output rate control

[[include]]
src = "ubx.toml"

# UBX message enable/disable via CFG-MSG (class 0x06, id 0x01).
# The 3-byte short form [msgClass, msgID, rate] sets the rate on the
# port the command is received on.
# These tags are named with a -uart1 suffix to indicate they are intended
# for use over UART1 (the receiving port determines which port is affected).

# Configuration management via CFG-CFG (class 0x06, id 0x09).
# Payload: clearMask(U4) + saveMask(U4) + loadMask(U4).

[[ubx]]
tag = "reload"
description = "Reload configuration from NVM"
class = 0x06
id = 0x09
payload.types = "U4U4U4"
payload.values = [0, 0, 0x1F1F]

# TIM messages

[[ubx]]
tag = "ubx-tim-tp-uart1"
description = "Enable TIM-TP on UART1"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x0D, 0x01, 1]

[[ubx]]
tag = "ubx-tim-tp-uart1-off"
description = "Disable TIM-TP on UART1"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x0D, 0x01, 0]

