# Information message output via CFG-INF (class 0x06, id 0x02).
# Payload: protocolID(U1) + reserved1(U1[3]) + infMsgMask(X1[6]).
# protocolID is 0 for UBX-INF and 1 for NMEA TXT. infMsgMask is a bit mask
# of severity levels: ERROR 0x01, WARNING 0x02, NOTICE 0x04, TEST 0x08,
# DEBUG 0x10. Each tag names the least important level enabled and includes
# every more important level. UBX-INF defaults to none on every port; NMEA
# TXT defaults to notice on I2C, UART1, USB and SPI.
# There is no current-port form of CFG-INF: the mask covers all six I/O
# ports at once, so each tag says which ports it acts on. The -uart1 tags
# enable the level on UART1 and disable it on the other ports; the -all
# tags enable it on every port, which the receiver clamps to the ports it
# has. An unsuffixed name is reserved for a future current-port form.

[[ubx]]
tag = "ubx-inf-error-uart1"
description = "Enable UBX-INF error messages on UART1 only"
class = 0x06
id = 0x02
payload.types = "U1U1U1U1U1U1U1U1U1U1"
payload.values = [0, 0, 0, 0, 0, 0x01, 0, 0, 0, 0]

[[ubx]]
tag = "ubx-inf-warning-uart1"
description = "Enable UBX-INF error and warning messages on UART1 only"
class = 0x06
id = 0x02
payload.types = "U1U1U1U1U1U1U1U1U1U1"
payload.values = [0, 0, 0, 0, 0, 0x03, 0, 0, 0, 0]

[[ubx]]
