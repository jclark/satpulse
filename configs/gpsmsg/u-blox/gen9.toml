#:schema ../gpsmsg-schema.json
# u-blox gen 9 and later configuration messages (protocol >= 27)
# Uses CFG-VALSET for message output rate control.
#
# Port-dependent entries use [[ubxvalport]]; the active receiver port is
# supplied at run time via --port (i2c|uart1|uart2|usb|spi). With --save
# the receiver persists the change to BBR and Flash; without --save it is
# RAM-only.

[[include]]
src = "ubx.toml"

[[ubxvalport]]
tag = "ubx-nav-timegps"
description = "Enable NAV-TIMEGPS"
key.usb = 0x2091004A
value = 1

[[ubxvalport]]
tag = "ubx-nav-timegps-off"
description = "Disable NAV-TIMEGPS"
key.usb = 0x2091004A
value = 0

[[ubxvalport]]
tag = "ubx-nav-timeutc"
description = "Enable NAV-TIMEUTC"
key.usb = 0x2091005E
value = 1

[[ubxvalport]]
tag = "ubx-nav-timeutc-off"
description = "Disable NAV-TIMEUTC"
key.usb = 0x2091005E
value = 0

[[ubxvalport]]
tag = "ubx-nav-timebds"
description = "Enable NAV-TIMEBDS"
key.usb = 0x20910054
value = 1

[[ubxvalport]]
tag = "ubx-nav-timebds-off"
description = "Disable NAV-TIMEBDS"
key.usb = 0x20910054
value = 0

[[ubxvalport]]
tag = "ubx-nav-timeglo"
description = "Enable NAV-TIMEGLO"
key.usb = 0x2091004F
value = 1

[[ubxvalport]]
tag = "ubx-nav-timeglo-off"
description = "Disable NAV-TIMEGLO"
key.usb = 0x2091004F
value = 0

[[ubxvalport]]
tag = "ubx-nav-timegal"
description = "Enable NAV-TIMEGAL"
key.usb = 0x20910059
value = 1

[[ubxvalport]]
tag = "ubx-nav-timegal-off"
description = "Disable NAV-TIMEGAL"
key.usb = 0x20910059
value = 0

[[ubxvalport]]
tag = "ubx-nav-timeqzss"
description = "Enable NAV-TIMEQZSS"
key.usb = 0x20910389
value = 1

[[ubxvalport]]
tag = "ubx-nav-timeqzss-off"
description = "Disable NAV-TIMEQZSS"
key.usb = 0x20910389
value = 0

[[ubxvalport]]
tag = "ubx-nav-clock"
description = "Enable NAV-CLOCK"
key.usb = 0x20910068
value = 1

[[ubxvalport]]
tag = "ubx-nav-clock-off"
description = "Disable NAV-CLOCK"
key.usb = 0x20910068
value = 0

[[ubxvalport]]
tag = "ubx-nav-eoe"
description = "Enable NAV-EOE"
key.usb = 0x20910162
value = 1

[[ubxvalport]]
tag = "ubx-nav-eoe-off"
description = "Disable NAV-EOE"
key.usb = 0x20910162
value = 0

[[ubxvalport]]
tag = "ubx-nav-posllh"
description = "Enable NAV-POSLLH"
key.usb = 0x2091002C
value = 1

[[ubxvalport]]
tag = "ubx-nav-posllh-off"
description = "Disable NAV-POSLLH"
key.usb = 0x2091002C
value = 0

[[ubxvalport]]
tag = "ubx-nav-posecef"
description = "Enable NAV-POSECEF"
key.usb = 0x20910027
value = 1

[[ubxvalport]]
tag = "ubx-nav-posecef-off"
description = "Disable NAV-POSECEF"
key.usb = 0x20910027
value = 0

[[ubxvalport]]
tag = "ubx-mon-comms"
description = "Enable UBX-MON-COMMS"
key.usb = 0x20910352
value = 1

# Information message output (CFG-INFMSG). The value is a bit mask of
# severity levels: ERROR 0x01, WARNING 0x02, NOTICE 0x04, TEST 0x08,
# DEBUG 0x10. Each tag names the least important level enabled and
# includes every more important level. UBX-INF defaults to none, NMEA
# TXT to notice.

[[ubxvalport]]
tag = "ubx-inf-error"
description = "Enable UBX-INF error messages"
key.usb = 0x20920004
value = 0x01

[[ubxvalport]]
tag = "ubx-inf-warning"
description = "Enable UBX-INF error and warning messages"
key.usb = 0x20920004
value = 0x03

[[ubxvalport]]
tag = "ubx-inf-notice"
description = "Enable UBX-INF error, warning and notice messages"
key.usb = 0x20920004
value = 0x07

[[ubxvalport]]
tag = "ubx-inf-test"
description = "Enable UBX-INF error, warning, notice and test messages"
key.usb = 0x20920004
value = 0x0F

[[ubxvalport]]
tag = "ubx-inf-debug"
description = "Enable UBX-INF messages at all severity levels"
key.usb = 0x20920004
value = 0x1F

[[ubxvalport]]
tag = "ubx-inf-off"
description = "Disable UBX-INF messages"
key.usb = 0x20920004
value = 0

[[ubxvalport]]
tag = "nmea-inf-error"
description = "Enable NMEA TXT error messages"
key.usb = 0x20920009
value = 0x01

[[ubxvalport]]
tag = "nmea-inf-warning"
description = "Enable NMEA TXT error and warning messages"
key.usb = 0x20920009
value = 0x03

[[ubxvalport]]
tag = "nmea-inf-notice"
description = "Enable NMEA TXT error, warning and notice messages"
key.usb = 0x20920009
value = 0x07

[[ubxvalport]]
tag = "nmea-inf-test"
description = "Enable NMEA TXT error, warning, notice and test messages"
key.usb = 0x20920009
value = 0x0F

[[ubxvalport]]
tag = "nmea-inf-debug"
description = "Enable NMEA TXT messages at all severity levels"
key.usb = 0x20920009
value = 0x1F

[[ubxvalport]]
tag = "nmea-inf-off"
description = "Disable NMEA TXT messages"
key.usb = 0x20920009
value = 0

[[ubxvalport]]
tag = "ubx-rxm-cor"
description = "Enable RXM-COR (differential correction input status)"
key.usb = 0x209106B9
value = 1

[[ubxvalport]]
tag = "ubx-rxm-cor-off"
description = "Disable RXM-COR"
key.usb = 0x209106B9
value = 0

[[ubxvalport]]
tag = "rtcm-4072-0"
description = "Enable RTCM 4072.0 (reference station PVT, u-blox proprietary)"
key.usb = 0x20910301
value = 1

[[ubxvalport]]
tag = "rtcm-4072-0-off"
description = "Disable RTCM 4072.0"
key.usb = 0x20910301
value = 0

[[ubxvalport]]
tag = "rtcm-4072-1"
description = "Enable RTCM 4072.1 (additional reference station info, u-blox proprietary)"
key.usb = 0x20910384
value = 1

[[ubxvalport]]
tag = "rtcm-4072-1-off"
description = "Disable RTCM 4072.1"
key.usb = 0x20910384
value = 0

[[ubxval]]
tag = "min-cno-25"
description = "Set minimum C/N0 to 25 dBHz"
keys = [0x201100A3] # CFG-NAVSPG-INFIL_MINCNO
types = "U1"
values = [25]
