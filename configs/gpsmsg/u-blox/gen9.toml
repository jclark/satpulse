#:schema ../gpsmsg-schema.json
# u-blox gen 9 and later configuration messages (protocol >= 27)
# Uses CFG-VALSET for message output rate control.
#
# Port-dependent entries use [[ubxvalport]]; the active receiver port is
# supplied at run time via --port (i2c|uart1|uart2|usb|spi). With --save
# the receiver persists the change to BBR and Flash; without --save it is
# RAM-only.

[[include]]
src = "ubx.toml"

[[ubxvalport]]
tag = "ubx-nav-timegps"
description = "Enable NAV-TIMEGPS"
key.usb = 0x2091004A
value = 1

[[ubxvalport]]
tag = "ubx-nav-timegps-off"
description = "Disable NAV-TIMEGPS"
key.usb = 0x2091004A
value = 0

