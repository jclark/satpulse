# NMEA daemon set (RMC, GGA, GSV, GSA)
[[line]]
tag = "nmea-daemon"
description = "Enable NMEA daemon set (RMC, GGA, GSV, GSA)"
text = "GPRMC 1"
[[line]]
tag = "nmea-daemon"
text = "GPGGA 1"
[[line]]
tag = "nmea-daemon"
text = "GPGSV 1"
[[line]]
tag = "nmea-daemon"
text = "GPGSA 1"

# Disable all NMEA messages
[[line]]
tag = "nmea-off"
description = "Disable all NMEA messages"
text = "UNLOG GPRMC"
[[line]]
tag = "nmea-off"
text = "UNLOG GPGGA"
[[line]]
tag = "nmea-off"
text = "UNLOG GPGLL"
[[line]]
tag = "nmea-off"
text = "UNLOG GPGSA"
[[line]]
