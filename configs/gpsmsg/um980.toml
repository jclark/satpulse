[[line]]
tag = "unc-ppsstatusa"
description = "Enable PPSSTATUS ASCII at 1Hz"
text = "PPSSTATUSA 1"
[[line]]
tag = "unc-ppsstatusa-off"
description = "Disable PPSSTATUS ASCII"
text = "UNLOG PPSSTATUSA"

