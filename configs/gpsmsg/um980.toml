tag = "unc-satsinfob"
description = "Enable SATSINFO binary at 1Hz"
text = "SATSINFOB 1"
[[line]]
tag = "unc-satsinfob-off"
description = "Disable SATSINFO binary"
text = "UNLOG SATSINFOB"
[[line]]
tag = "unc-satsinfoa"
description = "Enable SATSINFO ASCII at 1Hz"
text = "SATSINFOA 1"
[[line]]
tag = "unc-satsinfoa-off"
description = "Disable SATSINFO ASCII"
text = "UNLOG SATSINFOA"

