# Unicore UM980 GPS message file

[default.line]
delay = 0.1
responsePattern = "unicore"

# Version query
[[line]]
tag = "get-version"
description = "Query firmware version"
text = "VERSION"

# Configuration queries
[[line]]
tag = "get-mask"
description = "Query mask settings"
text = "MASK"
[[line]]
tag = "get-config"
description = "Query receiver configuration"
text = "CONFIG"
[[line]]
tag = "get-loglist"
description = "Query active log list (includes current port)"
text = "LOGLIST"

# Serial port speed (COM1, COM2, COM3)
[[line]]
tag = "speed-115200-com1"
text = "CONFIG COM1 115200"
[[line]]
tag = "speed-230400-com1"
text = "CONFIG COM1 230400"
[[line]]
tag = "speed-460800-com1"
text = "CONFIG COM1 460800"
[[line]]
tag = "speed-115200-com2"
text = "CONFIG COM2 115200"
[[line]]
tag = "speed-230400-com2"
text = "CONFIG COM2 230400"
[[line]]
tag = "speed-460800-com2"
text = "CONFIG COM2 460800"
[[line]]
tag = "speed-115200-com3"
text = "CONFIG COM3 115200"
[[line]]
tag = "speed-230400-com3"
text = "CONFIG COM3 230400"
[[line]]
tag = "speed-460800-com3"
text = "CONFIG COM3 460800"

# RECTIME (receiver clock and UTC time)
[[line]]
tag = "unc-rectimeb"
description = "Enable RECTIME binary at 1Hz"
text = "RECTIMEB 1"
[[line]]
tag = "unc-rectimeb-off"
description = "Disable RECTIME binary"
text = "UNLOG RECTIMEB"
[[line]]
tag = "unc-rectimea"
description = "Enable RECTIME ASCII at 1Hz"
text = "RECTIMEA 1"
[[line]]
tag = "unc-rectimea-off"
description = "Disable RECTIME ASCII"
text = "UNLOG RECTIMEA"

# PPSSTATUS (PPS output status)
[[line]]
tag = "unc-ppsstatusb"
description = "Enable PPSSTATUS binary at 1Hz"
text = "PPSSTATUSB 1"
[[line]]
tag = "unc-ppsstatusb-off"
description = "Disable PPSSTATUS binary"
