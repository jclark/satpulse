#:schema ./gpsmsg-schema.json
# AT632-6T-30 timing receiver configuration messages
# Zhongke Microelectronics (icofchina.com) CASIC binary protocol
# Firmware V6.x timing variant
# Default baud rate: 115200

# TIM2 binary message control via CFG-MSG (0x06 0x01)
# TIM2 class is 0x12

# Enable TIM2-TPX (timing pulse info) at 1Hz
# Verified ACK received on AT632-6T-30
[[casbin]]
tag = "casbin-tim2-tpx"
description = "Enable TIM2-TPX output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x12, 0x00, 1]

# Disable TIM2-TPX
[[casbin]]
tag = "casbin-tim2-tpx-off"
description = "Disable TIM2-TPX output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x12, 0x00, 0]

