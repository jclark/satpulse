#:schema ../gpsmsg-schema.json
# Allystar TAU951M GPS message file (P2 and K2 variants)
# CFG-MSG rate is a divisor of the receiver's native measurement cycle.
# The TAU951M is 5Hz-native, so divisor 5 produces 1Hz output.

[[include]]
src = "asbin.toml"

# Default delay: protocol says to wait for ACK before sending next command
[default.asbin]
delay = 0.1

# Message Rate Control (CFG-MSG 0x06 0x01)

# Enable NAV-TIME at 1Hz (for satpulsed)
[[asbin]]
tag = "asbin-nav-time"
description = "Enable NAV-TIME binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x05, 5]

# Disable NAV-TIME
[[asbin]]
tag = "asbin-nav-time-off"
description = "Disable NAV-TIME binary message"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x05, 0]

# Enable NAV-TIMEUTC at 1Hz (UTC time with validity flags)
[[asbin]]
tag = "asbin-nav-timeutc"
description = "Enable NAV-TIMEUTC binary message at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U1"
payload.values = [0x01, 0x21, 5]

# Disable NAV-TIMEUTC
[[asbin]]
tag = "asbin-nav-timeutc-off"
description = "Disable NAV-TIMEUTC binary message"
