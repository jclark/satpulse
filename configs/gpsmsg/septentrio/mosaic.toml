description = "Disable RTCM ephemeris messages"

# rtcm-4072-0 / rtcm-4072-1: TODO -- RTCM message 4072 (u-blox's proprietary
# Moving Base message) does not appear in either model's supported RTCMv3
# message list (1001-1013, 1019, 1020, 1029, 1033, 1041-1046, 1071-1137,
# 1230). Septentrio has no documented equivalent for this message; not
# implemented. Moving-base operation on Septentrio uses setGNSSAttitude,
# MovingBase instead (a different mechanism entirely).

# Verified: rtcm-off sets the USB1 RTCM output list to none.
[[line]]
tag = "rtcm-off-usb1"
text = "setRTCMv3Output, USB1, none"
description = "Disable all RTCM output"

# Verified ACK on mosaic-G5; getRTCMv3Formatting returns the reference station ID.
[[line]]
tag = "get-rtcm-base-id"
text = "getRTCMv3Formatting"
description = "Query RTCM reference station ID"

# Verified both ACK with readback on mosaic-G5 (RTCMv3Formatting ID -> 0 / 1234).
