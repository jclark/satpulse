# RTK mode
# Unlike vendors with an explicit BASE/ROVER command, Septentrio's "mode" is
# just the PVT Mode (Static = base-like fixed/self-surveyed position, Rover =
# moving). Trailing arguments are omitted here (optional args keep their
# current value per the reference guides' sec 3.1.2), so these compose
# cleanly with the survey/fixed-pos tags above, which set RefPos separately.

# Verified both ACK with readback on mosaic-G5 (PVTMode -> Static / Rover).
[[line]]
tag = "mode-base"
text = "setPVTMode, Static"
description = "Set base station mode (static PVT)"
[[line]]
tag = "mode-rover"
text = "setPVTMode, Rover"
description = "Set rover mode"

# SBF output (Septentrio Binary Format)
#
# SBF is scheduled through a "stream": one SBF stream (Stream1..Stream10, a pool
# separate from the NMEA streams) carries a list of blocks to one connection (Cd)
# at one interval. This file uses SBF Stream1 throughout. setSBFOutput takes
# Stream, Cd, Messages, Interval; an omitted argument keeps its current value
# (mosaic-G5 v1.1.0 guide sec 3.1.2), and "+"/"-" on Messages adds/removes one
# block without disturbing the rest.
#
# Cd, Interval and the block list bind independently and live: setting one leaves
# the others in place, and a block enabled with no interval emits nothing until a
# rate is set. So there are two enable tags per block, mirroring the NMEA tags:
#   sbf-<block>-usb1  self-contained -- USB1 + 1 Hz + the block in one tag, so it
#                     works on a factory-fresh stream (Cd none, interval off).
#   sbf-<block>-cur   adds the block only, riding the stream's current Cd and
#                     interval; compose with sbf-port-*/sbf-rate-*.
# The single sbf-<block>-off disables the block (port-neutral). One block per SBF
# block satpulse decodes (gps/lib/sbfbin); tag name is the block lowercased, the
# command text keeps the block's exact casing.
#
# The FlexRate-exempt blocks (xPPSOffset, GPSUtc, GALUtc, BDSUtc, ReceiverSetup,
# DiffCorrIn, BaseStation) ignore the interval and always emit at their natural
# OnChange rate, so the sec1 in their -usb1 tag is harmless but has no effect.
# Verified on mosaic-G5: getSBFOutput readbacks plus USB1/USB2 captures confirmed
# Cd, Interval and Messages each change independently, and a Cd or Interval change
# moves/regates an already-enabled block with no re-enable.

[[line]]
tag = "get-sbf"
text = "getSBFOutput, Stream1"
description = "Query Stream1 SBF output configuration"

