tag = "sbf-port-com2"
text = "setSBFOutput, Stream1, COM2"
description = "Route Stream1 SBF output to COM2"

# Rate: set Stream1's SBF output interval (keeps port and block list).
[[line]]
tag = "sbf-rate-1"
text = "setSBFOutput, Stream1, , , sec1"
description = "Set Stream1 SBF output rate to 1 Hz"
[[line]]
tag = "sbf-rate-2"
text = "setSBFOutput, Stream1, , , msec500"
description = "Set Stream1 SBF output rate to 2 Hz"
[[line]]
tag = "sbf-rate-5"
text = "setSBFOutput, Stream1, , , msec200"
description = "Set Stream1 SBF output rate to 5 Hz"
[[line]]
tag = "sbf-rate-10"
text = "setSBFOutput, Stream1, , , msec100"
description = "Set Stream1 SBF output rate to 10 Hz"
[[line]]
tag = "sbf-rate-20"
text = "setSBFOutput, Stream1, , , msec50"
description = "Set Stream1 SBF output rate to 20 Hz"
