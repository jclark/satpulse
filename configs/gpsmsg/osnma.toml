#:schema ./gpsmsg-schema.json
# Galileo OSNMA configuration for u-blox F9P (HPG 1.51 firmware or later).
# Tags here use CFG-VALSET, CFG-VALGET and UBX-MGA-GAL, so they target Gen9+ receivers.
# CFG-MSGOUT tags are USB-only (matching ubx9.toml convention); for UART1, change the
# key in payload.values from 0x2091XXXX accordingly.

[[include]]
src = "ubx9.toml"

# OSNMA enable/disable via CFG-VALSET (class 0x06, id 0x8a).
# Sets CFG-GAL-USE_OSNMA (key 0x10350005) in RAM layer.

[[ubx]]
tag = "osnma-on"
description = "Enable Galileo OSNMA authentication"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x10350005, 1]

[[ubx]]
tag = "osnma-off"
description = "Disable Galileo OSNMA authentication"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x10350005, 0]

# Restrict navigation solution to authenticated data only via
# CFG-NAVSPG-ONLY_AUTHDATA (key 0x101100dd).

[[ubx]]
tag = "osnma-only-auth"
description = "Use only OSNMA-authenticated navigation data"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x101100DD, 1]

[[ubx]]
tag = "osnma-only-auth-off"
description = "Allow unauthenticated navigation data"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x101100DD, 0]

# Toggle the OSNMA time synchronization requirement via CFG-GAL-OSNMA_TIMESYNC
# (key 0x10350009). When true (default), the receiver will only apply OSNMA if
# trusted external time has been supplied via UBX-MGA-INI-TIME_UTC. Setting it
# to false lets OSNMA run without external time, at the cost of weaker
# protection against delayed-replay attacks.

[[ubx]]
tag = "osnma-timesync"
description = "Require external trusted time for OSNMA (default)"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x10350009, 1]

[[ubx]]
tag = "osnma-timesync-off"
description = "Run OSNMA without external trusted time"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x10350009, 0]

# Query current OSNMA configuration via CFG-VALGET (class 0x06, id 0x8b)
# from the RAM layer.

[[ubx]]
tag = "get-osnma"
description = "Poll OSNMA configuration"
class = 0x06
id = 0x8B
payload.types = "U1U1U2U4U4U4"
payload.values = [0, 0, 0, 0x10350005, 0x10350009, 0x101100DD]

# Provision the Galileo OSNMA Merkle tree root via UBX-MGA-GAL-OSNMA_MERKLE
# (class 0x13, id 0x02, type 0x08).
# The tree node below is the current public Merkle tree root for the live OSNMA
# service, taken from the GSC website (https://www.gsc-europa.eu/gsc-products/OSNMA/MT).
# Once provisioned, the receiver stores the root in non-volatile memory and can
# obtain the public key from the satellite signal (this can take several hours).

[[ubx]]
tag = "osnma-merkle"
description = "Provision current Galileo OSNMA Merkle tree root"
class = 0x13
id = 0x02
payload.types = "U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1"
payload.values = [
    0x08, 0x00, 0x00, 0x00,
    0x83, 0x2E, 0x15, 0xED, 0xE5, 0x56, 0x55, 0xEA,
    0xC6, 0xE3, 0x99, 0xA5, 0x39, 0x47, 0x7B, 0x7C,
    0x03, 0x4C, 0xCE, 0x24, 0xC3, 0xC9, 0x3F, 0xFC,
    0x90, 0x4A, 0xCD, 0x9B, 0xF8, 0x42, 0xF0, 0x4E,
]

# Provision the Galileo OSNMA public key via UBX-MGA-GAL-OSNMA_PUBKEY
# (class 0x13, id 0x02, type 0x07).
# Provisioning the pubkey directly avoids the multi-hour wait for the receiver
# to acquire it from the satellite signal. The receiver stores keys indexed by
# PKID, so multiple PKIDs can be provisioned; the live signal selects which is
# in use. Below is PKID=2 (ECDSA P-256/SHA-256), applicable from 2025-12-10
# (see https://www.gsc-europa.eu/gsc-products/OSNMA/PKI). The 33-byte P-256
# compressed key is right-padded to fill the 67-byte field (sized for P-521).

[[ubx]]
tag = "osnma-pubkey-2"
description = "Provision Galileo OSNMA public key with PKID 2 (P-256, applicable from 2025-12-10)"
class = 0x13
id = 0x02
payload.types = "U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1U1"
payload.values = [
    0x07, 0x00, 0x12, 0x00,
    0x02, 0x21, 0x92, 0x04, 0xB5, 0xCA, 0x6C, 0x46,
    0xB6, 0x23, 0xEE, 0xED, 0x6C, 0xDD, 0x2C, 0xDD,
    0xB1, 0xF7, 0xD6, 0xA7, 0x53, 0x27, 0x67, 0xE5,
    0xB8, 0xDA, 0x0D, 0xE1, 0xEB, 0xD6, 0x95, 0xFC,
    0x99,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00,
    0x00,
]

# OSNMA monitoring messages on USB.
# Enable these to observe authentication status on the receiver.

[[ubx]]
tag = "ubx-nav-pvt-usb"
description = "Enable NAV-PVT on USB (carries NMA fix authentication status)"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x20910009, 1]

[[ubx]]
tag = "ubx-nav-pvt-usb-off"
description = "Disable NAV-PVT on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x20910009, 0]

[[ubx]]
tag = "ubx-nav-sig-usb"
description = "Enable NAV-SIG on USB (carries Galileo signal authentication status)"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x20910348, 1]

[[ubx]]
tag = "ubx-nav-sig-usb-off"
description = "Disable NAV-SIG on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x20910348, 0]

[[ubx]]
tag = "get-ubx-sec-osnma"
description = "Poll UBX-SEC-OSNMA for OSNMA security status (pubkey/Merkle validity, etc.)"
class = 0x27
id = 0x0A

[[ubx]]
tag = "ubx-sec-osnma-usb"
description = "Enable SEC-OSNMA on USB (detailed OSNMA status)"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x209106CD, 1]

[[ubx]]
tag = "ubx-sec-osnma-usb-off"
description = "Disable SEC-OSNMA on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x209106CD, 0]

[[ubx]]
tag = "ubx-nav-timetrusted-usb"
description = "Enable NAV-TIMETRUSTED on USB (external trusted time info)"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x209103AB, 1]

[[ubx]]
tag = "ubx-nav-timetrusted-usb-off"
description = "Disable NAV-TIMETRUSTED on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x209103AB, 0]
