payload.values = [3, 1, 1, 0]

[[sdbp]]
tag = "nmea-rmc-off"
description = "Disable NMEA RMC message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [3, 1, 0, 0]

[[sdbp]]
tag = "nmea-gsa"
description = "Enable NMEA GSA message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [5, 1, 1, 0]

[[sdbp]]
tag = "nmea-gsa-off"
description = "Disable NMEA GSA message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [5, 1, 0, 0]

[[sdbp]]
tag = "nmea-gsv"
description = "Enable NMEA GSV message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [6, 1, 1, 0]

[[sdbp]]
tag = "nmea-gsv-off"
description = "Disable NMEA GSV message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [6, 1, 0, 0]

[[sdbp]]
tag = "nmea-zda"
description = "Enable NMEA ZDA message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [1, 1, 1, 0]

[[sdbp]]
tag = "nmea-zda-off"
description = "Disable NMEA ZDA message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [1, 1, 0, 0]

[[sdbp]]
tag = "nmea-gll"
description = "Enable NMEA GLL message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [9, 1, 1, 0]

[[sdbp]]
tag = "nmea-gll-off"
description = "Disable NMEA GLL message"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [9, 1, 0, 0]

# Disable all NMEA: ZDA, DTM, RMC, GGA, GSA, GSV, VTG, GNS, GLL, GRS, GST, GBS
