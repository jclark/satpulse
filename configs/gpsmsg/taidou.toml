# Enable messages for satpulse daemon
# RMC
[[sdbp]]
tag = "nmea-daemon"
description = "Enable NMEA messages used by satpulse daemon"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [3, 1, 1, 0]

# GGA
[[sdbp]]
tag = "nmea-daemon"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [4, 1, 1, 0]

# GSV
[[sdbp]]
tag = "nmea-daemon"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [6, 1, 1, 0]

# GSA
[[sdbp]]
tag = "nmea-daemon"
class = 0x03
id = 0x51
payload.types = "U1U1U1U1"
payload.values = [5, 1, 1, 0]

# Binary message control (CFG-SDBP)
# Enable/disable DAT-GPST on port 1

[[sdbp]]
tag = "sdbp-dat-gpst"
description = "Enable DAT-GPST binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x17, 1, 1, 0]

[[sdbp]]
tag = "sdbp-dat-gpst-off"
description = "Disable DAT-GPST binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x17, 1, 0, 0]

# Enable/disable DAT-TPPS on port 1

[[sdbp]]
tag = "sdbp-dat-tpps"
description = "Enable DAT-TPPS binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x41, 1, 1, 0]

[[sdbp]]
tag = "sdbp-dat-tpps-off"
description = "Disable DAT-TPPS binary message"
class = 0x03
id = 0x52
payload.types = "U1U1U1U1U1"
payload.values = [0x06, 0x41, 1, 0, 0]

# UART configuration (CFG-UART)
# Query: port ID (U1). Response: port, baud, dataBits, stopBits, parity, reserved.
# Set: port, baud, dataBits, stopBits, parity, reserved.

[[sdbp]]
tag = "get-uart"
description = "Query UART1 and UART2 configuration"
class = 0x03
id = 0x21
payload.types = "U1"
payload.values = [1]

[[sdbp]]
tag = "get-uart"
class = 0x03
id = 0x21
payload.types = "U1"
payload.values = [2]

[[sdbp]]
tag = "speed-38400"
description = "Set serial speed to 38400 baud"
class = 0x03
id = 0x21
payload.types = "U1U1U1U1U1U1"
payload.values = [1, 4, 0, 1, 0, 0]

[[sdbp]]
tag = "speed-57600"
description = "Set serial speed to 57600 baud"
class = 0x03
id = 0x21
payload.types = "U1U1U1U1U1U1"
payload.values = [1, 5, 0, 1, 0, 0]

[[sdbp]]
