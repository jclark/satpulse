#:schema ./gpsmsg-schema.json
# u-blox Gen9+ configuration messages (protocol >= 27)
# Uses CFG-VALSET for message output rate control

[[include]]
src = "ubx.toml"

# UBX message enable/disable on USB port
# Each tag sets one message rate on USB (MSGOUT key + port 3).
# CFG-VALSET: version=0, layers=1 (RAM), transaction=0.

[[ubx]]
tag = "ubx-nav-timegps-usb"
description = "Enable NAV-TIMEGPS on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x2091004A, 1]

[[ubx]]
tag = "ubx-nav-timegps-usb-off"
description = "Disable NAV-TIMEGPS on USB"
class = 0x06
id = 0x8A
payload.types = "U1U1U2U4U1"
payload.values = [0, 1, 0, 0x2091004A, 0]

