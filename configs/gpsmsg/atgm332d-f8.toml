#:schema ./gpsmsg-schema.json
# ATGM332D-F8 configuration messages
# Zhongkewei (ZKW) CASIC binary protocol
# Default baud rate: 115200

# CFG-NAVBAND: Signal band configuration
# Payload: U1 sigBandAuto, U1 res1, U2 res2, U4 sigidMaskFix, U4 sigidMask
# sigBandAuto=0 for manual selection, sigidMaskFix sets positioning signals
#
# Signal bit positions (from ZKW spec section 1.4):
#   GPS L1C/A=0, GPS L5=2, SBAS L1=3, SBAS L5=4, GLO L1=5,
#   GAL E1=7, GAL E5A=8, BDS B1I GEO=10, BDS B1I MEO=11,
#   BDS B1C=14, BDS B2A=15, QZSS L1C/A=19, QZSS L5=21, IRNSS L5=23

# GPS only: L1C/A + L5 (bits 0,2 = 0x00000005)
[[casbin]]
tag = "gnss-gps-l1l5"
description = "Enable GPS L1 and L5 signals only"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x00000005, 0x00000005]

# Galileo only: E1 + E5A (bits 7,8 = 0x00000180)
[[casbin]]
tag = "gnss-gal-l1l5"
description = "Enable Galileo E1 and E5a signals only"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x00000180, 0x00000180]

# BDS only: B1I + B1C + B2A (bits 10,11,14,15 = 0x0000CC00)
[[casbin]]
tag = "gnss-bds-l1l5"
description = "Enable BDS B1I, B1C and B2a signals only"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x0000CC00, 0x0000CC00]

# GPS + Galileo: L1 + L5 (bits 0,2,7,8 = 0x00000185)
[[casbin]]
tag = "gnss-gps-gal-l1l5"
description = "Enable GPS and Galileo L1/L5 signals"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x00000185, 0x00000185]

# GPS + Galileo + BDS: L1 + L5 (bits 0,2,7,8,10,11,14,15 = 0x0000CD85)
[[casbin]]
tag = "gnss-gps-gal-bds-l1l5"
description = "Enable GPS, Galileo, and BDS L1/L5 signals"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x0000CD85, 0x0000CD85]

# GPS + Galileo + BDS + QZSS: L1 + L5 (bits 0,2,7,8,10,11,14,15,19,21 = 0x0028CD85)
[[casbin]]
tag = "gnss-gps-gal-bds-qzss-l1l5"
description = "Enable GPS, Galileo, BDS, and QZSS L1/L5 signals"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x0028CD85, 0x0028CD85]

# All constellations L1+L5: GPS, GLO, GAL, BDS, QZSS, SBAS, IRNSS
# bits: 0,2,3,4,5,7,8,10,11,14,15,19,21,23 = 0x00A8CDBD
[[casbin]]
tag = "gnss-all-l1l5"
description = "Enable all constellations with L1/L5 signals"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [0, 0, 0, 0x00A8CDBD, 0x00A8CDBD]

# Auto signal band selection (let receiver decide)
[[casbin]]
tag = "gnss-auto"
description = "Enable automatic signal band selection"
class = 0x06
id = 0x0F
payload.types = "U1U1U2U4U4"
payload.values = [1, 0, 0, 0, 0]

# CFG-TP: Time pulse (PPS) configuration
# Payload: U4 interval_us, U4 width_us, I1 enable, I1 polarity, I1 time_ref,
#          U1 time_source, R4 user_delay
# enable: 0=off, 1=on, 2=maintain, 3=fix only
# polarity: 0=rising edge, 1=falling edge
# time_ref: 0=UTC, 1=satellite time
# time_source: 0=GPS, 1=BDS, 2=GLONASS

# Enable PPS: 100ms pulse, only when locked, rising edge, UTC
[[casbin]]
tag = "pps"
description = "Enable PPS output (0.1s pulse, only when locked)"
class = 0x06
id = 0x03
payload.types = "U4U4I1I1I1U1R4"
payload.values = [1000000, 100000, 3, 0, 0, 0, 0.0]

# PPS aligned to GPS time (not UTC)
[[casbin]]
tag = "pps-gps"
description = "Enable PPS aligned to GPS time"
class = 0x06
id = 0x03
payload.types = "U4U4I1I1I1U1R4"
payload.values = [1000000, 100000, 3, 0, 1, 0, 0.0]

# PPS aligned to BDS time
[[casbin]]
tag = "pps-bds"
description = "Enable PPS aligned to BDS time"
class = 0x06
id = 0x03
payload.types = "U4U4I1I1I1U1R4"
payload.values = [1000000, 100000, 3, 0, 1, 1, 0.0]

# Disable PPS
[[casbin]]
tag = "pps-off"
description = "Disable PPS output"
class = 0x06
id = 0x03
payload.types = "U4U4I1I1I1U1R4"
payload.values = [1000000, 0, 0, 0, 0, 0, 0.0]

# CFG-CFG: Save/load configuration
# Payload: U2 mask, U1 mode, U1 reserved
# mask: 0xFFFF = all sections
# mode: 0=clear, 1=save, 2=load

# Save configuration to NVM
[[casbin]]
tag = "save"
description = "Save configuration to NVM"
class = 0x06
id = 0x05
payload.types = "U2U1U1"
payload.values = [0xFFFF, 1, 0]

# Load configuration from NVM (undo unsaved changes)
[[casbin]]
tag = "reload"
description = "Reload configuration from NVM"
class = 0x06
id = 0x05
payload.types = "U2U1U1"
payload.values = [0xFFFF, 2, 0]

# CFG-NAVLIMIT: Satellite filtering for positioning
# Payload: U1 minSVs, U1 maxSVs, U1 minCNO, I1 minEle, U4 reserved
# Defaults: minSVs=4, maxSVs=80, minCNO=8, minEle=5

# Set minimum elevation to 20 degrees
[[casbin]]
tag = "min-elev20"
description = "Set minimum elevation to 20 degrees"
class = 0x06
id = 0x0A
payload.types = "U1U1U1I1U4"
payload.values = [4, 80, 8, 20, 0]

# CFG-RST: Reset receiver
# Payload: U2 navBbrMask, U1 resetMode, U1 startMode
# navBbrMask: sections to clear (0=none, 0x039F=most, 0xFFFF=all)
# resetMode: 0=HW immediate, 1=SW controlled
# startMode: 0=hot, 1=warm, 2=cold, 3=factory

# Reset receiver with cold start (clear ephemeris, almanac, position)
# Uses HW immediate reset, clears all except clock drift/osc params
[[casbin]]
tag = "reset"
description = "Cold start (clear ephemeris, almanac, position)"
class = 0x06
id = 0x02
payload.types = "U2U1U1"
payload.values = [0x039F, 0, 2]

# Factory reset (restore NVM to defaults and reset receiver)
# Uses HW immediate reset, clears all except clock drift/osc params
[[casbin]]
tag = "factory-reset"
description = "Factory reset (restore all defaults)"
class = 0x06
id = 0x02
payload.types = "U2U1U1"
payload.values = [0x039F, 0, 3]

# CFG-RATE: Navigation update rate
# Payload: U2 measRate_ms, U2 reserved

# 1 Hz navigation rate
[[casbin]]
tag = "rate-1hz"
description = "Set 1 Hz navigation rate"
class = 0x06
id = 0x04
payload.types = "U2U2"
payload.values = [1000, 0]


# CFG-PRT: Serial port configuration
# Payload: U1 portId, U1 protoMask, U2 mode, U4 baudRate
# portId: 0=UART0, 1=UART1, 0xFF=current
# protoMask: B0=binary in, B1=text in, B4=binary out, B5=text out

# Set baud rate to 115200 (binary+NMEA in/out)
[[casbin]]
tag = "speed-115200"
description = "Set baud rate to 115200"
class = 0x06
id = 0x00
payload.types = "U1U1U2U4"
payload.values = [0xFF, 0x33, 0x08C0, 115200]

# Set baud rate to 38400 (binary+NMEA in/out)
[[casbin]]
tag = "speed-38400"
description = "Set baud rate to 38400"
class = 0x06
id = 0x00
payload.types = "U1U1U2U4"
payload.values = [0xFF, 0x33, 0x08C0, 38400]

# Set baud rate to 9600 (binary+NMEA in/out)
[[casbin]]
tag = "speed-9600"
description = "Set baud rate to 9600"
class = 0x06
id = 0x00
payload.types = "U1U1U2U4"
payload.values = [0xFF, 0x33, 0x08C0, 9600]

# CFG-MSG: Enable/disable message output
# Payload: U1 class, U1 id, U2 rate
# rate: 0=off, 1=every fix, N=every N fixes

# Enable NAV2-SOL (position/velocity) at 1Hz
[[casbin]]
tag = "casbin-nav2-sol"
description = "Enable NAV2-SOL output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x11, 0x02, 1]

# Disable NAV2-SOL
[[casbin]]
tag = "casbin-nav2-sol-off"
description = "Disable NAV2-SOL output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x11, 0x02, 0]

# Enable NAV2-TIMEUTC at 1Hz
[[casbin]]
tag = "casbin-nav2-timeutc"
description = "Enable NAV2-TIMEUTC output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x11, 0x05, 1]

# Disable NAV2-TIMEUTC
[[casbin]]
tag = "casbin-nav2-timeutc-off"
description = "Disable NAV2-TIMEUTC output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x11, 0x05, 0]

# NMEA message class is 0x4E
# GGA=0x00, GLL=0x01, GSA=0x02, GSV=0x03, RMC=0x04, VTG=0x05, ZDA=0x08

# Enable GGA at 1Hz
[[casbin]]
tag = "nmea-gga"
description = "Enable NMEA GGA output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x00, 1]

# Disable GGA
[[casbin]]
tag = "nmea-gga-off"
description = "Disable NMEA GGA output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x00, 0]

# Enable GSV at 1Hz
[[casbin]]
tag = "nmea-gsv"
description = "Enable NMEA GSV output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x03, 1]

# Disable GSV
[[casbin]]
tag = "nmea-gsv-off"
description = "Disable NMEA GSV output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x03, 0]

# Enable RMC at 1Hz
[[casbin]]
tag = "nmea-rmc"
description = "Enable NMEA RMC output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x04, 1]

# Disable RMC
[[casbin]]
tag = "nmea-rmc-off"
description = "Disable NMEA RMC output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x04, 0]

# Enable GSA at 1Hz
[[casbin]]
tag = "nmea-gsa"
description = "Enable NMEA GSA output at 1Hz"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x02, 1]

# Disable GSA
[[casbin]]
tag = "nmea-gsa-off"
description = "Disable NMEA GSA output"
class = 0x06
id = 0x01
payload.types = "U1U1U2"
payload.values = [0x4E, 0x02, 0]

# CFG-NMEA: NMEA output configuration
# Payload: U1 nmeaVer, U1 latLonReso, U1 heightReso, U1 gsaPlus,
#          U1 nmeaValidOpen, U1 res, U2 res2
# nmeaVer: 0=V2.2, 1=V4.0, 2=V4.10, 3=V4.11

# Set NMEA version 4.10
[[casbin]]
tag = "nmea-v41"
description = "Set NMEA version 4.10"
class = 0x06
id = 0x12
payload.types = "U1U1U1U1U1U1U2"
payload.values = [2, 7, 3, 4, 0, 0, 0]
