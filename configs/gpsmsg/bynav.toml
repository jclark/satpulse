#:schema ./gpsmsg-schema.json
# Bynav M2 configuration messages
# NovAtel-compatible GNSS receiver
# Default baud rate: 115200

[default.line]
eol = "\r\n"

# Version / Probe

# Query firmware and hardware version
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "get-version"
text = "LOG VERSION"
description = "Query firmware and hardware version"

# Disable all logging
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "msg-all-off"
description = "Disable all message output"
text = "UNLOGALL"

# BESTPOS (NovAtel format geodetic position, msg 42)
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestposb"
description = "Enable BESTPOS binary at 1Hz"
text = "LOG BESTPOSB ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestposb-off"
description = "Disable BESTPOS binary"
text = "UNLOG BESTPOSB"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestposa"
description = "Enable BESTPOS ASCII at 1Hz"
text = "LOG BESTPOSA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestposa-off"
description = "Disable BESTPOS ASCII"
text = "UNLOG BESTPOSA"

# BESTGNSSPOS (GNSS-only geodetic position, msg 1429)
[[line]]
tag = "nov-bestgnssposb"
description = "Enable BESTGNSSPOS binary at 1Hz"
text = "LOG BESTGNSSPOSB ONTIME 1"
[[line]]
tag = "nov-bestgnssposb-off"
description = "Disable BESTGNSSPOS binary"
text = "UNLOG BESTGNSSPOSB"
[[line]]
tag = "nov-bestgnssposa"
description = "Enable BESTGNSSPOS ASCII at 1Hz"
text = "LOG BESTGNSSPOSA ONTIME 1"
[[line]]
tag = "nov-bestgnssposa-off"
description = "Disable BESTGNSSPOS ASCII"
text = "UNLOG BESTGNSSPOSA"

# BESTVEL (velocity, msg 99)
# Not documented in Bynav UG017 but works correctly
# Verified OK received and valid binary frames on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestvelb"
description = "Enable BESTVEL binary at 1Hz"
text = "LOG BESTVELB ONTIME 1"
[[line]]
tag = "nov-bestvelb-off"
description = "Disable BESTVEL binary"
text = "UNLOG BESTVELB"
[[line]]
tag = "nov-bestvela"
description = "Enable BESTVEL ASCII at 1Hz"
text = "LOG BESTVELA ONTIME 1"
[[line]]
tag = "nov-bestvela-off"
description = "Disable BESTVEL ASCII"
text = "UNLOG BESTVELA"

# PSRVEL (pseudorange velocity, msg 100)
[[line]]
tag = "nov-psrvelb"
description = "Enable PSRVEL binary at 1Hz"
text = "LOG PSRVELB ONTIME 1"
[[line]]
tag = "nov-psrvelb-off"
description = "Disable PSRVEL binary"
text = "UNLOG PSRVELB"
[[line]]
tag = "nov-psrvela"
description = "Enable PSRVEL ASCII at 1Hz"
text = "LOG PSRVELA ONTIME 1"
[[line]]
tag = "nov-psrvela-off"
description = "Disable PSRVEL ASCII"
text = "UNLOG PSRVELA"

# BESTGNSSVEL (velocity, msg 1430)
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestgnssvelb"
description = "Enable BESTGNSSVEL binary at 1Hz"
text = "LOG BESTGNSSVELB ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestgnssvelb-off"
description = "Disable BESTGNSSVEL binary"
text = "UNLOG BESTGNSSVELB"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestgnssvela"
description = "Enable BESTGNSSVEL ASCII at 1Hz"
text = "LOG BESTGNSSVELA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-bestgnssvela-off"
description = "Disable BESTGNSSVEL ASCII"
text = "UNLOG BESTGNSSVELA"

# BESTXYZ (ECEF position and velocity, msg 241)
[[line]]
tag = "nov-bestxyzb"
description = "Enable BESTXYZ binary at 1Hz"
text = "LOG BESTXYZB ONTIME 1"
[[line]]
tag = "nov-bestxyzb-off"
description = "Disable BESTXYZ binary"
text = "UNLOG BESTXYZB"
[[line]]
tag = "nov-bestxyza"
description = "Enable BESTXYZ ASCII at 1Hz"
text = "LOG BESTXYZA ONTIME 1"
[[line]]
tag = "nov-bestxyza-off"
description = "Disable BESTXYZ ASCII"
text = "UNLOG BESTXYZA"

# NMEA Output Control

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gga"
description = "Enable NMEA GGA at 1Hz"
text = "LOG GPGGA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gga-off"
description = "Disable NMEA GGA"
text = "UNLOG GPGGA"

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-rmc"
description = "Enable NMEA RMC at 1Hz"
text = "LOG GPRMC ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-rmc-off"
description = "Disable NMEA RMC"
text = "UNLOG GPRMC"

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gsa"
description = "Enable NMEA GSA at 1Hz"
text = "LOG GPGSA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gsa-off"
description = "Disable NMEA GSA"
text = "UNLOG GPGSA"

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gsv"
description = "Enable NMEA GSV at 1Hz"
text = "LOG GPGSV ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-gsv-off"
description = "Disable NMEA GSV"
text = "UNLOG GPGSV"

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-zda"
description = "Enable NMEA ZDA at 1Hz"
text = "LOG GPZDA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-zda-off"
description = "Disable NMEA ZDA"
text = "UNLOG GPZDA"

# Convenience: enable RMC, GGA, GSV, GSA (messages used by satpulse daemon)
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-daemon"
description = "Enable NMEA messages used by satpulse daemon"
text = "LOG GPRMC ONTIME 1"
[[line]]
tag = "nmea-daemon"
text = "LOG GPGGA ONTIME 1"
[[line]]
tag = "nmea-daemon"
text = "LOG GPGSV ONTIME 1"
[[line]]
tag = "nmea-daemon"
text = "LOG GPGSA ONTIME 1"

# Reload

# RESET reloads last saved configuration
[[line]]
tag = "reload"
description = "Reload configuration from flash"
text = "RESET"
delay = 3

# TIME (NovAtel format receiver clock and UTC time, msg 101)
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-timeb"
description = "Enable TIME binary at 1Hz"
text = "LOG TIMEB ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-timeb-off"
description = "Disable TIME binary"
text = "UNLOG TIMEB"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-timea"
description = "Enable TIME ASCII at 1Hz"
text = "LOG TIMEA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-timea-off"
description = "Disable TIME ASCII"
text = "UNLOG TIMEA"

# PSRDOP (pseudorange DOP, msg 174)
[[line]]
tag = "nov-psrdopb"
description = "Enable PSRDOP binary at 1Hz"
text = "LOG PSRDOPB ONTIME 1"
[[line]]
tag = "nov-psrdopb-off"
description = "Disable PSRDOP binary"
text = "UNLOG PSRDOPB"
[[line]]
tag = "nov-psrdopa"
description = "Enable PSRDOP ASCII at 1Hz"
text = "LOG PSRDOPA ONTIME 1"
[[line]]
tag = "nov-psrdopa-off"
description = "Disable PSRDOP ASCII"
text = "UNLOG PSRDOPA"

# IONUTC (NovAtel format ionospheric and UTC parameters, msg 8)
# Note: ONCHANGED is broken on Bynav M2 (spams at ~10Hz); use ONTIME instead
# Verified OK received with ONTIME 1 on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-ionutcb"
description = "Enable IONUTC binary at 1Hz"
text = "LOG IONUTCB ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-ionutcb-off"
description = "Disable IONUTC binary"
text = "UNLOG IONUTCB"
# Verified OK received with ONTIME 1 on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-ionutca"
description = "Enable IONUTC ASCII at 1Hz"
text = "LOG IONUTCA ONTIME 1"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-ionutca-off"
description = "Disable IONUTC ASCII"
text = "UNLOG IONUTCA"

# Elevation Mask
# Verified OK received for 0/5/10/45 on Bynav M2 (V7.84_250E94_T)

[[line]]
tag = "min-elev-0"
description = "Set satellite cutoff elevation to 0 degrees"
text = "ECUTOFF 0"
[[line]]
tag = "min-elev-5"
description = "Set satellite cutoff elevation to 5 degrees (default)"
text = "ECUTOFF 5"
[[line]]
tag = "min-elev-10"
description = "Set satellite cutoff elevation to 10 degrees"
text = "ECUTOFF 10"
[[line]]
tag = "min-elev-15"
description = "Set satellite cutoff elevation to 15 degrees"
text = "ECUTOFF 15"
[[line]]
tag = "min-elev-20"
description = "Set satellite cutoff elevation to 20 degrees"
text = "ECUTOFF 20"
[[line]]
tag = "min-elev-25"
description = "Set satellite cutoff elevation to 25 degrees"
text = "ECUTOFF 25"
[[line]]
tag = "min-elev-30"
description = "Set satellite cutoff elevation to 30 degrees"
text = "ECUTOFF 30"
[[line]]
tag = "min-elev-35"
description = "Set satellite cutoff elevation to 35 degrees"
text = "ECUTOFF 35"
[[line]]
tag = "min-elev-40"
description = "Set satellite cutoff elevation to 40 degrees"
text = "ECUTOFF 40"
[[line]]
tag = "min-elev-45"
description = "Set satellite cutoff elevation to 45 degrees"
text = "ECUTOFF 45"

# GNSS Constellation Selection (WORKFREQS)
# Takes effect after saveconfig and reset
# ASSIGNALL is accepted but has no effect on Bynav M2 (V7.84_250E94_T)
# WORKFREQS NONE BEIDOU is silently ignored (BeiDou cannot be disabled)

[[line]]
tag = "gnss-gps-bds"
description = "Enable GPS+BeiDou only (takes effect after save and reset)"
text = "WORKFREQS ALL ALL"
[[line]]
tag = "gnss-gps-bds"
text = "WORKFREQS NONE GLONASS"
[[line]]
tag = "gnss-gps-bds"
text = "WORKFREQS NONE GALILEO"
[[line]]
tag = "gnss-gps-bds"
text = "WORKFREQS NONE QZSS"
[[line]]
tag = "gnss-gps-bds"
text = "WORKFREQS NONE IRNSS"

[[line]]
tag = "gnss-gal-bds"
description = "Enable Galileo+BeiDou only (takes effect after save and reset)"
text = "WORKFREQS ALL ALL"
[[line]]
tag = "gnss-gal-bds"
text = "WORKFREQS NONE GPS"
[[line]]
tag = "gnss-gal-bds"
text = "WORKFREQS NONE GLONASS"
[[line]]
tag = "gnss-gal-bds"
text = "WORKFREQS NONE QZSS"
[[line]]
tag = "gnss-gal-bds"
text = "WORKFREQS NONE IRNSS"

[[line]]
tag = "gnss-glo-bds"
description = "Enable GLONASS+BeiDou only (takes effect after save and reset)"
text = "WORKFREQS ALL ALL"
[[line]]
tag = "gnss-glo-bds"
text = "WORKFREQS NONE GPS"
[[line]]
tag = "gnss-glo-bds"
text = "WORKFREQS NONE GALILEO"
[[line]]
tag = "gnss-glo-bds"
text = "WORKFREQS NONE QZSS"
[[line]]
tag = "gnss-glo-bds"
text = "WORKFREQS NONE IRNSS"

# BeiDou cannot be disabled; gnss-bds disables everything else
[[line]]
tag = "gnss-bds"
description = "Enable BeiDou only (takes effect after save and reset)"
text = "WORKFREQS ALL ALL"
[[line]]
tag = "gnss-bds"
text = "WORKFREQS NONE GPS"
[[line]]
tag = "gnss-bds"
text = "WORKFREQS NONE GLONASS"
[[line]]
tag = "gnss-bds"
text = "WORKFREQS NONE GALILEO"
[[line]]
tag = "gnss-bds"
text = "WORKFREQS NONE QZSS"
[[line]]
tag = "gnss-bds"
text = "WORKFREQS NONE IRNSS"

[[line]]
tag = "gnss-all"
description = "Enable all constellations (takes effect after save and reset)"
text = "WORKFREQS ALL ALL"

# NMEA Talker ID

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-talker-auto"
description = "Set NMEA talker ID to AUTO (GP/BD/GN based on constellation)"
text = "NMEATALKER AUTO"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nmea-talker-gp"
description = "Set NMEA talker ID to GP"
text = "NMEATALKER GP"

# Raw Observations

# Verified RANGECMP binary frames appear in capture on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-rangecmpb"
description = "Enable RANGECMP binary every 30s"
text = "LOG RANGECMPB ONTIME 30"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "nov-rangecmpb-off"
description = "Disable RANGECMP binary"
text = "UNLOG RANGECMPB"

# PPS Configuration
# PPSCONTROL: Switch Edge Period(s) PulseWidth(us)
# Only on firmware 0704 and above

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "pps"
description = "Enable PPS with 1ms pulse, rising edge"
text = "PPSCONTROL ENABLE POSITIVE 1 1000"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "pps-off"
description = "Disable PPS output"
text = "PPSCONTROL DISABLE"

# Reset Commands

# RESET reloads last saved config (equivalent to hot start)
[[line]]
tag = "hot-start"
description = "Hot start - reload saved config"
text = "RESET"
delay = 3

# FRESET STANDARD clears all ephemeris, almanac, and GLONASS bias
[[line]]
tag = "cold-start"
description = "Cold start - clears all satellite data"
text = "FRESET STANDARD"
delay = 5

# Survey-in (FIX BASE)
# FIX BASE TIME DISTANCE - auto-converge and fix base position

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "survey"
description = "Start survey-in (60s, 3m accuracy)"
text = "FIX BASE 60 3"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "survey-off"
description = "Stop survey-in, return to rover mode"
text = "FIX NONE"

# Fixed Position

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "fixed-pos-current"
description = "Fix position to current solution"
text = "FIX AUTO"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "fixed-pos-example"
description = "Set fixed position (example coordinates - replace with yours)"
text = "FIX POSITION 13.7305 100.6405 50.0"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "fixed-pos-off"
description = "Clear fixed position"
text = "FIX NONE"

# RTK Mode (RTKTYPE)
# RTCM output requires base mode; set mode-base before enabling RTCM
# Verified OK received on Bynav M2 (V7.84_250E94_T)
# Verified RTCM 1074 frames appear after mode-base + fixed position
[[line]]
tag = "mode-base"
description = "Set base station mode"
text = "RTKTYPE BASE"
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "mode-rover"
description = "Set rover mode"
text = "RTKTYPE ROVER"

# RTCM Output
# Note: requires mode-base and a fixed position (FIX POSITION or FIX BASE)

# ARP (antenna reference point, message 1006)
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "rtcm-arp"
description = "Enable RTCM ARP message (1006) at 5s"
text = "LOG RTCM1006 ONTIME 5"

# MSM4 messages for all constellations
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "rtcm-msm4"
description = "Enable RTCM MSM4 for all constellations at 1Hz"
text = "LOG RTCM1074 ONTIME 1"
[[line]]
tag = "rtcm-msm4"
text = "LOG RTCM1084 ONTIME 1"
[[line]]
tag = "rtcm-msm4"
text = "LOG RTCM1094 ONTIME 1"
[[line]]
tag = "rtcm-msm4"
text = "LOG RTCM1124 ONTIME 1"

# MSM7 messages for all constellations
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "rtcm-msm7"
description = "Enable RTCM MSM7 for all constellations at 1Hz"
text = "LOG RTCM1077 ONTIME 1"
[[line]]
tag = "rtcm-msm7"
text = "LOG RTCM1087 ONTIME 1"
[[line]]
tag = "rtcm-msm7"
text = "LOG RTCM1097 ONTIME 1"
[[line]]
tag = "rtcm-msm7"
text = "LOG RTCM1127 ONTIME 1"

# Disable all RTCM output
# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "rtcm-off"
description = "Disable all RTCM output"
text = "UNLOG RTCM1006"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1074"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1084"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1094"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1124"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1077"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1087"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1097"
[[line]]
tag = "rtcm-off"
text = "UNLOG RTCM1127"

# Port Configuration (SERIALCONFIG)

# Verified OK received on Bynav M2 (V7.84_250E94_T)
[[line]]
tag = "get-port"
description = "Query serial port configuration"
text = "LOG COMCONFIG"

[[line]]
tag = "speed-9600"
description = "Set COM1 baud rate to 9600"
text = "SERIALCONFIG COM1 9600"
[[line]]
tag = "speed-19200"
description = "Set COM1 baud rate to 19200"
text = "SERIALCONFIG COM1 19200"
[[line]]
tag = "speed-38400"
description = "Set COM1 baud rate to 38400"
text = "SERIALCONFIG COM1 38400"
[[line]]
tag = "speed-57600"
description = "Set COM1 baud rate to 57600"
text = "SERIALCONFIG COM1 57600"
[[line]]
tag = "speed-115200"
description = "Set COM1 baud rate to 115200"
text = "SERIALCONFIG COM1 115200"
[[line]]
tag = "speed-230400"
description = "Set COM1 baud rate to 230400"
text = "SERIALCONFIG COM1 230400"
[[line]]
tag = "speed-460800"
description = "Set COM1 baud rate to 460800"
text = "SERIALCONFIG COM1 460800"
[[line]]
tag = "speed-921600"
description = "Set COM1 baud rate to 921600"
text = "SERIALCONFIG COM1 921600"

# Save Configuration

[[line]]
tag = "save"
description = "Save current configuration to flash"
text = "SAVECONFIG"

# Factory Reset

[[line]]
tag = "factory-reset"
description = "Factory reset - clears all settings and satellite data"
text = "FRESET STANDARD"
delay = 5
