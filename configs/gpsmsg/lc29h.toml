#:schema ./gpsmsg-schema.json
# LC29H configuration messages
# Quectel LC29H GNSS receiver
# Default baud rate: 115200
# Tested on LC29H(AA) firmware LC29HAANR11A05S (2025/09/12)

# Get firmware version
# Verified on LC29H(AA)
[[nmea]]
text = "PQTMVERNO"
tag = "get-version"
description = "Get firmware and hardware version"

# Get chip unique ID (LC29H AA only)
[[nmea]]
text = "PQTMUNIQID"
tag = "get-uniqid"
description = "Get chip unique ID"

# Get PPS configuration
# Verified on LC29H(AA)
[[nmea]]
text = "PQTMCFGPPS,R,1"
tag = "get-pps"
description = "Get PPS configuration"

# Enable PPS: 100ms pulse, only when locked, rising edge
# Index=1, Enable=1, Duration=100, Mode=2 (fix only), Polarity=1 (high), Reserved=0
# Verified OK response on LC29H(AA)
[[nmea]]
text = "PQTMCFGPPS,W,1,1,100,2,1,0"
tag = "pps"
description = "Enable PPS output (0.1s pulse, only when locked)"

# Disable PPS output
[[nmea]]
text = "PQTMCFGPPS,W,1,0"
tag = "pps-off"
description = "Disable PPS output"

# Get PQTMGEOFENCESTATUS rate (test from manual example)
# Verified on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,R,PQTMGEOFENCESTATUS,1"
tag = "get-pqtm-geofence"
description = "Get PQTMGEOFENCESTATUS message rate"

# Get PQTMDOP message rate
# Verified on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,R,PQTMDOP,1"
tag = "get-pqtm-dop"
description = "Get PQTMDOP message rate"

# Enable PQTMDOP message (dilution of precision)
# Verified OK and PQTMDOP messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,1,1"
tag = "pqtm-dop"
description = "Enable PQTMDOP message (rate of one per fix)"

# Disable PQTMDOP message
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMDOP,0,1"
tag = "pqtm-dop-off"
description = "Disable PQTMDOP message"

# Enable PQTMEPE message (estimated position error)
# Verified OK and PQTMEPE messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,1,2"
tag = "pqtm-epe"
description = "Enable PQTMEPE message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMEPE,0,2"
tag = "pqtm-epe-off"
description = "Disable PQTMEPE message"

# Enable PQTMPVT message (position/velocity/time)
# Verified OK and PQTMPVT messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,1,1"
tag = "pqtm-pvt"
description = "Enable PQTMPVT message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPVT,0,1"
tag = "pqtm-pvt-off"
description = "Disable PQTMPVT message"

# Enable PQTMPL message (protection level)
# Verified OK and PQTMPL messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,1,1"
tag = "pqtm-pl"
description = "Enable PQTMPL message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMPL,0,1"
tag = "pqtm-pl-off"
description = "Disable PQTMPL message"

# Enable PQTMSVINSTATUS message (survey-in status)
# Verified OK and PQTMSVINSTATUS messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,1,1"
tag = "pqtm-svinstatus"
description = "Enable PQTMSVINSTATUS message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMSVINSTATUS,0,1"
tag = "pqtm-svinstatus-off"
description = "Disable PQTMSVINSTATUS message"

# Enable PQTMVEL message (velocity info)
# Verified OK and PQTMVEL messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,1,1"
tag = "pqtm-vel"
description = "Enable PQTMVEL message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMVEL,0,1"
tag = "pqtm-vel-off"
description = "Disable PQTMVEL message"

# Enable PQTMODO message (odometer)
# Verified OK and PQTMODO messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMODO,1,1"
tag = "pqtm-odo"
description = "Enable PQTMODO message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMODO,0,1"
tag = "pqtm-odo-off"
description = "Disable PQTMODO message"

# Enable PQTMLS message (leap second forecast)
# Verified OK and PQTMLS messages appear on LC29H(AA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMLS,1,1"
tag = "pqtm-ls"
description = "Enable PQTMLS message (rate of one per fix)"
[[nmea]]
text = "PQTMCFGMSGRATE,W,PQTMLS,0,1"
tag = "pqtm-ls-off"
description = "Disable PQTMLS message"

# Constellation configuration
# Verified get/set on LC29H(AA)

# Get constellation configuration
[[nmea]]
text = "PQTMCFGCNST,R"
tag = "get-gnss"
description = "Get constellation configuration"

# GPS only
[[nmea]]
text = "PQTMCFGCNST,W,1,0,0,0,0,0"
tag = "gnss-gps"
description = "Enable GPS only"

# BDS only
[[nmea]]
text = "PQTMCFGCNST,W,0,0,0,1,0,0"
tag = "gnss-bds"
description = "Enable BDS only"

# GPS + BDS
[[nmea]]
text = "PQTMCFGCNST,W,1,0,0,1,0,0"
tag = "gnss-gps-bds"
description = "Enable GPS and BDS"

# GPS + Galileo
[[nmea]]
text = "PQTMCFGCNST,W,1,0,1,0,0,0"
tag = "gnss-gps-gal"
description = "Enable GPS and Galileo"

# GPS + GLONASS
[[nmea]]
text = "PQTMCFGCNST,W,1,1,0,0,0,0"
tag = "gnss-gps-glo"
description = "Enable GPS and GLONASS"

# GPS + Galileo + BDS
[[nmea]]
text = "PQTMCFGCNST,W,1,0,1,1,0,0"
tag = "gnss-gps-gal-bds"
description = "Enable GPS, Galileo and BDS"

# All constellations
[[nmea]]
text = "PQTMCFGCNST,W,1,1,1,1,1,1"
tag = "gnss-all"
description = "Enable all constellations"

# Get fix rate
# Verified on LC29H(AA)
[[nmea]]
text = "PQTMCFGFIXRATE,R"
tag = "get-fix-rate"
description = "Get fix interval"

# Set fix rate to 1 Hz
[[nmea]]
text = "PQTMCFGFIXRATE,W,1000"
tag = "fix-rate-1"
description = "Set fix rate to 1 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,500"
tag = "fix-rate-2"
description = "Set fix rate to 2 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,200"
tag = "fix-rate-5"
description = "Set fix rate to 5 Hz"
[[nmea]]
text = "PQTMCFGFIXRATE,W,100"
tag = "fix-rate-10"
description = "Set fix rate to 10 Hz"

# Get elevation mask
# Verified on LC29H(AA)
[[nmea]]
text = "PAIR073"
tag = "get-min-elev"
description = "Get elevation mask"

# Set elevation mask
# Verified OK on LC29H(AA)
[[nmea]]
text = "PAIR072,0"
tag = "min-elev-0"
description = "Set elevation mask to 0 degrees"
[[nmea]]
text = "PAIR072,5"
tag = "min-elev-5"
description = "Set elevation mask to 5 degrees (default)"
[[nmea]]
text = "PAIR072,10"
tag = "min-elev-10"
description = "Set elevation mask to 10 degrees"
[[nmea]]
text = "PAIR072,15"
tag = "min-elev-15"
description = "Set elevation mask to 15 degrees"
[[nmea]]
text = "PAIR072,20"
tag = "min-elev-20"
description = "Set elevation mask to 20 degrees"
[[nmea]]
text = "PAIR072,25"
tag = "min-elev-25"
description = "Set elevation mask to 25 degrees"
[[nmea]]
text = "PAIR072,30"
tag = "min-elev-30"
description = "Set elevation mask to 30 degrees"
[[nmea]]
text = "PAIR072,35"
tag = "min-elev-35"
description = "Set elevation mask to 35 degrees"
[[nmea]]
text = "PAIR072,40"
tag = "min-elev-40"
description = "Set elevation mask to 40 degrees"
[[nmea]]
text = "PAIR072,45"
tag = "min-elev-45"
description = "Set elevation mask to 45 degrees"

# Survey-in configuration
# Doc says supported on BA/CA/DA/EA only, but get-survey works on LC29H(AA)

# Get survey-in config
[[nmea]]
text = "PQTMCFGSVIN,R"
tag = "get-survey"
description = "Get survey-in configuration"

# Survey-in: 2000 fixes, 20m accuracy
# Mode=1 (survey-in), MinDur=2000, 3D_AccLimit=20.0, ECEF_X/Y/Z=0
[[nmea]]
text = "PQTMCFGSVIN,W,1,2000,20.0,0,0,0"
tag = "survey"
description = "Start survey-in (2000 fixes, 20m accuracy limit)"

# Mobile mode (disable survey-in or fixed position)
[[nmea]]
text = "PQTMCFGSVIN,W,0,0,0,0,0,0"
tag = "mobile"
description = "Return to mobile mode (disable survey-in or fixed position)"

# Fixed position mode (Mode=2)
# ECEF coordinates in meters - example from protocol doc
[[nmea]]
text = "PQTMCFGSVIN,W,2,0,0,-1144698.0455,6090335.4099,1504171.3914"
tag = "fixed-pos-example"
description = "Set fixed ECEF position (example coordinates - replace with yours)"

# Get current UART config
[[nmea]]
text = "PQTMCFGUART,R"
tag = "get-uart"
description = "Get UART configuration"

# Baud rate configuration
[[nmea]]
text = "PQTMCFGUART,W,9600"
tag = "speed-9600"
description = "Set baud rate to 9600"
[[nmea]]
text = "PQTMCFGUART,W,115200"
tag = "speed-115200"
description = "Set baud rate to 115200"
[[nmea]]
text = "PQTMCFGUART,W,230400"
tag = "speed-230400"
description = "Set baud rate to 230400"
[[nmea]]
text = "PQTMCFGUART,W,460800"
tag = "speed-460800"
description = "Set baud rate to 460800"
[[nmea]]
text = "PQTMCFGUART,W,921600"
tag = "speed-921600"
description = "Set baud rate to 921600"

# NMEA version (LC29H AA only)
# Verified on LC29H(AA): default V4.10
[[nmea]]
text = "PAIR101"
tag = "get-nmea-ver"
description = "Get NMEA output version"
[[nmea]]
text = "PAIR100,1,0"
tag = "nmea-ver-410"
description = "Set NMEA version to 4.10"
[[nmea]]
text = "PAIR100,2,0"
tag = "nmea-ver-3"
description = "Set NMEA version to 3.01"

# Get dual band setting
# Verified on LC29H(AA): returns 1 (dual band enabled)
[[nmea]]
text = "PAIR105"
tag = "get-band"
description = "Get dual band setting"

# PAIR commands

# Get RTCM output mode
# Verified on LC29H(AA): returns -1 (not supported)
[[nmea]]
text = "PAIR433"
tag = "get-rtcm-out"
description = "Query RTCM output mode"

# RTCM MSM4 output
# Verified on LC29H(AA): outputs 1074/1084/1094/1114/1124
[[nmea]]
text = "PAIR432,0"
tag = "rtcm-msm4"
description = "Enable RTCM MSM4 output"

# Enable RTCM MSM7 output
[[nmea]]
text = "PAIR432,1"
tag = "rtcm-msm7"
description = "Enable RTCM MSM7 output"

# Disable RTCM output
[[nmea]]
text = "PAIR432,-1"
tag = "rtcm-off"
description = "Disable RTCM output"

# Enable RTCM ARP message (1005)
# Verified on LC29H(AA): outputs MT1005 when MSM is also enabled
[[nmea]]
text = "PAIR434,1"
tag = "rtcm-arp"
description = "Enable RTCM ARP message (1005)"

# Disable RTCM ARP message (1005)
[[nmea]]
text = "PAIR434,0"
tag = "rtcm-arp-off"
description = "Disable RTCM ARP message (1005)"

# Get RTCM ARP output setting
[[nmea]]
text = "PAIR435"
tag = "get-rtcm-arp"
description = "Query RTCM ARP output setting"

# RTCM reference station ID (LC29H AA only, range 0-4095)
# Verified on LC29H(AA): default 3335, set to 1234 confirmed in MT1005
[[nmea]]
text = "PQTMCFGRSID,R"
tag = "get-rtcm-base-id"
description = "Get RTCM reference station ID"
[[nmea]]
text = "PQTMCFGRSID,W,0"
tag = "rtcm-base-id-0"
description = "Set RTCM reference station ID to 0"
[[nmea]]
text = "PQTMCFGRSID,W,1234"
tag = "rtcm-base-id-1234"
description = "Set RTCM reference station ID to 1234"

# Receiver mode
# Not supported on LC29H(AA) - rejected with "unsupported command"
[[nmea]]
text = "PQTMCFGRCVRMODE,R"
tag = "get-mode"
description = "Get receiver mode (rover/base)"
[[nmea]]
text = "PQTMCFGRCVRMODE,W,2"
tag = "mode-base"
description = "Set base station mode"
[[nmea]]
text = "PQTMCFGRCVRMODE,W,1"
tag = "mode-rover"
description = "Set rover mode"

# Save configuration to NVM
[[nmea]]
text = "PQTMSAVEPAR"
tag = "save"
description = "Save configuration to NVM"

# Reload configuration from NVM (reboot receiver)
[[nmea]]
text = "PQTMSRR"
tag = "reload"
description = "Reload configuration from NVM (reboot)"

# Factory reset: restore defaults then reboot
[[nmea]]
text = "PQTMRESTOREPAR"
tag = "factory-reset"
description = "Restore factory defaults and reboot"
[[nmea]]
text = "PQTMSRR"
tag = "factory-reset"

# Hot start (keep ephemeris, almanac, position, time)
[[nmea]]
text = "PQTMHOT"
tag = "hot-start"
description = "Perform hot start"

# Warm start (keep almanac, clear ephemeris)
[[nmea]]
text = "PQTMWARM"
tag = "warm-start"
description = "Perform warm start"

# Cold start (clear all data)
[[nmea]]
text = "PQTMCOLD"
tag = "cold-start"
description = "Perform cold start"

# NMEA Message Control
# Verified OK response for all on LC29H(AA)

# RMC
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,1"
tag = "nmea-rmc"
description = "Enable NMEA RMC message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,0"
tag = "nmea-rmc-off"
description = "Disable NMEA RMC message"

# GGA
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,1"
tag = "nmea-gga"
description = "Enable NMEA GGA message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,0"
tag = "nmea-gga-off"
description = "Disable NMEA GGA message"

# GSV
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,1"
tag = "nmea-gsv"
description = "Enable NMEA GSV message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,0"
tag = "nmea-gsv-off"
description = "Disable NMEA GSV message"

# GSA
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,1"
tag = "nmea-gsa"
description = "Enable NMEA GSA message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,0"
tag = "nmea-gsa-off"
description = "Disable NMEA GSA message"

# VTG
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,1"
tag = "nmea-vtg"
description = "Enable NMEA VTG message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,0"
tag = "nmea-vtg-off"
description = "Disable NMEA VTG message"

# GLL
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,1"
tag = "nmea-gll"
description = "Enable NMEA GLL message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,0"
tag = "nmea-gll-off"
description = "Disable NMEA GLL message"

# ZDA
[[nmea]]
text = "PQTMCFGMSGRATE,W,ZDA,1"
tag = "nmea-zda"
description = "Enable NMEA ZDA message"
[[nmea]]
text = "PQTMCFGMSGRATE,W,ZDA,0"
tag = "nmea-zda-off"
description = "Disable NMEA ZDA message"

# Disable all standard NMEA messages
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,0"
tag = "nmea-off"
description = "Disable all standard NMEA messages"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,VTG,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GLL,0"
tag = "nmea-off"
[[nmea]]
text = "PQTMCFGMSGRATE,W,ZDA,0"
tag = "nmea-off"

# Enable NMEA messages for satpulse daemon (RMC, GGA, GSV, GSA)
[[nmea]]
text = "PQTMCFGMSGRATE,W,RMC,1"
tag = "nmea-daemon"
description = "Enable NMEA messages for satpulse daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GGA,1"
tag = "nmea-daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSV,1"
tag = "nmea-daemon"
[[nmea]]
text = "PQTMCFGMSGRATE,W,GSA,1"
tag = "nmea-daemon"
