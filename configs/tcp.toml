# Example serial to network proxy configuration
[serial]
# This can be overridden with the -d option on the command-line
device = "/dev/ttyS0"
speed = 9600

[phc]
interface = "enp1s0"

# This section gives read-only access on all interfaces on port 2005
[[proxy.tcp]]
listen = ":2005"
readOnly = true
# This section gives read-write access only on the loopback interface on port 2006
[[proxy.tcp]]
listen = "127.0.0.1:2006"
