# Mac mini (M4 Pro), macOS 26, FT232R USB UART with PPS on CTS.
# State queries take about 200 us, timers are exact, and queries slow down
# severalfold after the machine idles, which pollPreWarm counters.

[sim]
duration = 3600

[pulse]
width = 0.1
jitter = 20e-6

[host.query]
duration = 200e-6
jitter = 40e-6

[host.query.idle]
after = 0.02
factor = 4
recover = 0.04

[host.timer]
overshoot = 100e-6
overshootJitter = 100e-6

[poll]
preWarm = 0.05
