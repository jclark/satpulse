#:schema ./config-schema.json
# Example config file for macOS
[serial]
# This can be overridden with the -d option on the command-line
device = "/dev/cu.usbserial-DBE128L5"
speed = 38400
# Uncomment when the receiver's PPS output is connected to CTS on the same
# serial adapter. CTS is the recommended and tested modem-control line.
#pps.line = "cts"

[gps]
# Uncommenting the following line will enable configuration of the GPS
# (changes are not persistent across GPS reboots)
config = true
# This specifies the vendor of your GPS module.
# Setting this restricts which packet formats the scanner recognizes and which
# configuration protocols are probed.
# If not set, all packet formats and configuration protocols are tried.
# The following values are supported:
#   u-blox, Unicore, Allystar, Bynav, NovAtel, Quectel, SinoGNSS, Techtotop, Zhongke, other
# In addition, the following values are allowed and currently treated as equivalent to "other":
#   Furuno, MediaTek, Septentrio, SkyTraq, Trimble
#vendor = "u-blox"

[log]
# Uncomment the following line to enable logging of packets from the GPS receiver (in /var/log/satpulse)
# packet = true

# Uncomment the following two lines to allow HTTP monitoring on port 2000
[[http]]
listen = ":2000"

# Uncomment this to allow a TCP connection to proxy the serial port
[[proxy.tcp]]
listen = ":2006"
#readOnly = true

# Uncomment this to allow a Unix domain socket to proxy the serial port
# This can be used with
#    satpulsetool gps --socket /var/run/satpulse.sock
[[proxy.socket]]
# /var/run needs root
path = "/tmp/satpulse.sock"
