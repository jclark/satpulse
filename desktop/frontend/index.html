<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatPulse GPS</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --ok: #4ade80;
  --err: #f87171;
  --border: #334;
  --radius: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
header h1 {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
}
.conn-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.conn-bar label { font-size: 13px; color: var(--text-dim); }
.conn-bar input, .conn-bar select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: var(--radius);
  font-size: 13px;
}
.conn-bar input[type="text"] { width: 140px; }
.conn-bar select { width: 100px; }
.status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.status-dot.connected { background: var(--ok); }
button {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 5px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--accent); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button:disabled:hover { background: var(--surface2); border-color: var(--border); }
button.primary { background: var(--accent); border-color: var(--accent); }
button.primary:hover { background: #d1344e; }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.tab {
  padding: 8px 20px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.panel {
  display: none;
}
.panel.active { display: block; }

/* Receiver info panel */
.info-grid {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 8px 16px;
  max-width: 600px;
}
.info-grid dt { color: var(--text-dim); font-size: 13px; }
.info-grid dd { font-size: 14px; }
.placeholder { color: var(--text-dim); font-style: italic; }

/* Configuration panel */
.config-section {
  margin-bottom: 24px;
  max-width: 600px;
}
.config-section h3 {
  font-size: 14px;
  margin-bottom: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.config-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.config-row label { font-size: 13px; min-width: 80px; }
.gnss-checkboxes {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.gnss-checkboxes label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
}
.gnss-checkboxes input[type="checkbox"] { accent-color: var(--accent); }

/* Packet monitor */
#packet-log {
  font-family: "SF Mono", "Consolas", "Menlo", monospace;
  font-size: 12px;
  line-height: 1.6;
  background: #111;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  height: calc(100vh - 200px);
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
#packet-log .pkt-time { color: var(--text-dim); }
#packet-log .pkt-tag { color: var(--accent); }
#packet-log .pkt-data { color: var(--ok); }

.monitor-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

/* Status bar */
#status-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 4px 20px;
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.toast {
  position: fixed;
  bottom: 40px;
  right: 20px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 100;
  animation: fadeIn 0.2s;
}
.toast.error { background: var(--err); color: #000; }
.toast.success { background: var(--ok); color: #000; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
</style>
</head>
<body>

<header>
  <h1>SatPulse GPS</h1>
  <div class="conn-bar">
    <div class="status-dot" id="status-dot"></div>
    <label>Device</label>
    <input type="text" id="device" placeholder="/dev/ttyACM0" value="/dev/ttyACM0">
    <label>Speed</label>
    <select id="speed">
      <option value="9600">9600</option>
      <option value="38400">38400</option>
      <option value="57600">57600</option>
      <option value="115200" selected>115200</option>
      <option value="230400">230400</option>
      <option value="460800">460800</option>
      <option value="921600">921600</option>
    </select>
    <button id="btn-connect" class="primary" onclick="toggleConnect()">Connect</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('receiver')">Receiver</div>
  <div class="tab" onclick="showTab('config')">Configure</div>
  <div class="tab" onclick="showTab('monitor')">Packet monitor</div>
</div>

<main>
  <!-- Receiver Info -->
  <div id="panel-receiver" class="panel active">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <h2 style="font-size:16px;">Receiver information</h2>
      <button id="btn-detect" onclick="detectReceiver()" disabled>Detect</button>
    </div>
    <div id="receiver-info">
      <p class="placeholder">Connect to a GPS receiver, then click Detect.</p>
    </div>
  </div>

  <!-- Configuration -->
  <div id="panel-config" class="panel">
    <h2 style="font-size:16px; margin-bottom:16px;">GPS configuration</h2>

    <div class="config-section">
      <h3>GNSS constellations</h3>
      <div class="gnss-checkboxes" id="gnss-checks">
        <label><input type="checkbox" value="GPS" checked> GPS</label>
        <label><input type="checkbox" value="GAL" checked> Galileo</label>
        <label><input type="checkbox" value="BDS"> BeiDou</label>
        <label><input type="checkbox" value="GLO"> GLONASS</label>
        <label><input type="checkbox" value="QZSS"> QZSS</label>
        <label><input type="checkbox" value="NAVIC"> NavIC</label>
        <label><input type="checkbox" value="SBAS"> SBAS</label>
      </div>
      <button style="margin-top:8px;" id="btn-gnss" onclick="applyGNSS()" disabled>Apply</button>
    </div>

    <div class="config-section">
      <h3>PPS output</h3>
      <div class="config-row">
        <label>Pulse width</label>
        <input type="text" id="pps-width" value="0.1" style="width:80px;">
        <span style="font-size:13px; color:var(--text-dim);">seconds (0 to disable)</span>
        <button id="btn-pps" onclick="applyPPS()" disabled>Apply</button>
      </div>
    </div>

    <div class="config-section">
      <h3>Positioning mode</h3>
      <div class="config-row">
        <label><input type="radio" name="mode" value="static" checked> Static</label>
        <label><input type="radio" name="mode" value="mobile"> Mobile</label>
        <button id="btn-mode" onclick="applyMode()" disabled>Apply</button>
      </div>
    </div>
  </div>

  <!-- Packet Monitor -->
  <div id="panel-monitor" class="panel">
    <div class="monitor-controls">
      <button id="btn-capture" onclick="toggleCapture()" disabled>Start capture</button>
      <button onclick="clearLog()">Clear</button>
    </div>
    <div id="packet-log"></div>
  </div>
</main>

<div id="status-bar">Disconnected</div>

<script>
// Wails runtime bindings
// In production, these are auto-generated. For the prototype, we reference them directly.
const backend = window.go ? window.go.main.App : null;

let connected = false;
let capturing = false;

function setStatus(msg) {
  document.getElementById("status-bar").textContent = msg;
}

function toast(msg, type) {
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function updateUI() {
  const dot = document.getElementById("status-dot");
  const btn = document.getElementById("btn-connect");
  dot.className = connected ? "status-dot connected" : "status-dot";
  btn.textContent = connected ? "Disconnect" : "Connect";
  btn.className = connected ? "button" : "button primary";
  document.getElementById("btn-detect").disabled = !connected;
  document.getElementById("btn-gnss").disabled = !connected;
  document.getElementById("btn-pps").disabled = !connected;
  document.getElementById("btn-mode").disabled = !connected;
  document.getElementById("btn-capture").disabled = !connected;
  setStatus(connected ? "Connected" : "Disconnected");
}

async function toggleConnect() {
  if (!backend) { toast("Wails runtime not available", "error"); return; }
  if (connected) {
    await backend.Disconnect();
    connected = false;
    if (capturing) { capturing = false; }
    updateUI();
    return;
  }
  const device = document.getElementById("device").value;
  const speed = parseInt(document.getElementById("speed").value);
  setStatus("Connecting...");
  const r = await backend.Connect(device, speed);
  if (r.ok) {
    connected = true;
    toast("Connected to " + device, "success");
  } else {
    toast(r.error, "error");
  }
  updateUI();
}

async function detectReceiver() {
  if (!backend) return;
  const el = document.getElementById("receiver-info");
  el.innerHTML = '<p class="placeholder">Detecting receiver...</p>';
  setStatus("Probing receiver...");
  const r = await backend.DetectReceiver();
  if (!r.ok) {
    el.innerHTML = '<p class="placeholder">Error: ' + escHtml(r.error) + '</p>';
    setStatus("Detection failed");
    return;
  }
  let html = '<dl class="info-grid">';
  if (r.vendor)   html += row("Vendor", r.vendor);
  if (r.hardware) html += row("Hardware", r.hardware);
  if (r.firmware) html += row("Firmware", r.firmware);
  if (r.supportedGNSS && r.supportedGNSS.length)
    html += row("Supported GNSS", r.supportedGNSS.join(", "));
  if (r.constellations && r.constellations.length)
    html += row("Enabled constellations", r.constellations.join(", "));
  if (r.packetFormats && r.packetFormats.length)
    html += row("Packet formats", r.packetFormats.join(", "));
  if (r.mode)     html += row("Mode", r.mode);
  if (r.timeGNSS) html += row("Time GNSS", r.timeGNSS);
  if (r.ppsEnabled !== undefined && r.ppsEnabled !== null)
    html += row("PPS", r.ppsEnabled ? "Enabled" : "Disabled");
  html += '</dl>';
  el.innerHTML = html;
  setStatus("Receiver detected: " + (r.vendor || "unknown"));
}

function row(label, value) {
  return '<dt>' + escHtml(label) + '</dt><dd>' + escHtml(value) + '</dd>';
}

async function applyGNSS() {
  if (!backend) return;
  const checks = document.querySelectorAll("#gnss-checks input:checked");
  const gnss = Array.from(checks).map(c => c.value).join(",");
  if (!gnss) { toast("Select at least one constellation", "error"); return; }
  setStatus("Configuring GNSS...");
  const r = await backend.ConfigureGNSS(gnss);
  if (r.ok) {
    toast("GNSS configuration applied", "success");
    setStatus("GNSS configured: " + gnss);
  } else {
    toast(r.error, "error");
    setStatus("GNSS configuration failed");
  }
}

async function applyPPS() {
  if (!backend) return;
  const width = parseFloat(document.getElementById("pps-width").value);
  if (isNaN(width) || width < 0 || width >= 1) {
    toast("PPS width must be >= 0 and < 1", "error");
    return;
  }
  setStatus("Configuring PPS...");
  const r = await backend.ConfigurePPS(width);
  if (r.ok) {
    toast(width > 0 ? "PPS enabled" : "PPS disabled", "success");
    setStatus("PPS configured");
  } else {
    toast(r.error, "error");
    setStatus("PPS configuration failed");
  }
}

async function applyMode() {
  if (!backend) return;
  const isStatic = document.querySelector('input[name="mode"]:checked').value === "static";
  setStatus("Configuring mode...");
  const r = await backend.ConfigureMode(isStatic);
  if (r.ok) {
    toast("Mode set to " + (isStatic ? "static" : "mobile"), "success");
    setStatus("Mode configured");
  } else {
    toast(r.error, "error");
    setStatus("Mode configuration failed");
  }
}

async function toggleCapture() {
  if (!backend) return;
  const btn = document.getElementById("btn-capture");
  if (capturing) {
    await backend.StopCapture();
    capturing = false;
    btn.textContent = "Start capture";
    setStatus("Capture stopped");
    return;
  }
  const r = await backend.StartCapture();
  if (r.ok) {
    capturing = true;
    btn.textContent = "Stop capture";
    setStatus("Capturing packets...");
  } else {
    toast(r.error, "error");
  }
}

function clearLog() {
  document.getElementById("packet-log").innerHTML = "";
}

function showTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelector('.tab[onclick*="' + name + '"]').classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// Listen for packet events from the Go backend
if (window.runtime) {
  window.runtime.EventsOn("gps:packet", function(pkt) {
    const log = document.getElementById("packet-log");
    const line = document.createElement("div");
    line.innerHTML =
      '<span class="pkt-time">' + escHtml(pkt.timestamp) + '</span> ' +
      '<span class="pkt-tag">[' + escHtml(pkt.tag) + ']</span> ' +
      '<span class="pkt-data">' + escHtml(pkt.data.trim()) + '</span>';
    log.appendChild(line);
    // Auto-scroll if near bottom
    if (log.scrollHeight - log.scrollTop - log.clientHeight < 100) {
      log.scrollTop = log.scrollHeight;
    }
    // Limit to 1000 lines
    while (log.childElementCount > 1000) {
      log.removeChild(log.firstChild);
    }
  });
}

updateUI();
</script>
</body>
</html>
