<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatPulse GPS</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --text-dim: #999;
  --ok: #4ade80;
  --err: #f87171;
  --warn: #fbbf24;
  --border: #334;
  --radius: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
.conn-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.conn-bar label { font-size: 13px; color: var(--text-dim); }
.conn-bar input, .conn-bar select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: var(--radius);
  font-size: 13px;
}
.conn-bar input[type="text"] { width: 140px; }
.conn-bar select { width: 100px; }
.status-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.status-dot.connected { background: var(--ok); }
button {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 5px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--accent); border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
button:disabled:hover { background: var(--surface2); border-color: var(--border); }
button.primary { background: var(--accent); border-color: var(--accent); }
button.primary:hover { background: #d1344e; }
button.danger { color: var(--err); }
button.danger:hover { background: var(--err); color: #000; }

.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.tab {
  padding: 8px 20px;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }

main {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.panel { display: none; }
.panel.active { display: block; }

/* Receiver info panel */
.info-grid {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 8px 16px;
  max-width: 600px;
}
.info-grid dt { color: var(--text-dim); font-size: 13px; }
.info-grid dd { font-size: 14px; }
.placeholder { color: var(--text-dim); font-style: italic; }

/* Configuration panel */
.config-section {
  margin-bottom: 20px;
  max-width: 700px;
}
.config-section h3 {
  font-size: 13px;
  margin-bottom: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.config-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.config-row label { font-size: 13px; min-width: 120px; color: var(--text-dim); }
.config-row input[type="text"],
.config-row input[type="number"],
.config-row select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 8px;
  border-radius: var(--radius);
  font-size: 13px;
}
.config-row input[type="number"] { width: 100px; }
.config-row input[type="checkbox"] { accent-color: var(--accent); }
.config-row .value { font-size: 13px; }

.current-config {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 20px;
  max-width: 700px;
}
.current-config h3 { margin-bottom: 10px; }
.current-config .info-grid { max-width: none; }

.signal-summary {
  font-size: 13px;
  line-height: 1.6;
}
.signal-summary .gnss-group { margin-right: 12px; }
.signal-summary .gnss-name { color: var(--accent); font-weight: 600; }

.actions-bar {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  max-width: 700px;
  flex-wrap: wrap;
}

/* Activity log */
.activity-log {
  max-width: 700px;
  margin-top: 20px;
}
.activity-log h3 {
  font-size: 13px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
#activity-log {
  font-family: "SF Mono", "Consolas", "Menlo", monospace;
  font-size: 12px;
  line-height: 1.5;
  background: #111;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  height: 150px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
#activity-log .log-info { color: var(--ok); }
#activity-log .log-warn { color: var(--warn); }
#activity-log .log-error { color: var(--err); }
#activity-log .log-time { color: var(--text-dim); }

/* Packet monitor */
#packet-log {
  font-family: "SF Mono", "Consolas", "Menlo", monospace;
  font-size: 12px;
  line-height: 1.6;
  background: #111;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  height: calc(100vh - 200px);
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}
#packet-log .pkt-time { color: var(--text-dim); }
#packet-log .pkt-tag { color: var(--accent); }
#packet-log .pkt-data { color: var(--ok); }

.monitor-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

/* Signal picker dialog */
.dialog-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.dialog-overlay.open { display: flex; }
.dialog {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 700px;
  max-width: 90vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
}
.dialog-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.dialog-header h2 { font-size: 15px; }
.dialog-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}
.dialog-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.gnss-section {
  margin-bottom: 16px;
}
.gnss-section h4 {
  font-size: 14px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.gnss-section h4 label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.gnss-section h4 input[type="checkbox"] { accent-color: var(--accent); }
.signal-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-left: 24px;
}
.signal-grid label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  cursor: pointer;
  padding: 2px 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.signal-grid label:has(input:checked) {
  border-color: var(--accent);
  background: rgba(233, 69, 96, 0.15);
}
.signal-grid input[type="checkbox"] { accent-color: var(--accent); }

/* Status bar */
#status-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 4px 20px;
  font-size: 12px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.toast {
  position: fixed;
  bottom: 40px;
  right: 20px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 300;
  animation: fadeIn 0.2s;
}
.toast.error { background: var(--err); color: #000; }
.toast.success { background: var(--ok); color: #000; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
</style>
</head>
<body>

<header>
  <h1>SatPulse GPS</h1>
  <div class="conn-bar">
    <div class="status-dot" id="status-dot"></div>
    <label>Device</label>
    <input type="text" id="device" placeholder="/dev/ttyACM0" value="/dev/ttyACM0">
    <label>Speed</label>
    <select id="speed">
      <option value="9600">9600</option>
      <option value="38400">38400</option>
      <option value="57600">57600</option>
      <option value="115200" selected>115200</option>
      <option value="230400">230400</option>
      <option value="460800">460800</option>
      <option value="921600">921600</option>
    </select>
    <button id="btn-connect" class="primary" onclick="toggleConnect()">Connect</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab('receiver')">Receiver</div>
  <div class="tab" onclick="showTab('config')">Configure</div>
  <div class="tab" onclick="showTab('monitor')">Packet monitor</div>
</div>

<main>
  <!-- Receiver Info -->
  <div id="panel-receiver" class="panel active">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <h2 style="font-size:16px;">Receiver information</h2>
      <button id="btn-detect" onclick="detectReceiver()" disabled>Detect</button>
    </div>
    <div id="receiver-info">
      <p class="placeholder">Connect to a GPS receiver, then click Detect.</p>
    </div>
    <div class="activity-log" id="receiver-log-section" style="display:none;">
      <h3>Activity</h3>
      <div id="activity-log"></div>
    </div>
  </div>

  <!-- Configuration -->
  <div id="panel-config" class="panel">
    <h2 style="font-size:16px; margin-bottom:16px;">GPS configuration</h2>

    <div class="current-config" id="current-config" style="display:none;">
      <h3 style="font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;">Current configuration</h3>
      <div id="current-config-body"></div>
    </div>

    <div class="config-section">
      <h3>Signals</h3>
      <div class="config-row">
        <label>Enabled signals</label>
        <span class="signal-summary" id="signal-summary">Not configured</span>
        <button id="btn-signals" onclick="openSignalPicker()" disabled>Edit signals...</button>
      </div>
    </div>

    <div class="config-section">
      <h3>Positioning mode</h3>
      <div class="config-row">
        <label>Mode</label>
        <select id="cfg-mode" style="width:120px;">
          <option value="">--</option>
          <option value="static">Static</option>
          <option value="mobile">Mobile</option>
        </select>
      </div>
    </div>

    <div class="config-section">
      <h3>Time pulse (PPS)</h3>
      <div class="config-row">
        <label>Pulse width (s)</label>
        <input type="number" id="cfg-pps-width" value="" step="0.01" min="0" max="1" placeholder="e.g. 0.1">
      </div>
      <div class="config-row">
        <label>Period (s)</label>
        <input type="number" id="cfg-pps-period" value="" step="0.1" min="0" placeholder="e.g. 1.0">
      </div>
      <div class="config-row">
        <label>Align to GNSS</label>
        <input type="checkbox" id="cfg-pps-align" checked>
      </div>
      <div class="config-row">
        <label>Only when locked</label>
        <input type="checkbox" id="cfg-pps-locked" checked>
      </div>
      <div class="config-row">
        <label>Rising edge</label>
        <input type="checkbox" id="cfg-pps-rising" checked>
      </div>
    </div>

    <div class="config-section">
      <h3>Other</h3>
      <div class="config-row">
        <label>Time GNSS</label>
        <select id="cfg-time-gnss" style="width:120px;">
          <option value="">--</option>
          <option value="GPS">GPS</option>
          <option value="GAL">Galileo</option>
          <option value="BDS">BeiDou</option>
          <option value="GLO">GLONASS</option>
        </select>
      </div>
      <div class="config-row">
        <label>Cable delay (ns)</label>
        <input type="number" id="cfg-cable-delay" value="" step="1" placeholder="e.g. 50">
      </div>
      <div class="config-row">
        <label>Min elevation (deg)</label>
        <input type="number" id="cfg-min-elev" value="" step="1" min="0" max="90" placeholder="e.g. 10">
      </div>
    </div>

    <div class="actions-bar">
      <button class="primary" id="btn-apply" onclick="applyConfig()" disabled>Apply configuration</button>
      <button id="btn-save" onclick="saveConfig()" disabled>Save to NVM</button>
      <button id="btn-reset-reload" onclick="resetConfig('reload')" disabled>Reload</button>
      <button class="danger" id="btn-reset-cold" onclick="resetConfig('cold')" disabled>Cold restart</button>
      <button class="danger" id="btn-reset-factory" onclick="resetConfig('factory')" disabled>Factory reset</button>
    </div>

    <div class="activity-log" style="margin-top:20px;">
      <h3>Activity</h3>
      <div id="config-activity-log" style="height:120px;font-family:'SF Mono','Consolas','Menlo',monospace;font-size:12px;line-height:1.5;background:#111;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;"></div>
    </div>
  </div>

  <!-- Packet Monitor -->
  <div id="panel-monitor" class="panel">
    <div class="monitor-controls">
      <button id="btn-capture" onclick="toggleCapture()" disabled>Start capture</button>
      <button onclick="clearLog()">Clear</button>
    </div>
    <div id="packet-log"></div>
  </div>
</main>

<div id="status-bar">Disconnected</div>

<!-- Signal Picker Dialog -->
<div class="dialog-overlay" id="signal-dialog">
  <div class="dialog">
    <div class="dialog-header">
      <h2>Select GNSS signals</h2>
      <button onclick="closeSignalPicker()" style="background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;">&#x2715;</button>
    </div>
    <div class="dialog-body" id="signal-dialog-body">
    </div>
    <div class="dialog-footer">
      <button onclick="closeSignalPicker()">Cancel</button>
      <button class="primary" onclick="confirmSignalPicker()">OK</button>
    </div>
  </div>
</div>

<script>
const backend = window.go ? window.go.main.App : null;

let connected = false;
let capturing = false;
let signalCatalog = []; // populated from GetAllSignals
let selectedSignalIndices = new Set(); // current signal selection
let detectedConfig = null; // last detected config from receiver

function setStatus(msg) {
  document.getElementById("status-bar").textContent = msg;
}

function toast(msg, type) {
  var t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function updateUI() {
  var dot = document.getElementById("status-dot");
  var btn = document.getElementById("btn-connect");
  dot.className = connected ? "status-dot connected" : "status-dot";
  btn.textContent = connected ? "Disconnect" : "Connect";
  btn.className = connected ? "button" : "button primary";
  document.getElementById("btn-detect").disabled = !connected;
  document.getElementById("btn-signals").disabled = !connected;
  document.getElementById("btn-apply").disabled = !connected;
  document.getElementById("btn-save").disabled = !connected;
  document.getElementById("btn-reset-reload").disabled = !connected;
  document.getElementById("btn-reset-cold").disabled = !connected;
  document.getElementById("btn-reset-factory").disabled = !connected;
  document.getElementById("btn-capture").disabled = !connected;
  setStatus(connected ? "Connected" : "Disconnected");
}

async function toggleConnect() {
  if (!backend) { toast("Wails runtime not available", "error"); return; }
  if (connected) {
    await backend.Disconnect();
    connected = false;
    if (capturing) { capturing = false; }
    updateUI();
    return;
  }
  var device = document.getElementById("device").value;
  var speed = parseInt(document.getElementById("speed").value);
  setStatus("Connecting...");
  var r = await backend.Connect(device, speed);
  if (r.ok) {
    connected = true;
    toast("Connected to " + device, "success");
    loadSignalCatalog();
  } else {
    toast(r.error, "error");
  }
  updateUI();
}

async function loadSignalCatalog() {
  if (!backend) return;
  signalCatalog = await backend.GetAllSignals();
}

// --- Receiver detection ---

async function detectReceiver() {
  if (!backend) return;
  var el = document.getElementById("receiver-info");
  el.innerHTML = '<p class="placeholder">Detecting receiver...</p>';
  document.getElementById("receiver-log-section").style.display = "block";
  clearActivityLog();
  setStatus("Probing receiver...");
  var r = await backend.DetectReceiver();
  if (!r.ok) {
    el.innerHTML = '<p class="placeholder">Error: ' + esc(r.error) + '</p>';
    setStatus("Detection failed");
    return;
  }
  var html = '<dl class="info-grid">';
  if (r.vendor) html += row("Vendor", r.vendor);
  if (r.hardware) html += row("Hardware", r.hardware);
  if (r.firmware) html += row("Firmware", r.firmware);
  if (r.supportedGNSS && r.supportedGNSS.length)
    html += row("Supported GNSS", r.supportedGNSS.join(", "));
  if (r.packetFormats && r.packetFormats.length)
    html += row("Packet formats", r.packetFormats.join(", "));
  if (r.signals && r.signals.length) {
    html += row("Enabled signals", formatSignalGroups(r.signals));
  }
  if (r.config) {
    var cfg = r.config;
    if (cfg.mode) html += row("Mode", cfg.mode);
    if (cfg.timeGNSS) html += row("Time GNSS", cfg.timeGNSS);
    if (cfg.ppsEnabled !== undefined) html += row("PPS", cfg.ppsEnabled ? "Enabled" : "Disabled");
    if (cfg.timePulse) {
      var tp = cfg.timePulse;
      if (tp.width !== undefined) html += row("PPS width", tp.width + " s");
      if (tp.period !== undefined) html += row("PPS period", tp.period + " s");
    }
    if (cfg.antennaCableDelay !== undefined) html += row("Cable delay", cfg.antennaCableDelay + " ns");
    if (cfg.minElevation !== undefined) html += row("Min elevation", cfg.minElevation + " deg");
    if (cfg.navMsgAuth) html += row("Nav msg auth", cfg.navMsgAuth);
  }
  html += '</dl>';
  el.innerHTML = html;
  setStatus("Receiver detected: " + (r.vendor || "unknown"));

  // Populate the Configure tab with detected values
  detectedConfig = r;
  populateConfigFromDetected(r);
}

function populateConfigFromDetected(r) {
  // Signal indices
  if (r.signalIndices && r.signalIndices.length) {
    selectedSignalIndices = new Set(r.signalIndices);
  }
  updateSignalSummary();

  // Show current config panel
  var cfgPanel = document.getElementById("current-config");
  if (r.config && Object.keys(r.config).length > 0) {
    cfgPanel.style.display = "block";
    var html = '<dl class="info-grid">';
    var cfg = r.config;
    if (cfg.signalsEnabled) html += row("Signals", cfg.signalsEnabled);
    if (cfg.mode) html += row("Mode", cfg.mode);
    if (cfg.timeGNSS) html += row("Time GNSS", cfg.timeGNSS);
    if (cfg.ppsEnabled !== undefined) html += row("PPS", cfg.ppsEnabled ? "Enabled" : "Disabled");
    if (cfg.timePulse) {
      var tp = cfg.timePulse;
      if (tp.width !== undefined) html += row("PPS width", tp.width + " s");
      if (tp.period !== undefined) html += row("PPS period", tp.period + " s");
    }
    if (cfg.antennaCableDelay !== undefined) html += row("Cable delay", cfg.antennaCableDelay + " ns");
    if (cfg.minElevation !== undefined) html += row("Min elevation", cfg.minElevation + " deg");
    if (cfg.navMsgAuth) html += row("Nav msg auth", cfg.navMsgAuth);
    html += '</dl>';
    document.getElementById("current-config-body").innerHTML = html;
  }

  // Pre-fill form fields
  var cfg = r.config || {};
  if (cfg.mode) document.getElementById("cfg-mode").value = cfg.mode;
  if (cfg.timePulse) {
    var tp = cfg.timePulse;
    if (tp.width !== undefined) document.getElementById("cfg-pps-width").value = tp.width;
    if (tp.period !== undefined) document.getElementById("cfg-pps-period").value = tp.period;
    if (tp.alignToGNSS !== undefined) document.getElementById("cfg-pps-align").checked = tp.alignToGNSS;
    if (tp.onlyWhenLocked !== undefined) document.getElementById("cfg-pps-locked").checked = tp.onlyWhenLocked;
    if (tp.polarityRising !== undefined) document.getElementById("cfg-pps-rising").checked = tp.polarityRising;
  }
  if (cfg.timeGNSS) document.getElementById("cfg-time-gnss").value = cfg.timeGNSS;
  if (cfg.antennaCableDelay !== undefined) document.getElementById("cfg-cable-delay").value = cfg.antennaCableDelay;
  if (cfg.minElevation !== undefined) document.getElementById("cfg-min-elev").value = cfg.minElevation;
}

// --- Signal picker ---

function openSignalPicker() {
  var body = document.getElementById("signal-dialog-body");
  var html = "";
  for (var i = 0; i < signalCatalog.length; i++) {
    var gnss = signalCatalog[i];
    var allSelected = gnss.signals.every(function(s) { return selectedSignalIndices.has(s.index); });
    var someSelected = gnss.signals.some(function(s) { return selectedSignalIndices.has(s.index); });
    html += '<div class="gnss-section">';
    html += '<h4><label><input type="checkbox" data-gnss="' + i + '" onchange="toggleGNSS(this)" ' +
      (allSelected ? 'checked' : '') + (someSelected && !allSelected ? ' class="indeterminate"' : '') +
      '> ' + esc(gnss.name) + '</label></h4>';
    html += '<div class="signal-grid">';
    for (var j = 0; j < gnss.signals.length; j++) {
      var sig = gnss.signals[j];
      var checked = selectedSignalIndices.has(sig.index);
      html += '<label><input type="checkbox" data-sigidx="' + sig.index + '" data-gnss="' + i + '" ' +
        (checked ? 'checked' : '') + ' onchange="signalCheckChanged(this)"> ' + esc(sig.name) + '</label>';
    }
    html += '</div></div>';
  }
  body.innerHTML = html;
  // Set indeterminate states
  var gnssChecks = body.querySelectorAll('input[data-gnss]:not([data-sigidx])');
  for (var k = 0; k < gnssChecks.length; k++) {
    var idx = parseInt(gnssChecks[k].dataset.gnss);
    var gnss = signalCatalog[idx];
    var all = gnss.signals.every(function(s) { return selectedSignalIndices.has(s.index); });
    var some = gnss.signals.some(function(s) { return selectedSignalIndices.has(s.index); });
    gnssChecks[k].indeterminate = some && !all;
  }
  document.getElementById("signal-dialog").classList.add("open");
}

function closeSignalPicker() {
  document.getElementById("signal-dialog").classList.remove("open");
}

function toggleGNSS(cb) {
  var idx = parseInt(cb.dataset.gnss);
  var gnss = signalCatalog[idx];
  for (var i = 0; i < gnss.signals.length; i++) {
    var sigCb = document.querySelector('input[data-sigidx="' + gnss.signals[i].index + '"]');
    if (sigCb) sigCb.checked = cb.checked;
  }
}

function signalCheckChanged(cb) {
  var gnssIdx = parseInt(cb.dataset.gnss);
  var gnss = signalCatalog[gnssIdx];
  var gnssCb = document.querySelector('#signal-dialog-body input[data-gnss="' + gnssIdx + '"]:not([data-sigidx])');
  if (!gnssCb) return;
  var all = true, some = false;
  for (var i = 0; i < gnss.signals.length; i++) {
    var sigCb = document.querySelector('input[data-sigidx="' + gnss.signals[i].index + '"]');
    if (sigCb && sigCb.checked) some = true;
    else all = false;
  }
  gnssCb.checked = all;
  gnssCb.indeterminate = some && !all;
}

function confirmSignalPicker() {
  selectedSignalIndices = new Set();
  var checks = document.querySelectorAll('#signal-dialog-body input[data-sigidx]:checked');
  for (var i = 0; i < checks.length; i++) {
    selectedSignalIndices.add(parseInt(checks[i].dataset.sigidx));
  }
  updateSignalSummary();
  closeSignalPicker();
}

function updateSignalSummary() {
  var el = document.getElementById("signal-summary");
  if (selectedSignalIndices.size === 0) {
    el.innerHTML = "None selected";
    return;
  }
  // Group by GNSS using the catalog
  var parts = [];
  for (var i = 0; i < signalCatalog.length; i++) {
    var gnss = signalCatalog[i];
    var names = [];
    for (var j = 0; j < gnss.signals.length; j++) {
      if (selectedSignalIndices.has(gnss.signals[j].index)) {
        names.push(gnss.signals[j].name);
      }
    }
    if (names.length > 0) {
      parts.push('<span class="gnss-group"><span class="gnss-name">' + esc(gnss.name) + '</span>[' + names.map(esc).join(", ") + ']</span>');
    }
  }
  el.innerHTML = parts.join(" ");
}

// --- Apply config ---

async function applyConfig() {
  if (!backend) return;
  var cfg = {};

  // Signals
  if (selectedSignalIndices.size > 0) {
    cfg.setSignals = true;
    cfg.signalIndices = Array.from(selectedSignalIndices);
  }

  // Mode
  var mode = document.getElementById("cfg-mode").value;
  if (mode) {
    cfg.setMode = true;
    cfg.mode = mode;
  }

  // PPS
  var ppsW = document.getElementById("cfg-pps-width").value;
  var ppsP = document.getElementById("cfg-pps-period").value;
  if (ppsW !== "" || ppsP !== "") {
    cfg.setPPS = true;
    cfg.ppsWidth = parseFloat(ppsW) || 0;
    cfg.ppsPeriod = parseFloat(ppsP) || 0;
    cfg.ppsAlignToGNSS = document.getElementById("cfg-pps-align").checked;
    cfg.ppsOnlyLocked = document.getElementById("cfg-pps-locked").checked;
    cfg.ppsRising = document.getElementById("cfg-pps-rising").checked;
  }

  // Time GNSS
  var tg = document.getElementById("cfg-time-gnss").value;
  if (tg) {
    cfg.setTimeGNSS = true;
    cfg.timeGNSS = tg;
  }

  // Cable delay
  var cd = document.getElementById("cfg-cable-delay").value;
  if (cd !== "") {
    cfg.setCableDelay = true;
    cfg.cableDelay = parseFloat(cd) || 0;
  }

  // Min elevation
  var me = document.getElementById("cfg-min-elev").value;
  if (me !== "") {
    cfg.setMinElevation = true;
    cfg.minElevation = parseFloat(me) || 0;
  }

  clearConfigLog();
  setStatus("Applying configuration...");
  var r = await backend.ApplyConfig(cfg);
  if (r.ok) {
    toast("Configuration applied", "success");
    setStatus("Configuration applied");
  } else {
    toast(r.error, "error");
    setStatus("Configuration failed");
  }
}

async function saveConfig() {
  if (!backend) return;
  clearConfigLog();
  setStatus("Saving to NVM...");
  var r = await backend.SaveConfig();
  if (r.ok) {
    toast("Configuration saved to NVM", "success");
    setStatus("Saved to NVM");
  } else {
    toast(r.error, "error");
    setStatus("Save failed");
  }
}

async function resetConfig(type) {
  if (!backend) return;
  clearConfigLog();
  setStatus("Resetting receiver (" + type + ")...");
  var r = await backend.ResetConfig(type);
  if (r.ok) {
    toast("Receiver reset: " + type, "success");
    setStatus("Reset complete: " + type);
  } else {
    toast(r.error, "error");
    setStatus("Reset failed");
  }
}

// --- Packet monitor ---

async function toggleCapture() {
  if (!backend) return;
  var btn = document.getElementById("btn-capture");
  if (capturing) {
    await backend.StopCapture();
    capturing = false;
    btn.textContent = "Start capture";
    setStatus("Capture stopped");
    return;
  }
  var r = await backend.StartCapture();
  if (r.ok) {
    capturing = true;
    btn.textContent = "Stop capture";
    setStatus("Capturing packets...");
  } else {
    toast(r.error, "error");
  }
}

function clearLog() {
  document.getElementById("packet-log").innerHTML = "";
}

// --- Activity log ---

function appendLogEntry(logEl, evt) {
  var line = document.createElement("div");
  var cls = "log-info";
  if (evt.level === "WARN") cls = "log-warn";
  else if (evt.level === "ERROR") cls = "log-error";
  line.innerHTML = '<span class="log-time">' + esc(evt.time) + '</span> <span class="' + cls + '">' + esc(evt.message) + '</span>';
  logEl.appendChild(line);
  if (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60) {
    logEl.scrollTop = logEl.scrollHeight;
  }
}

function clearActivityLog() {
  document.getElementById("activity-log").innerHTML = "";
}

function clearConfigLog() {
  document.getElementById("config-activity-log").innerHTML = "";
}

// --- Tab handling ---

function showTab(name) {
  document.querySelectorAll(".tab").forEach(function(t) { t.classList.remove("active"); });
  document.querySelectorAll(".panel").forEach(function(p) { p.classList.remove("active"); });
  document.querySelector('.tab[onclick*="' + name + '"]').classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

// --- Utilities ---

function row(label, value) {
  return '<dt>' + esc(label) + '</dt><dd>' + esc(String(value)) + '</dd>';
}

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function formatSignalGroups(groups) {
  var parts = [];
  for (var i = 0; i < groups.length; i++) {
    var g = groups[i];
    parts.push(g[0] + "[" + g.slice(1).join(", ") + "]");
  }
  return parts.join(", ");
}

// --- Wails event listeners ---

if (window.runtime) {
  window.runtime.EventsOn("gps:packet", function(pkt) {
    var log = document.getElementById("packet-log");
    var line = document.createElement("div");
    line.innerHTML =
      '<span class="pkt-time">' + esc(pkt.timestamp) + '</span> ' +
      '<span class="pkt-tag">[' + esc(pkt.tag) + ']</span> ' +
      '<span class="pkt-data">' + esc(pkt.data.trim()) + '</span>';
    log.appendChild(line);
    if (log.scrollHeight - log.scrollTop - log.clientHeight < 100) {
      log.scrollTop = log.scrollHeight;
    }
    while (log.childElementCount > 1000) {
      log.removeChild(log.firstChild);
    }
  });

  window.runtime.EventsOn("gps:log", function(evt) {
    // Dispatch to the visible activity log panel
    var actLog = document.getElementById("activity-log");
    var cfgLog = document.getElementById("config-activity-log");
    if (actLog) appendLogEntry(actLog, evt);
    if (cfgLog) appendLogEntry(cfgLog, evt);
  });
}

updateUI();
</script>
