RATE:
  MEAS:
    key: 0x30210001
    type: U2
    scale: 0.001
    unit: s
    description: Nominal time between GNSS measurements
    note: E.g. 100 ms results in 10 Hz measurement rate, 1000 ms = 1 Hz measurement rate.
    min: 25
  NAV:
    key: 0x30210002
    type: U2
    description: Ratio of number of measurements to number of navigation solutions
    note: E.g. 5 means ﬁve measurements for every navigation solution.
    min: 1
    max: 127
  TIMEREF:
    key: 0x20210003
    type: E1
    description: Time system to which measurements are aligned
    constants:
      UTC:
        value: 0
        description: Align measurements to UTC time
      GPS:
        value: 1
        description: Align measurements to GPS time
      GLO:
        value: 2
        description: Align measurements to GLONASS time
      BDS:
        value: 3
        description: Align measurements to BeiDou time
      GAL:
        value: 4
        description: Align measurements to Galileo time
HW:
  ANT_CFG_VOLTCTRL:
    key: 0x10a3002e
    type: L
    description: Active antenna voltage control ﬂag
    note: Enable active antenna voltage control ﬂag. Used by EXT and MADC engines.
  ANT_CFG_SHORTDET:
    key: 0x10a3002f
    type: L
    description: Short antenna detection ﬂag
    note: Enable short antenna detection ﬂag. Used by EXT and MADC engines.
  ANT_CFG_SHORTDET_POL:
    key: 0x10a30030
    type: L
    description: Short antenna detection polarity
    note: Set to true if polarity of the antenna short detection is active low. Used by EXT engine.
  ANT_CFG_OPENDET:
    key: 0x10a30031
    type: L
    description: Open antenna detection ﬂag
    note: Enable open antenna detection ﬂag. Used by EXT and MADC engines.
  ANT_CFG_OPENDET_POL:
    key: 0x10a30032
    type: L
    description: Open antenna detection polarity
    note: Set to true if polarity of the antenna open detection is active low. Used by EXT engine.
  ANT_CFG_PWRDOWN:
    key: 0x10a30033
    type: L
    description: Power down antenna ﬂag
    note: >
      Enable power down antenna logic in the event of antenna short circuit. CFG-HW-ANT_CFG_SHORTDET must be enabled
      to use this feature. Used by EXT and MADC engines.
  ANT_CFG_PWRDOWN_POL:
    key: 0x10a30034
    type: L
    description: Power down antenna logic polarity
    note: Set to true if polarity of the antenna power down logic is active high. Used by EXT and MADC engines.
  ANT_CFG_RECOVER:
    key: 0x10a30035
    type: L
    description: Automatic recovery from short state ﬂag
    note: Enable automatic recovery from short state. Used by EXT and MADC engines.
  ANT_SUP_SWITCH_PIN:
    key: 0x20a30036
    type: U1
    description: ANT1 PIO number
    note: Antenna Switch (ANT1) PIO number. Used by EXT and MADC engines.
  ANT_SUP_SHORT_PIN:
    key: 0x20a30037
    type: U1
    description: ANT0 PIO number
    note: Antenna Short (ANT0) PIO number. Used by EXT engine.
  ANT_SUP_OPEN_PIN:
    key: 0x20a30038
    type: U1
    description: ANT2 PIO number
    note: Antenna Switch (ANT2) PIO number. Used by EXT engine.
  ANT_SUP_ENGINE:
    key: 0x20a30054
    type: E1
    description: Antenna supervisor engine selection
    note: >
      Select the engine used to evaluate antenna state.
      The EXT engine uses an external comparator for current measurement. The MADC engine uses built-in measurement
      ADC and requires only a shunt resistor for current measurement. The MADC engine is available in u-blox generation 9
      receivers.
    constants:
      EXT: 
        value: 0
        description: Use the EXT engine.
      MADC: 
        value: 1
        description: Use the MADC engine.
  ANT_SUP_SHORT_THR:
    key: 0x20a30055
    type: U1
    unit: mV
    description: Antenna supervisor MADC engine short detection threshold
    note: >
      Threshold above which antenna short is detected. Used by MADC engine.
  ANT_SUP_OPEN_THR:
    key: 0x20a30056
    type: U1
    unit: mV
    description: Antenna supervisor MADC engine open detection threshold
    note: Threshold below which antenna open/disconnected is detected. Used by MADC engine.
  RF_LNA_MODE:
    key: 0x20a30057
    type: E1
    description: Mode for internal LNA
    note: >
      Sets the operating mode for the RF LNA (all RFs). Lowgain or bypass options can be used if there is already a external
      LNA in front of the chip with suﬃcient gain.
    constants:
      NORMAL:
        value: 0
        description: Normal operation, internal LNA enabled at full gain
      LOWGAIN:
        value: 1
        description: LNA enabled in low gain mode
      BYPASS:
        value: 2
        description: Bypass LNA
NAVSPG:
  FIXMODE:
    key: 0x20110011
    type: E1
    description: Position ﬁx mode
    constants:
      2DONLY:
        value: 1
        description: 2D only
      3DONLY:
        value: 2
        description: 3D only
      AUTO:
        value: 3
        description: Auto 2D/3D
  INIFIX3D:
    key: 0x10110013
    type: L
    description: Initial ﬁx must be a 3D ﬁx
  WKNROLLOVER:
    key: 0x30110017
    type: U2
    description: GPS week rollover number
    note: GPS week numbers will be set correctly from this week up to 1024 weeks after this week.
    min: 1
    max: 4096
  UTCSTANDARD:
    key: 0x2011001c
    type: E1
    description: UTC standard to be used
    notes: See section GNSS time base in the integration manual.
    constants:
      AUTO:
        value: 0
        description: Automatic; receiver selects based on GNSS conﬁguration
      USNO:
        value: 3
        description: UTC as operated by the U.S. Naval Observatory (USNO); derived from GPS time
      EU:
        value: 5
        description: UTC as combined from multiple European laboratories; derived from Galileo time
      SU:
        value: 6
        description: UTC as operated by the former Soviet Union (SU); derived from GLONASS time
      NTSC:
        value: 7
        description: UTC as operated by the National Time Service Center (NTSC), China; derived from BeiDou time
      NPLI:
        value: 8
        description: UTC as operated by the National Physics Laboratory, India (NPLI); derived from NavIC time
      NICT:
        value: 9
        description: UTC as operated by the National Institute of Information and Communications Technology, Japan (NICT); derived from QZSS time
  DYNMODEL:
    key: 0x20110021
    type: E1
    description: Dynamic platform model
    constants:
      PORT:
        value: 0
        description: Portable
      STAT:
        value: 2
        description: Stationary
      PED:
        value: 3
        description: Pedestrian
      AUTOMOT:
        value: 4
        description: Automotive
      SEA:
        value: 5
        description: Sea
      AIR1:
        value: 6
        description: Airborne with <1g acceleration
      AIR2:
        value: 7
        description: Airborne with <2g acceleration
      AIR4:
        value: 8
        description: Airborne with <4g acceleration
      WRIST:
        value: 9
        description: Wrist-worn watch (not available in all products)
      BIKE:
        value: 10
        description: Motorbike (not available in all products)
      MOWER:
        value: 11
        description: Robotic lawn mower (not available in all products)
      ESCOOTER:
        value: 12
        description: E-scooter (not available in all products)
  ACKAIDING:
    key: 0x10110025
    type: L
    description: Acknowledge assistance input messages
  USE_USRDAT:
    key: 0x10110061
    type: L
    description: Use user geodetic datum parameters
    note: This must be set together with all CFG-NAVSPG-USERDAT_* parameters.
  USRDAT_MAJA:
    key: 0x50110062
    type: R8
    unit: m
    description: Geodetic datum semi-major axis
    min: 6300000.0
    max: 6500000.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_FLAT:
    key: 0x50110063
    type: R8
    description: Geodetic datum 1.0 / ﬂattening
    min: 0.0
    max: 500.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_DX:
    key: 0x40110064
    type: R4
    unit: m
    description: Geodetic datum X axis shift at the origin
    min: -5000.0
    max: 5000.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_DY:
    key: 0x40110065
    type: R4
    unit: m
    description: Geodetic datum Y axis shift at the origin
    min: -5000.0
    max: 5000.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_DZ:
    key: 0x40110066
    type: R4
    unit: m
    description: Geodetic datum Z axis shift at the origin
    min: -5000.0
    max: 5000.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_ROTX:
    key: 0x40110067
    type: R4
    unit: arcsec
    description: Geodetic datum rotation about the X axis
    min: -0.02
    max: 0.02
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_ROTY:
    key: 0x40110068
    type: R4
    unit: arcsec
    description: Geodetic datum rotation about the Y axis
    min: -0.02
    max: 0.02
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_* parameters.
  USRDAT_ROTZ:
    key: 0x40110069
    type: R4
    unit: arcsec
    description: Geodetic datum rotation about the Z axis
    min: -0.02
    max: 0.02
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
  USRDAT_SCALE:
    key: 0x4011006a
    type: R4
    unit: ppm
    description: Geodetic datum scale factor
    min: 0.0
    max: 50.0
    note: >
      This will only be used if CFG-NAVSPG-USE_USERDAT is set. It must be set together with all other CFG-NAVSPG-
      USERDAT_... parameters.
