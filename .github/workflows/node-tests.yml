# This workflow runs the webui typecheck and vitest suites.

name: Node tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: webui/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix webui

    - name: Typecheck
      run: npm run typecheck --prefix webui

    - name: Test
      run: npm test --prefix webui

    # The browser suite runs the real binaries against real frontends, so it
    # needs a Go toolchain and a full build.
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Build
      run: make

    - name: Playwright version
      id: playwright
      run: |
        version=$(node -p "require('./webui/package-lock.json').packages['node_modules/@playwright/test'].version")
        test "$version" != "undefined"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # The browser and the system libraries it needs come from Playwright's own
    # image, whose tag must match the @playwright/test the suite runs. Pulling
    # it in its own step keeps a slow registry off the suite's timing, and
    # bounds it: apt from the runner's Ubuntu mirror used to hang for the whole
    # 20-minute job budget.
    - name: Pull the Playwright image
      timeout-minutes: 10
      run: docker pull mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble

    # Only the browser comes from the image; the daemons under test are the
    # binaries just built on the runner. Mounting the workspace at its own path
    # and running as the runner user leaves absolute paths and file ownership
    # as they are outside the container, so the report and rundirs stay
    # readable by the upload step. --ipc=host keeps chromium off the
    # container's small /dev/shm.
    - name: Run e2e suite
      env:
        SATPULSE_E2E_RUNDIR_PARENT: ${{ github.workspace }}/e2e-run-dirs
      run: |
        docker run --rm --ipc=host \
          --user "$(id -u):$(id -g)" \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$GITHUB_WORKSPACE" \
          --env CI --env HOME=/tmp --env SATPULSE_E2E_RUNDIR_PARENT \
          mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble \
          npm run e2e --prefix webui --workspace @satpulse/e2e

    - name: Upload e2e artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: |
          webui/packages/e2e/test-results/
          webui/packages/e2e/playwright-report/
          e2e-run-dirs/
        if-no-files-found: ignore
        retention-days: 7
