# This workflow runs the webui typecheck and vitest suites.

name: Node tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: webui/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix webui

    - name: Typecheck
      run: npm run typecheck --prefix webui

    - name: Test
      run: npm test --prefix webui

    # The browser suite runs the real binaries against real frontends, so it
    # needs a Go toolchain, a full build, and a Playwright browser.
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Build
      run: make

    - name: Playwright version
      id: playwright
      run: |
        version=$(node -p "require('./webui/package-lock.json').packages['node_modules/@playwright/test'].version")
        test "$version" != "undefined"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # The browser cache holds no apt packages, so install the system libraries
    # every run; only the browser download is skipped on a cache hit.
    - name: Install Playwright browser
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx --prefix webui playwright install-deps chromium
        else
          npx --prefix webui playwright install --with-deps chromium
        fi

    - name: Run e2e suite
      env:
        SATPULSE_E2E_RUNDIR_PARENT: ${{ github.workspace }}/e2e-run-dirs
      run: npm run e2e --prefix webui --workspace @satpulse/e2e

    - name: Upload e2e artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: |
          webui/packages/e2e/test-results/
          webui/packages/e2e/playwright-report/
          e2e-run-dirs/
        if-no-files-found: ignore
        retention-days: 7
