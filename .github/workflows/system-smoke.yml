# This workflow tests the installed Debian package through the stock systemd unit.

name: System Smoke

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:

  system-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Build deb package
      # Build every arch so the packaging path is exercised on all of them
      # (amd64, arm64, armhf); only the amd64 package is installed and run below.
      run: |
        make clean
        make deb

    - name: Install deb package
      run: |
        mapfile -t debs < <(find out -maxdepth 1 -type f -name 'satpulse_*_amd64.deb' -print)
        test "${#debs[@]}" -eq 1
        sudo dpkg -i "${debs[0]}"

    - name: System smoke test
      run: sudo python3 smoketest/system.py --force

    - name: Upload system smoke artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: system-smoke-artifacts
        path: /tmp/satpulse-system-smoke-*
        if-no-files-found: ignore
