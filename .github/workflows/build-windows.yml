# This workflow tests native Windows builds and the Windows package built on Linux.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build (Windows)

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:

  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Build
      run: .\win-build.ps1

    - name: Test
      run: go test ./...

  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc zip

    - name: Build package
      run: make winzip

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: windows-package
        path: out/satpulse_*_windows_amd64.zip
        if-no-files-found: error
        retention-days: 7

  package-test:
    needs: package
    runs-on: windows-latest
    steps:
    - name: Download package
      uses: actions/download-artifact@v4
      with:
        name: windows-package
        path: artifact

    - name: Run packaged binaries
      shell: pwsh
      run: |
        $zips = @(Get-ChildItem artifact -Filter *.zip)
        if ($zips.Count -ne 1) {
          throw "Expected one Windows package, found $($zips.Count)"
        }
        Expand-Archive $zips[0].FullName -DestinationPath package
        foreach ($exe in 'satpulsed', 'satpulsetool', 'satpulsewb') {
          & ".\package\$exe.exe" --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }
