# Build and test the GPS tree for js/wasm using Node.js.

name: Build (js/wasm)

on:
  push:
    branches: [ "master", "workbench-web" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Test GPS packages
      env:
        GOOS: js
        GOARCH: wasm
      run: PATH="$PATH:$(go env GOROOT)/lib/wasm" go test ./gps/...

    - name: Compile browser shell
      env:
        GOOS: js
        GOARCH: wasm
      run: go build -tags nohttp -o /dev/null ./cmd/satpulsewbwasm

    - name: Test browser shell
      run: make -f Makefile.wasm test-go

    # nohttp exists to keep net/http out of the browser build; a new import
    # could bring it back without breaking the build.
    - name: Check browser shell does not link net/http
      env:
        GOOS: js
        GOARCH: wasm
      run: |
        if go list -deps -tags nohttp ./cmd/satpulsewbwasm | grep -qx net/http; then
          echo "cmd/satpulsewbwasm depends on net/http" >&2
          exit 1
        fi

  # The browser Workbench in Chromium, against the receiver simulator. Only
  # the browser comes from Playwright's image, as in the Node tests workflow.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: webui/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix webui

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Build
      run: make -f Makefile.wasm test-assets

    - name: Playwright version
      id: playwright
      run: |
        version=$(node -p "require('./webui/package-lock.json').packages['node_modules/@playwright/test'].version")
        test "$version" != "undefined"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Pull the Playwright image
      timeout-minutes: 10
      run: docker pull mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble

    - name: Run e2e suite
      run: |
        docker run --rm --ipc=host \
          --user "$(id -u):$(id -g)" \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$GITHUB_WORKSPACE" \
          --env CI --env HOME=/tmp \
          mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-noble \
          npm run e2e --prefix webui --workspace @satpulse/e2e -- --project=workbench-wasm

    - name: Upload e2e artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-wasm-artifacts
        path: |
          webui/packages/e2e/test-results/
          webui/packages/e2e/playwright-report/
        if-no-files-found: ignore
        retention-days: 7
