# Build and test the GPS tree for js/wasm using Node.js.

name: Build (js/wasm)

on:
  push:
    branches: [ "master", "workbench-web" ]
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'

    - name: Test GPS packages
      env:
        GOOS: js
        GOARCH: wasm
      run: PATH="$PATH:$(go env GOROOT)/lib/wasm" go test ./gps/...

    - name: Compile browser shell
      env:
        GOOS: js
        GOARCH: wasm
      run: go build -tags nohttp -o /dev/null ./cmd/satpulsewbwasm

    # nohttp exists to keep net/http out of the browser build; a new import
    # could bring it back without breaking the build.
    - name: Check browser shell does not link net/http
      env:
        GOOS: js
        GOARCH: wasm
      run: |
        if go list -deps -tags nohttp ./cmd/satpulsewbwasm | grep -qx net/http; then
          echo "cmd/satpulsewbwasm depends on net/http" >&2
          exit 1
        fi
