# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build (Linux)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Install packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Build deb package
      run: |
        make clean
        make deb ALL_GOARCH=amd64

    - name: Test
      run: make test

    - name: Smoke test
      run: python3 smoketest/run.py --sudo

    - name: Install deb package
      run: |
        mapfile -t debs < <(find out -maxdepth 1 -type f -name 'satpulse_*_amd64.deb' -print)
        test "${#debs[@]}" -eq 1
        sudo dpkg -i "${debs[0]}"

    - name: System smoke test
      run: sudo python3 smoketest/system.py --force
