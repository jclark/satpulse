# This workflow builds satpulsetool on macOS using bsd-build.sh
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build (macOS)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.x'

    - name: Build
      run: ./bsd-build.sh

    - name: Test
      run: go test ./...

    - name: Smoke test
      run: python3 smoketest/run.py --sudo
